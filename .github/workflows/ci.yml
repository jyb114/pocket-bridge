# Isolated CI covers platform-independent checks, parsing, and tests that
# provide their own fake targets or local HTTP services. It does not verify
# real phones, installed DSH/Codex, a live gateway, or tunnel availability.
# A green CI result is not a complete release acceptance test.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  ci-subset:
    # The product and the isolated interaction fixtures target Windows paths,
    # locale behavior, and browser sizing. Run CI on the supported platform.
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24.18.1', '24.21.0']

    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan checks repository history, not only the latest tree.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Diagnostic branch only: preserve the 8-second production deadline and
      # report exact owned-child errors before the aggregate suite truncates output.
      - name: Record bounded Windows Unicode pipe evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/test-dsh-runtime.js
          $syncExit = $LASTEXITCODE
          node scripts/test-dsh-runtime-async.js
          $asyncExit = $LASTEXITCODE
          if ($syncExit -ne 0 -or $asyncExit -ne 0) { throw "Unicode fixture failed: sync=$syncExit, async=$asyncExit" }

      # This project has no third-party npm dependencies.

      - name: Run isolated test suite
        if: always()
        run: node scripts/run-ci-tests.js

      - name: Scan files and history for secrets
        run: node scripts/secret-scan.js --strict
