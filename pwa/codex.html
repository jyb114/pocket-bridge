<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Bridge">
<!-- PWA 声明。以前没有这几行：manifest 和图标在服务器上都有，却没人引用，
     于是 iOS 只能自己去探测 /apple-touch-icon-120x120.png，404，主屏图标是空的。 -->
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Codex</title>
<style>
  /* ── 设计基调 ───────────────────────────────────────────────────────────────
     这套值不是拍脑袋定的，是从 DSH 手机版页面上**量出来的**（见 scripts/measure-dsh-ui.js）：
     底色 #151517、卡片 #1b1b1c、分隔线 #2c2c2e、正文 16px、强调色 #679efe。
     两个界面放在一起看要是同一个产品，而不是两个拼凑的工具。 */
  :root{
    color-scheme:dark;
    --bg:#151517;          /* DSH 的 body 底色 */
    --card:#1b1b1c;        /* 次级块 */
    --card2:#232325;
    --line:#2c2c2e;        /* 分隔线 */
    --line2:#353638;
    --fg:#f9fafb;          /* 主文字 */
    --dim:#81858c;         /* 次要文字 */
    --dim2:#adb2b8;
    --accent:#679efe;      /* DSH 用的那个浅蓝 */
    --accent2:#3b5bfe;     /* 实心按钮的蓝 */
    --ok:#3ddc84; --warn:#e0b341; --bad:#e06c6c;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --rail:44px;           /* 左侧图标栏宽度，和 DSH 那种窄栏一致 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.62;
    display:flex;flex-direction:column;
    /* 100dvh 管的是浏览器地址栏收放，**管不到软键盘** —— iOS 上键盘弹出时
       只改 visualViewport，不改布局视口，于是输入框会被盖住。
       所以再减去 --kb（由下面的 visualViewport 监听写进来，桌面上恒为 0）。 */
    height:calc(100dvh - var(--kb,0px));overflow:hidden;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  /* 键盘焦点必须看得见。
     手机页是触摸优先，但接了键盘（iPad 妙控键盘、安卓蓝牙键盘）就得能看清
     焦点在哪 —— 看不见焦点就等于不能用键盘操作。控制台那边一直有这条，
     手机页漏了；`-webkit-tap-highlight-color:transparent` 又把点击高亮关了，
     所以这里必须显式补上。 */
  button:focus-visible,summary:focus-visible,a:focus-visible,
  input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ── 顶栏 ───────────────────────────────────────────────────────────────── */
  header{
    flex:none;display:flex;align-items:center;gap:8px;
    padding:calc(var(--safe-t) + 9px) 12px 9px;
    background:rgba(11,11,12,.93);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);position:relative;z-index:6;
  }
  header h1{font-size:16.5px;margin:0;font-weight:640;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:var(--card);flex:none;font-size:16px;line-height:1}
  .ico:active{background:var(--card2)}
  .conn{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);flex:none}
  .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .conn.ok .dot{background:var(--ok)} .conn.bad .dot{background:var(--bad)}
  .conn.wait .dot{background:var(--warn);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.3}}
  #task-status{flex:none;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  #task-status[hidden]{display:none}
  #task-status .task-top{display:flex;align-items:center;gap:8px;font-size:14px}
  #task-status .task-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  #task-status[data-kind="running"] .task-dot,#task-status[data-kind="thinking"] .task-dot{background:var(--accent);animation:pulse 1.3s infinite}
  #task-status[data-kind="completed"] .task-dot{background:var(--ok)}
  #task-status[data-kind="waitingApproval"] .task-dot,#task-status[data-kind="waitingInput"] .task-dot{background:var(--warn)}
  #task-status[data-kind="failed"] .task-dot,#task-status[data-kind="offline"] .task-dot{background:var(--bad)}
  #task-detail{font-size:12px;color:var(--dim2);margin-top:3px;overflow-wrap:anywhere}
  #task-activity{font-size:13px;color:var(--dim2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  #task-refresh{margin-left:auto;font-size:12px;color:var(--accent);padding:14px 10px;flex:none}
  button:disabled{opacity:.45;cursor:default}
  #attachments{display:flex;gap:7px;overflow-x:auto;max-height:112px;padding:4px 0 8px}
  #attachments:empty{display:none}
  .attachment{display:flex;align-items:center;gap:7px;min-width:170px;max-width:250px;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .attachment img{width:42px;height:42px;object-fit:cover;border-radius:6px}
  .attachment .info{min-width:0;flex:1;font-size:12px;overflow-wrap:anywhere}
  .attachment .status{color:var(--dim);font-size:11px}
  .attachment button{font-size:12px;flex:none;padding:5px}
  #send-mode{min-height:44px;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;max-width:112px;font:inherit;font-size:12px;padding:5px}
  #queued-messages{max-height:130px;overflow:auto;font-size:12px;margin-bottom:5px}
  #queued-messages:empty{display:none}
  .queued-row{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid var(--line)}
  .queued-row span{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .queued-row button{color:var(--dim2);font-size:12px;flex:none}

  main{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    /* 关掉浏览器自带的「滚动锚定」。
       它会在我往上插入旧内容时自动调整 scrollTop —— 而我自己也在调整，
       两边各补一次就翻倍：实测我补了 2513px，它又补了 2920px，
       结果页面猛地跳走。自己要控制滚动位置时，这个自动行为必须关掉。 */
    overflow-anchor:none;
  }
  main *{overflow-anchor:none}
  .pad{padding:13px}

  /* ── 会话列表 ───────────────────────────────────────────────────────────── */
  .search{
    display:flex;align-items:center;gap:8px;background:var(--card);border-radius:11px;
    padding:9px 12px;margin-bottom:11px;border:1px solid var(--line);
  }
  .search input{flex:1;background:none;border:0;outline:none;color:var(--fg);
    font:inherit;font-size:14.5px;min-width:0}
  .search input::placeholder{color:var(--dim2)}
  .sec{font-size:11.5px;color:var(--dim2);margin:16px 2px 7px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase}
  .sec:first-child{margin-top:2px}

  /* ── 会话列表：按**项目**分组，可以折叠，行为与 DSH 一致 ──
     折叠状态记在 localStorage 里：翻过一次的项目下次还是合着的，
     否则每次进列表都要重新折一遍，等于没做。 */
  .pghead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:none;border:0;color:var(--fg);padding:14px 2px 8px;font:inherit}
  .pghead .arw{color:var(--dim2);font-size:11px;transition:transform .15s;flex:none}
  .pghead.closed .arw{transform:rotate(-90deg)}
  .pghead .nm{font-size:13.5px;font-weight:650;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .pghead .cnt{font-size:11px;color:var(--dim2);background:#242429;border-radius:6px;
    padding:1px 7px;flex:none}
  .pghead .live{font-size:11px;color:#8ce0a8;background:#1e3c29;border-radius:6px;
    padding:1px 7px;flex:none}
  .pghead .pth{font-size:10.5px;color:var(--dim2);margin-left:auto;flex:none;
    max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    direction:rtl;text-align:left}
  .pgwrap{margin:0 0 6px}
  .pgfold{font-size:12px;color:var(--dim2);background:none;border:0;font:inherit;
    padding:2px 2px 0;cursor:pointer}

  .item{
    display:block;width:100%;text-align:left;background:var(--card);
    border-radius:13px;padding:13px 14px;margin-bottom:8px;border:1px solid transparent;
  }
  .item:active{background:var(--card2)}
  .item .t{font-size:14.5px;font-weight:540;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .m{display:flex;gap:7px;align-items:center;margin-top:7px;
    font-size:11.5px;color:var(--dim2);flex-wrap:wrap}
  .chip{background:#242429;border-radius:6px;padding:1px 7px;font-size:11px}
  .chip.run{background:#1e3c29;color:#8ce0a8}
  .chip.appr{background:#3a2f16;color:#e8c07a}
  .chip.wait{background:#20303a;color:#8fc6e0}
  /* 未读点：靠 updatedAt 和本地「上次打开」比出来，不猜内容 */
  .item .t .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--accent);margin-right:7px;vertical-align:middle}

  /* ── 消息 ───────────────────────────────────────────────────────────────── */
  .msg{margin-bottom:14px}
  .msg .who{font-size:11.5px;color:var(--dim2);margin-bottom:4px}
  .bub{border-radius:14px;padding:10px 13px;white-space:pre-wrap;word-break:break-word;
    overflow-wrap:anywhere}
  .msg.user .bub{background:var(--accent2);color:#fff;border-bottom-right-radius:5px}
  .msg.user{margin-left:10%}
  .msg.agent .bub{background:var(--card);border-bottom-left-radius:5px}
  .msg.err .bub{background:#2a1c1c;color:#f0a0a0;font-size:13.5px}

  /* markdown */
  .bub h1,.bub h2,.bub h3{font-size:15.5px;margin:12px 0 5px;font-weight:650}
  .bub h1:first-child,.bub h2:first-child,.bub h3:first-child{margin-top:0}
  .bub p{margin:0 0 8px} .bub p:last-child{margin-bottom:0}
  .bub ul,.bub ol{margin:5px 0 8px;padding-left:21px}
  .bub li{margin-bottom:3px}
  .bub code{background:#00000055;padding:1px 5px;border-radius:5px;font-size:13px;
    font-family:ui-monospace,Menlo,monospace}
  .bub pre{background:#0e0e11;border:1px solid var(--line);border-radius:9px;
    padding:10px;overflow-x:auto;font-size:12.5px;margin:8px 0;line-height:1.55}
  .bub pre code{background:none;padding:0}
/* 交付文件：正文里那种 :codex-file-citation{...} 标记渲染成这个（点一下就下载） */
.bub .filecite{display:flex;align-items:center;gap:8px;width:100%;margin:6px 0;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#0e0e11;
  color:var(--text);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.bub .filecite:hover{border-color:var(--accent)}
.bub .filecite .fc-go{margin-left:auto;color:var(--accent);font-size:12.5px;white-space:nowrap}
  .bub a{color:#8ab4ff}
  .bub blockquote{border-left:3px solid var(--line2);margin:8px 0;padding-left:11px;
    color:var(--dim)}
  .bub hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .bub table{border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}
  .bub th,.bub td{border:1px solid var(--line2);padding:5px 9px;text-align:left}
  .cursor:after{content:'▍';color:var(--accent);animation:pulse 1s infinite}
  /* 内容被截断时给个说明，别让人以为东西丢了 */
  /* 图片产出：直接显示出来 */
  .imgbox{margin-bottom:11px}
  .imgbox a{display:block;text-decoration:none}
  .imgbox img{width:100%;border-radius:12px;border:1px solid var(--line);
    background:#0e0e11;display:block;min-height:40px}
  .imgcap{font-size:11.5px;color:var(--dim);margin-top:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 文件卡片：点开看内容 */
  .filecard{display:flex;align-items:center;gap:9px;padding:10px 8px;border-radius:10px;
    text-decoration:none;color:inherit}
  .filecard:active{background:var(--card2)}
  .filecard .fi{flex:none;font-size:16px}
  .filecard .fn{flex:1;min-width:0;font-size:13px;font-family:ui-monospace,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c9d4}
  .filecard .fnote{flex:none;font-size:11.5px;color:var(--dim2);min-width:18px;text-align:center}
  .filecard .fgo{flex:none;font-size:12px;color:var(--accent)}
  .toolhd{display:flex;align-items:center;gap:9px;padding:10px 13px;font-size:13px}

  .clipped{margin-top:8px;font-size:11.5px;color:var(--dim);
    border-top:1px dashed var(--line2);padding-top:6px}

  /* 思考过程 */
  .think{border-left:2px solid var(--line2);padding:2px 0 2px 11px;margin-bottom:12px}
  .think summary{font-size:12.5px;color:var(--dim);cursor:pointer;list-style:none;
    user-select:none;display:flex;align-items:center;gap:6px}
  .think summary::-webkit-details-marker{display:none}
  .think summary:before{content:'▸';transition:transform .15s;display:inline-block;
    color:var(--dim2)}
  .think[open] summary:before{content:'▾'}
  .think .body{font-size:13px;color:var(--dim);white-space:pre-wrap;
    word-break:break-word;margin-top:7px;line-height:1.65}

  /* 工具 / 命令 / 文件改动 */
  .tool{background:#131317;border:1px solid var(--line);border-radius:12px;
    margin-bottom:11px;overflow:hidden}
  .tool summary{list-style:none;cursor:pointer;padding:10px 13px;
    display:flex;align-items:center;gap:9px;user-select:none}
  .tool summary::-webkit-details-marker{display:none}
  .tool .kind{font-size:11px;color:var(--dim2);flex:none;min-width:34px}
  .tool .head{flex:1;min-width:0;font-size:13px;font-family:ui-monospace,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c9d4}
  .tool .badge{font-size:11px;flex:none;padding:1px 7px;border-radius:6px;
    background:#242429;color:var(--dim)}
  .tool .badge.ok{background:#16301f;color:#7fd8a0}
  .tool .badge.bad{background:#301a1a;color:#e0a0a0}
  .tool .out{margin:0;padding:0 13px 12px;font-family:ui-monospace,Menlo,monospace;
    font-size:12px;color:#b0b0bb;white-space:pre-wrap;word-break:break-all;
    max-height:340px;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
  .tool .out:empty{display:none}
  .files{list-style:none;margin:0;padding:0 13px 11px;border-top:1px solid var(--line);
    padding-top:9px}
  .files li{font-size:12.5px;font-family:ui-monospace,Menlo,monospace;color:#c9c9d4;
    padding:3px 0;display:flex;gap:8px}
  .files li .st{flex:none;color:var(--dim2);min-width:20px}
  .files li .st.add{color:#7fd8a0} .files li .st.del{color:#e0a0a0}

  /* 计划 */
  .plan{background:#131317;border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:11px}
  .plan .h{font-size:11.5px;color:var(--dim2);margin-bottom:7px}
  .plan .s{display:flex;gap:8px;font-size:13.5px;padding:3px 0;line-height:1.5}
  .plan .s .m{flex:none;color:var(--dim2)}
  .plan .s.done{color:var(--dim2);text-decoration:line-through}
  .plan .s.doing{color:#9dc4ff}

  /* 审批 */
  .appr{border:1px solid #6b5a1f;background:#231d0d;border-radius:13px;
    padding:13px 15px;margin-bottom:12px}
  .appr .h{font-size:12px;color:#e8d49a;margin-bottom:7px;font-weight:600}
  .appr .c{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#f0e6c0;
    background:#00000044;border-radius:8px;padding:9px 11px;white-space:pre-wrap;
    word-break:break-all;max-height:180px;overflow:auto}
  .appr .w{font-size:11.5px;color:#b9a878;margin-top:6px}
  .appr .btns{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .appr .btns button{font-size:13px;padding:8px 14px;border-radius:9px;
    background:#332c14;border:1px solid #5a4a1f;color:#f0e6c0}
  .appr .btns button.p{background:#2f7d4f;border-color:#2f7d4f;color:#fff;font-weight:600}
  .appr .btns button.d{color:#f0b0a8}
  .appr .btns button:disabled{opacity:.5}

  /* ── 输入区：照着 DSH 的样子做 ───────────────────────────────────────────────
     DSH 的输入区不是「一行输入框 + 一个按钮」，而是一个圆角大框，
     里面上面写内容、下面一排小图标，发送键是右侧一个实心圆。
     照这个结构做，两个界面切换时才不会有割裂感。 */
  footer{
    flex:none;padding:8px 12px calc(8px + var(--safe-b));
    background:var(--bg);
  }
  .composer{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:10px 12px 8px;
  }
  .composer:focus-within{border-color:var(--line2)}
  textarea{
    width:100%;background:none;border:0;color:var(--fg);font:inherit;
    padding:2px 2px 6px;resize:none;max-height:150px;min-height:26px;
    line-height:1.5;outline:none;
  }
  textarea::placeholder{color:var(--dim)}
  .iconrow{display:flex;align-items:center;gap:14px}
  .iconrow .sp{flex:1}
  .ibtn{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    color:var(--dim);font-size:16px;flex:none;
  }
  .ibtn:active{background:var(--card2);color:var(--fg)}
  /* ── 触控热区 ────────────────────────────────────────────────────────────
     视觉上是 32/34px 的小按钮，但 iOS 人机指南要求可点区域至少 44×44 ——
     手机上点不准是很实际的体验问题，尤其是右下角这些拇指够得着的常用键。

     做法是用一个透明的伪元素把**可点范围**撑开 6px，视觉大小和排版都不变。
     比直接把按钮做大更好：既满足触控，又不会把输入区挤得没地方。 */
  .ibtn, .send, .ico{position:relative}
  .ibtn::after, .send::after, .ico::after{
    content:'';position:absolute;inset:-5px;border-radius:inherit}
  .send{
    width:34px;height:34px;border-radius:50%;background:var(--accent2);flex:none;
    display:grid;place-items:center;color:#fff;font-size:17px;
  }
  .send:disabled{background:var(--card2);color:var(--dim)}
  .stop{background:var(--bad);color:#fff;font-size:13.5px;padding:0 15px;
    height:34px;border-radius:17px;flex:none;font-weight:600}

  /* ── 状态 ───────────────────────────────────────────────────────────────── */
  .empty{text-align:center;color:var(--dim);padding:52px 22px;font-size:14px;line-height:2}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.45}
  .btn{display:block;width:100%;background:var(--card);border-radius:12px;
    padding:13px;text-align:center;font-weight:600;margin:0 0 9px}
  .btn.p{background:var(--accent2);color:#fff}
/* 危险按钮：会关掉电脑上的程序的那种。
   原来代码里一直写着 class="btn d"，但这个类没有样式 ——
   于是「释放电脑端的锁」在手机上跟普通按钮长得一样，使用者误按了它。 */
.btn.d{background:#3a1d1d;border:1px solid #a33;color:#ffd7d2;font-weight:600}
.btn.d:active{background:#4a2222}
/* 危险按钮上方的警告条：红底 + 加粗标题 */
.warn-red{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid #a33;
  background:#2a1515;color:#ffd7d2;font-size:12.5px;line-height:1.7}
.warn-red b{color:#ff9d92}
  .btn:active{opacity:.8}
  .skel{background:linear-gradient(90deg,#17171a,#202027,#17171a);background-size:200% 100%;
    animation:sh 1.3s infinite;border-radius:13px;height:70px;margin-bottom:8px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* 弹出面板 */
  .sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;
    align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet .inner{background:var(--card);width:100%;max-width:520px;
    border-radius:18px 18px 0 0;padding:8px 12px calc(14px + var(--safe-b));
    max-height:88dvh;overflow-y:auto}

  /* 账户卡 */
  .acct{background:var(--bg);border:1px solid var(--line);border-radius:14px;
    padding:11px 14px;margin:8px 0 4px}
  .acct .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;
    font-size:14px}
  .acct .k{color:var(--dim)}
  .acct .v{color:var(--fg);text-align:right;word-break:break-all}
  .usage{margin-top:9px}
  .ubar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
  .ubar i{display:block;height:100%;background:var(--accent);border-radius:3px;
    transition:width .3s}
  .utxt{display:flex;justify-content:space-between;font-size:11.5px;
    color:var(--dim);margin-top:5px}

  .stitle{font-size:11.5px;color:var(--dim);padding:14px 4px 5px;
    letter-spacing:.05em;text-transform:uppercase}

  .srow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 10px;border-radius:11px;font-size:15.5px}
  .srow:active{background:var(--card2)}
  .srow .k{flex:1;min-width:0}
  .srow .v{color:var(--dim);font-size:13.5px;max-width:52%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .srow .arw{color:var(--dim);flex:none}

  .shead{display:block;width:100%;text-align:left;padding:14px 10px;
    font-size:15.5px;font-weight:600;color:var(--accent)}
  .sopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 10px;border-radius:11px}
  .sopt:active{background:var(--card2)}
  .sopt .t{font-size:15.5px;flex:none}
  .sopt .s{color:var(--dim);font-size:12px;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
  .sopt.on .t{color:var(--accent)}
  .sopt .ck{color:var(--accent);font-weight:700;flex:none}
  .sclose{display:block;width:100%;text-align:center;padding:14px;
    color:var(--dim);font-size:15px;margin-top:6px}
  .sheet .info{padding:4px 10px 12px;font-size:12.5px;color:var(--dim);line-height:1.7}

<!-- 这四个必须在这里加载，而且必须在内联脚本之前。
     这一页原来一个外部脚本都没有 —— 意味着 Codex 界面的通信**一直是明文的**：
     端到端加密模块根本没被加载过，WebSocket 也就没人去接管。
     是写语音功能时才发现「咦，这一页怎么什么都没有」。
     e2ee.js 还要赶在页面自己的脚本建立连接之前，所以放在最靠前的位置。 -->

<body>

<header>
  <button class="ico" id="back" style="display:none" aria-label="返回" data-i18n-aria="返回">‹</button>
  <h1 id="title">Codex</h1>
  <span class="conn wait" id="conn"><span class="dot"></span><span id="conntext" data-i18n="连接中">连接中</span></span>
  <!-- 只在「我们正握着这条会话的写锁」时出现（也就是刚发完消息、还没还回去的那一小会儿）。
       使用者在电脑上打不开同一个会话时，至少能从手机上看出是这边占着。 -->
  <span id="lockhint" role="button" tabindex="0" title="手机正占着这条会话 —— 点这里可以还回去或让电脑端交出来" data-i18n-title="手机正占着这条会话 —— 点这里可以还回去或让电脑端交出来" data-i18n="🔒 占用中" style="display:none;align-items:center;
    gap:4px;font-size:11px;color:var(--warn);flex:none;cursor:pointer">🔒 占用中</span>
  <button class="ico" id="menu" aria-label="菜单">⋯</button>
</header>
<section id="task-status" role="status" aria-live="polite" hidden>
  <div class="task-top"><span class="task-dot"></span><strong id="task-label" data-i18n="正在确认任务状态…">正在确认任务状态…</strong><button id="task-refresh" type="button" data-i18n="刷新状态">刷新状态</button></div>
  <div id="task-detail"></div>
  <div id="task-activity"></div>
</section>

<main id="main">
  <div class="pad" id="body"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <!-- 审批卡放在这个独立容器里，不能混在 #body 里 ——
       #body 在切换会话/返回列表时会被整个清空，那样审批卡会被悄悄抹掉：
      Codex 那边还在等你答复，界面上却什么都没有。 -->
  <div class="pad" id="apprs"></div>
</main>

<footer id="footer" style="display:none">
  <div id="queued-messages" aria-live="polite"></div>
  <div id="attachments" aria-live="polite"></div>
  <input type="file" id="pick-images" accept="image/*" multiple hidden>
  <input type="file" id="pick-files" multiple hidden>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="说点什么…" data-i18n-ph="说点什么…"></textarea>
    <div class="iconrow">
      <button class="ibtn" id="btn-attach" aria-label="添加图片或文件" title="添加图片或文件" data-i18n-aria="添加图片或文件" data-i18n-title="添加图片或文件">＋</button>
      <button class="ibtn" id="btn-bottom" aria-label="回到最新" title="跳到最新" data-i18n-aria="回到最新" data-i18n-title="跳到最新">⇣</button>
      <button class="ibtn" id="btn-voice" aria-label="语音输入" title="语音输入" data-i18n-aria="语音输入">🎤</button>
      <!-- ★ 「释放电脑端的锁」放在语音旁边，提高入口可发现性。
           它原来只在「被占用」那张错误卡片上（= 撞上冲突才看得到），
           那不叫入口。这里是输入区，只要开着会话就在眼前。
           点它直接走释放流程（确认框仍然会先把代价说清）。 -->
      <button class="ibtn" id="btn-lock" aria-label="释放电脑端的锁" title="释放电脑端的锁：电脑上的 Codex 占着这条会话、手机上发不出消息时用它"
        data-i18n-aria="释放电脑端的锁" data-i18n-title="释放电脑端的锁：电脑上的 Codex 占着这条会话、手机上发不出消息时用它">🔓</button>
      <span class="sp"></span>
      <select id="send-mode" aria-label="执行中发送方式" data-i18n-aria="执行中发送方式"><option value="queue" data-i18n="排队发送">排队发送</option><option value="immediate" data-i18n="立即补充">立即补充</option></select>
      <button class="send" id="send" aria-label="发送">↑</button>
    </div>
  </div>
</footer>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>

/* Codex 手机界面
 *
 * 目标：和电脑上差不多 —— 能看见它在想什么、跑什么命令、改了哪些文件、要你批准什么。
 *
 * 协议全部来自真实服务（不是照 schema 猜的）：
 *   initialize        {clientInfo}
 *   thread/list       {limit,searchTerm} → {data:[…]}, 每条带 section / status / model
 *   thread/items/list {threadId,limit}   → {data:[{turnId,item}]}
 *   turn/start        {threadId,input:[{type:'text',text}]}
 *   turn/interrupt    {threadId}
 *   thread/name/set   {threadId,name}    thread/archive {threadId}
 *   model/list        {}                 → {data:[{id,displayName}]}
 *
 * 推送：
 *   item/started | item/completed       带完整 item → 按 itemId 建索引更新
 *   item/agentMessage/delta             {itemId,delta}
 *   item/reasoning/summaryTextDelta     {itemId,summaryIndex,delta}
 *   item/commandExecution/outputDelta   {itemId,delta}
 *   turn/plan/updated                   {plan:[…]}
 *
 * 服务端还会**反过来请求**客户端，最重要的是审批：
 *   item/commandExecution/requestApproval → 应答 {decision:'accept'|'acceptForSession'|'decline'|'cancel'}
 *   item/fileChange/requestApproval       → 同上
 *   execCommandApproval / applyPatchApproval（老接口）→ {decision:'approved'|'approved_for_session'|{denied:{rejection}}|'abort'}
 * 不应答的话，需要授权的操作会一直卡着 —— 电脑版上就是个弹窗，手机上不能没有。
 */

var tr = t;

  "消息未发送：会话由另一个执行服务占用": { en: "Message not sent: another executor holds this conversation", es: "Mensaje no enviado: otro ejecutor tiene esta conversación" },
  "这条会话正开在电脑上，手机发不出去。<br><br>你能做的：<br>· 点下面「释放电脑端的锁」→ 手机继续用这条会话（会关掉电脑上的 Codex，正在跑的任务可能被中断）<br>· 或者另开一条会话（不会接着当前任务的进度）<br><br>你输入的内容和附件都还在。": { en: "This conversation is open on your computer, so the phone cannot send.<br><br>What you can do:<br>· Tap “Release the lock on the computer” below → keep using this conversation on the phone (it closes Codex on the computer, so a running task may be interrupted)<br>· Or start a new conversation (it will not continue the current task)<br><br>Your text and attachments are still here.", es: "Esta conversación está abierta en el ordenador, así que el teléfono no puede enviar.<br><br>Qué puedes hacer:<br>· Pulsa «Liberar el bloqueo del ordenador» → sigue usando esta conversación en el teléfono (cierra Codex en el ordenador, así que una tarea en curso puede interrumpirse)<br>· O abre otra conversación (no continuará la tarea actual)<br><br>Tu texto y adjuntos siguen aquí." },
  "释放手机端的锁": { en: "Release the lock on the phone", es: "Liberar el bloqueo del teléfono" },
  "释放手机端的锁？\n\n· 只松开手机这边占的会话\n· 不会动电脑上的 Codex，正在跑的任务不受影响\n· 手机下次发消息会自动重新接上\n\n确定吗？": {
    en: "Release the lock on the phone?\n\n· Only the phone's hold on this session is released\n· Codex on your computer is not touched; running tasks are unaffected\n· The phone reconnects automatically next time you send\n\nContinue?",
    es: "¿Liberar el bloqueo del teléfono?\n\n· Solo se libera la retención del teléfono sobre esta sesión\n· No se toca Codex en tu ordenador; las tareas en curso no se ven afectadas\n· El teléfono se reconecta solo la próxima vez que envíes\n\n¿Continuar?"
  },
  "正在释放手机端的锁…": { en: "Releasing the lock on the phone…", es: "Liberando el bloqueo del teléfono…" },
  "手机端的锁已经松开（电脑上的 Codex 没被动过）。": {
    en: "The phone's lock is released (Codex on your computer was not touched).",
    es: "El bloqueo del teléfono está liberado (no se tocó Codex en tu ordenador)."
  },
  "释放手机端的锁：没成功": { en: "Release the phone-side lock: it did not work", es: "Liberar el bloqueo del teléfono: no funcionó" },
  "只松开手机这边占的会话，不会动电脑上的 Codex，也不会打断正在跑的任务。": {
    en: "Only releases the phone's hold on this session — Codex on your computer is not touched and running tasks are not interrupted.",
    es: "Solo libera la retención del teléfono sobre esta sesión: no se toca Codex en tu ordenador ni se interrumpen las tareas en curso."
  },
  "释放电脑端的锁": { en: "Release the lock on the computer", es: "Liberar el bloqueo del ordenador" },
  "电脑上的 Codex 开着这条会话时，手机发不出消息。点它让电脑端交出来（占着的是手机这端时，就是还回去）。": {
    en: "When this conversation is open in desktop Codex, the phone cannot send messages. Tap to hand it over from the computer (if the phone holds it, the lock is simply released).",
    es: "Si esta conversación está abierta en Codex del ordenador, el teléfono no puede enviar mensajes. Toca para cederla desde el ordenador (si la tiene el teléfono, solo se libera el bloqueo)."
  },
  "会关掉电脑上的 Codex，正在跑的任务可能被中断；会话内容不会丢。": {
    en: "Desktop Codex will close and a running task may be interrupted; the conversation itself will not be lost.",
    es: "Codex en el ordenador se cerrará y una tarea en curso podría interrumpirse; la conversación no se perderá."
  },
  "什么是「锁」：同一条会话同时只能有一个写入者。电脑上的 Codex 开着这条会话时，它占着写权限 —— 手机能看，但一发消息就报「会话由另一个执行服务占用」。下面两颗按钮给出两条出路，代价完全不同。": {
    en: "What the “lock” is: only one writer may hold a conversation at a time. When Codex on your computer has this conversation open, it holds the write permission — the phone can read, but sending reports “the conversation is held by another execution service”. The two buttons below are two different ways out, with very different costs.",
    es: "Qué es el «bloqueo»: solo un escritor puede tener una conversación a la vez. Cuando Codex en tu ordenador tiene abierta esta conversación, retiene el permiso de escritura: el teléfono puede leer, pero al enviar aparece «la conversación está en uso por otro servicio de ejecución». Los dos botones de abajo son dos salidas con costes muy distintos."
  },
  "只松开手机这边占的会话：不动电脑上的任何程序，也不打断任何任务。手机关掉或断开一会儿之后会**自动**松开，所以通常不用点它。": {
    en: "Releases only the phone's hold on this conversation: no program on your computer is touched and no task is interrupted. It is also released **automatically** a while after the phone closes or disconnects, so you normally never need this button.",
    es: "Libera solo la retención del teléfono sobre esta conversación: no se toca ningún programa del ordenador ni se interrumpe ninguna tarea. También se libera **automáticamente** un rato después de cerrar o desconectar el teléfono, así que normalmente no hace falta pulsarlo."
  },
  "⚠️ 会关掉电脑上的 Codex，正在跑的任务可能被中断": {
    en: "⚠️ This closes Codex on your computer; a running task may be interrupted",
    es: "⚠️ Esto cierra Codex en tu ordenador; una tarea en curso puede interrumpirse"
  },
  "它让**电脑端**交出写权限，代价是关掉电脑上的 Codex（会话内容不会丢，但那一轮任务会停）。只有「电脑上确实开着这条会话、而你现在必须用手机接着下指令」时才点它。只是想松开手机这边，用上面那颗。": {
    en: "It makes the **computer side** give up the write permission; the cost is closing Codex on your computer (the conversation is not lost, but that turn stops). Use it only when the computer really has this conversation open and you must keep instructing from the phone right now. To release only the phone side, use the button above.",
    es: "Hace que el **lado del ordenador** ceda el permiso de escritura; el coste es cerrar Codex en tu ordenador (la conversación no se pierde, pero ese turno se detiene). Úsalo solo si el ordenador tiene realmente abierta esta conversación y necesitas seguir dando instrucciones desde el teléfono ahora mismo. Para liberar solo el lado del teléfono, usa el botón de arriba."
  },
  "释放电脑端的锁？\n\n· 电脑上的 Codex 会关掉，正在跑的任务可能被中断\n· 会话内容不会丢\n· 之后手机就能接着下指令\n\n确定吗？": { en: "Release the lock on the computer?\n\n· Codex on your computer will close; a running task may be interrupted\n· The conversation itself is not lost\n· After that you can keep sending from the phone\n\nGo ahead?", es: "¿Liberar el bloqueo del ordenador?\n\n· Codex en el ordenador se cerrará; una tarea en curso puede interrumpirse\n· La conversación no se pierde\n· Después podrás seguir enviando desde el teléfono\n\n¿Continuar?" },
  "正在释放电脑端的锁…": { en: "Releasing the lock on the computer…", es: "Liberando el bloqueo del ordenador…" },
  "手机这边之前占着这条会话，锁已经松开。正在重试…": { en: "The phone was holding this conversation; the lock is now free. Retrying…", es: "El teléfono tenía esta conversación; el bloqueo ya está libre. Reintentando…" },
  "这条会话的锁本来就是空的。正在重试…": { en: "This conversation was not locked at all. Retrying…", es: "Esta conversación no estaba bloqueada. Reintentando…" },
  "已经让电脑端交出这条会话（电脑上的 Codex 可能已被关闭）。正在重试…": { en: "The computer side has handed this conversation over (desktop Codex may have been closed). Retrying…", es: "El ordenador ya cedió esta conversación (puede que se haya cerrado Codex en el ordenador). Reintentando…" },
  "锁还是没松开：会话被占着，但电脑上的 Codex 没开着。请稍等再试一次。": { en: "The lock is still held: the conversation is taken, but desktop Codex is not running. Wait a moment and try again.", es: "El bloqueo sigue activo: la conversación está tomada, pero Codex no está abierto en el ordenador. Espera un momento e inténtalo de nuevo." },
  "电脑上的 Codex 已经关掉，但这条会话的锁还是没松开。请稍等再试，或重启电脑端的 Codex。": { en: "Desktop Codex was closed, but this conversation is still locked. Try again in a moment, or restart Codex on the computer.", es: "Codex se cerró en el ordenador, pero esta conversación sigue bloqueada. Inténtalo de nuevo en un momento o reinicia Codex en el ordenador." },

  "会话编号不对，请回到列表重新打开这条会话。": { en: "That conversation id is not valid — go back to the list and open the conversation again.", es: "El identificador de la conversación no es válido; vuelve a la lista y ábrela de nuevo." },

  "现在能拿到这条会话了 —— 占着它的不是电脑那边（多半是手机自己之前占着）。已经还回去，正在重试…": {

function applyI18n() {
  if (!window.DshI18n) return;
  window.DshI18n.apply(document);
  // <html lang> 也跟着走 —— 不然英文页面顶着 lang="zh"，读屏软件会用中文音念英文。
  var code = window.DshI18n.lang();
  document.documentElement.setAttribute('lang', code === 'zh' ? 'zh-CN' : code);
}
applyI18n();

  threads: [], filter: '',

};

var observerEpoch = 0, observerTimer = null, observerBusy = false, activityVersion = 0;
var resumeSubscription = null;

function queueOnly(){return !state.ready || ['checking','unlinked','unknown','offline'].indexOf(task.kind)>=0;}

// saveOnly 的时候界面要临时显示「排队」，但选择本身不能被改掉 ——
// 一旦用界面值当存储，临时状态就会把使用者的选择永久覆盖（见 renderFooter）。
var sendModePrefValue;
function sendModePref(){
  if(sendModePrefValue===undefined){
    try{sendModePrefValue = localStorage.getItem('codex-send-mode')==='immediate' ? 'immediate' : 'queue';}
    catch(e){sendModePrefValue='queue';}
  }
  return sendModePrefValue;
}
function setSendModePref(v){
  sendModePrefValue = v==='immediate' ? 'immediate' : 'queue';
  try{localStorage.setItem('codex-send-mode',sendModePrefValue);}catch(e){}
}
function renderQueue(){
  var box=$('queued-messages');box.innerHTML='';
  if(!queueEntries.length)return;
  var title=document.createElement('div');title.textContent=t('待发送 {n} 条 · 保存在电脑端', {n: queueEntries.length});box.appendChild(title);
  if(task.kind==='unlinked'){
    var connect=document.createElement('button');connect.id='queue-connect';connect.textContent=t('连接并启用队列（不关闭电脑 Codex）');
    connect.disabled=!state.ready||state.resuming;connect.onclick=connectQueuedThread;box.appendChild(connect);
  }
  queueEntries.forEach(function(e){
    var row=document.createElement('div');row.className='queued-row';
    var text=document.createElement('span');text.textContent=(e.state==='error'?t('已暂停：')+e.error+'\n':e.state==='sending'?t('正在发送：'):(e.note||t('已保存，等待确认执行端；尚未发送。'))+'\n')+e.label;row.appendChild(text);
    var cancel=document.createElement('button');cancel.textContent=t('取消');cancel.disabled=e.state==='sending';
    cancel.onclick=function(){if(!state.thread)return;queueRequest({action:'cancel',threadId:state.thread.id,id:e.id}).then(refreshQueue).catch(function(err){toast(err.message);});};
    row.appendChild(cancel);box.appendChild(row);
  });
  if (window.DshI18n) window.DshI18n.apply(box);
}
function connectQueuedThread(){
  if(!state.ready||!state.thread||state.resuming)return;
  var thread=state.thread;state.resuming=true;renderFooter();
  call('thread/resume',{threadId:thread.id,excludeTurns:true},15000).then(function(){
    if(state.thread!==thread)return;
    state.resumed=true;setTask('checking',t('已连接，正在确认任务状态；队列只会在任务正常结束后发送。'));
  }).catch(function(e){
    if(state.thread!==thread)return;
    if(/active writer/i.test(e.message))showWriterConflict(thread, e.message);
    else toast(t('暂未确认连接，队列仍保存：')+e.message);
  }).finally(function(){if(state.thread===thread){state.resuming=false;renderFooter();refreshObservedThread();}});
}
/**
 * 给队列 / 上传 / 会话列表用的 fetch：**请求体和响应都加密**。
 *
 * 响应方向不用在这里处理 —— e2ee.js 的 installFetchDecrypt 已经接管了 fetch，
 * 凡是带 x-dsh-e2ee 的响应都会自动解开并把 content-type 还原（含跨时间段重试）。
 *
 * 没有 body 的时候也必须带上那个头：GET 按规范不能带请求体，但**网关要靠这个头
 * 才肯把响应加密**，不带就退回明文了（经中继时更会被闸门直接拒掉）。
 */
// 交付文件按钮的点击：事件委托，正文每次重画都不用重挂
document.addEventListener('click', function (ev) {
  var el = ev.target;
  while (el && el !== document.body) {
    if (el.getAttribute && el.getAttribute('data-filecite')) {
      ev.preventDefault();
      downloadDeliverable(el.getAttribute('data-filecite'));
      return;
    }
    el = el.parentNode;
  }
});

function privateFetch(url, init) {
  var secret = window.__dshE2eeSecret;
  var E = window.DshE2EE;
  if (!secret || !E || !E.encryptedFetch) return fetch(url, init || {});
  if (init && init.body != null) return E.encryptedFetch(secret, url, init);
  var h = Object.assign({}, (init && init.headers) || {});
  h['x-dsh-e2ee'] = '1';
  return fetch(url, Object.assign({}, init || {}, { headers: h }));
}

function queueRequest(body){return privateFetch('/codex/queue',{method:'POST',headers:{'content-type':'application/json','x-dsh-queue':'1'},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||t('队列请求失败'));return j;});});}
function refreshQueue(){
  if(queueFetchBusy || !state.thread || state.view!=='thread')return;
  var tid=state.thread.id;queueFetchBusy=true;
  return privateFetch('/codex/queue?threadId='+encodeURIComponent(tid),{cache:'no-store'})
    .then(function(r){if(!r.ok)throw Error(t('队列不可用'));return r.json();})
    .then(function(j){if(state.thread && state.thread.id===tid){queueEntries=j.entries||[];renderQueue();}})
    .catch(function(){})
    .finally(function(){queueFetchBusy=false;});
}
function enqueueDraft(text,box,attachments,options){

    } else {
      var depth = 0;
      for (var at = from; at < src0.length && at - from <= 300; at++) {
        var ch = src0.charAt(at);
        if (ch === '\r' || ch === '\n') break;
        if (ch === '(') depth++;
        if (ch === ')') {
          if (!depth) { target = src0.slice(from, at); end = at + 1; break; }
          depth--;
        }
      }
    }
    if (end < 0) continue;
    linkOpen.lastIndex = end;
    target = target.trim();
    if (!isLocalPath(target)) continue;
    var ph = '\u0000L' + links.length + '\u0000';
    links.push(citationButtonHtml(target, 'open', match[1]));
    linkParts.push(src0.slice(linkCursor, match.index), ph);
    linkCursor = end;
  }
  linkParts.push(src0.slice(linkCursor));
  src0 = linkParts.join('');

  codeSpans.forEach(function (m, i) { src0 = src0.replace('\u0000I' + i + '\u0000', m); });

  var out = esc(src0);

  // 链接占位符要在 esc 之后放回来（和交付标记同一套路）
  links.forEach(function (html, i) { out = out.replace('\u0000L' + i + '\u0000', html); });

  // 代码块先摘出来，免得里面的内容被后面的规则改坏
  var blocks = [];
  out = out.replace(/```(\w*)\n?([\s\S]*?)```/g, function (m, lang, code) {
    blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
    return '\u0000B' + (blocks.length - 1) + '\u0000';
  });

  out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  out = out.replace(/^###### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^##### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^#### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>');
  out = out.replace(/^\s*[-*] (.*)$/gm, '\u0000L$1\u0000');
  out = out.replace(/^\s*(\d+)\. (.*)$/gm, '\u0000L$1. $2\u0000');
  out = out.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  out = out.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  out = out.replace(/^---+$/gm, '<hr>');

  // 连续的行内列表项合并成 <ul>
  out = out.replace(/(?:\u0000L[^\u0000]*\u0000)+/g, function (chunk) {
    var items = chunk.split('\u0000').filter(function (x) { return x.indexOf('L') === 0; })
      .map(function (x) { return '<li>' + x.slice(1) + '</li>'; }).join('');
    return '<ul>' + items + '</ul>';
  });

  out = out.replace(/\u0000B(\d+)\u0000/g, function (m, i) { return blocks[Number(i)]; });
  // 交付文件的按钮最后还原 —— 它里面是 HTML，不能参与前面的 markdown 规则
  out = out.replace(/\u0000C(\d+)\u0000/g, function (m, i) { return cites[Number(i)] || ''; });
  return out;
}

function relTime(v) {
  if (!v) return '';
  var t = Number(v);
  if (t < 1e12) t *= 1000;
  var d = Math.floor((Date.now() - t) / 1000);
  if (d < 60) return tr('刚刚');
  if (d < 3600) return Math.floor(d / 60) + tr(' 分钟前');
  if (d < 86400) return Math.floor(d / 3600) + tr(' 小时前');
  if (d < 86400 * 30) return Math.floor(d / 86400) + tr(' 天前');
  return new Date(t).toLocaleDateString('zh-CN');
}

function setConn(cls, text) {
  $('conn').className = 'conn ' + cls;
  // text 传进来的一律是中文原文（下面每个调用处都没包 t()）：在这里翻，
  // 并且把原文记成 data-i18n —— 这样切语言时 apply() 会自动刷新它。
  $('conntext').textContent = t(text);
  $('conntext').setAttribute('data-i18n', text);
}

// ── 滚动：跟着最新内容走 ─────────────────────────────────────────────────────
//
// 这里原来是个很容易出错的做法：每次内容变多就问一句「离底部是不是不到 260px」，
// 是就滚。长文本一来就露馅 —— 单次增量一大（比如一整段回复、或者 item/completed
// 触发的整块重建），距离瞬间超过阈值，之后就再也不跟了。使用者的感受就是
// 「一直停在前面那段，看不到最新的」。
//
// 正确做法是记住「使用者是不是在跟着看」：只有他自己往上翻过，才停止跟随；
// 只要他滚回底部，就自动恢复跟随。中间不管内容涨多少都跟住。
var stick = true;

function nearBottom() {
  var m = $('main');
  return m.scrollHeight - m.scrollTop - m.clientHeight < 90;
}

/** 滚到底。force=true 时无视「使用者正在翻历史」 */
function toBottom(force) {
  // 任何一次明确的滚动请求都优先于「往上翻页时的对位」——
  // 不取消的话，刚点完「↓ 最新」就会被那串对位逻辑拽回原来的位置。
  if (state.anchorStop) state.anchorStop();
  if (!force && !stick) { updateJump(); return; }
  var m = $('main');
  m.scrollTop = m.scrollHeight;
  // 布局可能还没算完（图片、字体、展开的 details），下一帧再对一次
  requestAnimationFrame(function () {
    m.scrollTop = m.scrollHeight;
    updateJump();
  });
}

/** 内容变了之后调用：跟随状态下保证看到最新 */
function scrollDown(force) {
  if (force) { stick = true; }
  toBottom(force);
  // 有些内容（等宽字体的代码块、展开的输出）会在随后的几帧里继续撑高，
  // 所以补一次延迟对齐 —— 不然「滚到底了但没到底」。
  clearTimeout(scrollDown._t);
  scrollDown._t = setTimeout(function () {
    if (stick || force) {
      var m = $('main');
      m.scrollTop = m.scrollHeight;
      updateJump();
    }
  }, 220);
}

/** 不在底部时给一个「回到最新」的按钮 —— 不硬拽人，但让人一眼知道有新内容 */
function updateJump() {
  var b = $('jump');
  if (!b) return;
  b.style.display = stick ? 'none' : 'flex';
}

function initScrollWatch() {
  var m = $('main');
  var b = document.createElement('button');
  b.id = 'jump';
  b.textContent = t('↓ 最新');
  b.style.cssText = [
    'position:fixed', 'right:14px', 'bottom:calc(104px + var(--safe-b))',
    'z-index:12', 'display:none', 'align-items:center', 'gap:5px',
    'padding:8px 14px', 'border-radius:999px', 'font-size:12.5px',
    'background:var(--accent2)', 'color:#fff', 'font-weight:600',
    'box-shadow:0 4px 16px #0008', 'border:0'
  ].join(';');
  b.onclick = function () { stick = true; toBottom(true); };
  document.body.appendChild(b);

  m.addEventListener('scroll', function () {
    var was = stick;
    stick = nearBottom();
    if (was !== stick) updateJump();

    // 滑到接近顶部就自动加载更早的内容 —— 分会话不用点「加载更多」，
    // 一直往上滑就行。这正是大会话该有的手感。
    if (m.scrollTop < 220) loadOlder();
  }, { passive: true });

  // 使用者自己动了就停止「正在对位」的那串定时器，
  // 否则翻完历史一往下滑就会被拽回去。
  ['touchstart', 'wheel', 'pointerdown', 'keydown'].forEach(function (ev) {
    m.addEventListener(ev, function () {
      if (state.anchorStop) state.anchorStop();
    }, { passive: true });
  });
}

// ── WebSocket ────────────────────────────────────────────────────────────────
function connect() {
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var ws;
  try { ws = new WebSocket(proto + '//' + location.host + '/codex/ws'); }
  catch (e) { setConn('bad', '连不上'); return; }
  state.ws = ws;

  ws.onopen = function () {
    if(state.ws !== ws)return;
    setConn('wait', t('握手中'));
    state.retry = 0;
    call('initialize', { clientInfo: { name: 'pocket-bridge-gw', version: '1.1.0' }, capabilities: { experimentalApi: true } })
      .then(function () {
        state.ready = true;
        setConn('ok', '已连接');
        loadModels();
        loadAccount();
        if (state.view === 'list') loadThreads();
        else { renderFooter(); startObserving(); }
      })
      .catch(function (e) { setConn('bad', '握手失败'); toast(t('初始化失败：') + e.message); });
  };

  ws.onmessage = function (ev) {
    if(state.ws !== ws)return;
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }

    // 先判有没有 method —— 顺序很关键。
    //
    // 回执只有 id + result/error，**没有 method**；请求和通知都有 method。
    // 原来先判 `state.pending[m.id]`，而服务端发来的请求 id 和我们自己发的请求 id
    // 是两套独立的编号空间，一旦撞号，审批请求就会被当成「我自己那个请求的回执」
    // 消化掉 —— 现象正是「审批请求根本看不到」，而且不报任何错、不留任何痕迹。
    if (m.method) {
      if (m.id !== undefined) onServerRequest(m);   // 服务端反过来请求我们（审批、提问）
      else onNotify(m.method, m.params || {});      // 通知
      return;
    }

    // 我们自己发出去的请求的回执
    if (m.id !== undefined && state.pending[m.id]) {
      var p = state.pending[m.id];
      delete state.pending[m.id];
      if (m.error) p.reject(new Error(m.error.message || JSON.stringify(m.error)));
      else p.resolve(m.result);
    }
  };

  ws.onclose = function () {
    if (state.ws !== ws) return;
    state.ready = false;
    resumeSubscription = null;
    state.resumed = false;      // 连接断了，写权限也没了，下次发之前要重新加载
    setConn('bad', t('已断开'));
    stopObserving();
    Object.keys(state.approvals).forEach(function(id) {
      var rec=state.approvals[id]; if(rec && rec.el)rec.el.remove();
    });
    state.approvals = {};
    Object.keys(state.pending).forEach(function(id) { state.pending[id].reject(new Error(t('连接中断'))); delete state.pending[id]; });
    renderFooter();
    var wait = Math.min(1000 * Math.pow(1.6, state.retry++), 15000);
    setTimeout(connect, wait);
  };
  ws.onerror = function () { if(state.ws === ws){setConn('bad', t('连接出错'));renderTaskStatus();} };
}

/**
 * 发一个 JSON-RPC 请求。
 *
 * 第三个参数是超时。**它必须真的用上** —— 原来签名里没有它，
 * 于是 resume 时写的 300000 被默默忽略、一律按 30 秒算：
 * 大会话加载要几分钟，必然超时，表现就是「发不出消息」。
 * 这种「参数写了但没接」的错最阴：调用处看着完全正确。
 */
function call(method, params, timeoutMs) {
  return new Promise(function (resolve, reject) {
    if (!state.ws || state.ws.readyState !== 1) { reject(new Error(t('连接没就绪'))); return; }
    var id = state.nextId++;
    state.pending[id] = { resolve: resolve, reject: reject };
    state.ws.send(JSON.stringify({ jsonrpc: '2.0', id: id, method: method, params: params || {} }));
    setTimeout(function () {
      if (state.pending[id]) { delete state.pending[id]; reject(new Error(t('{method} 超时', {method:method}))); }
    }, timeoutMs || 30000);
  });
}

/** 应答服务端发来的请求 */
function reply(id, result, error) {
  if (!state.ws || state.ws.readyState !== 1) { toast(t('连接已断开，请等重连后再处理')); return false; }
  var msg = { jsonrpc: '2.0', id: id };
  if (error) msg.error = { code: -32603, message: String(error) };
  else msg.result = result;
  state.ws.send(JSON.stringify(msg));
  return true;
}

// ── 服务端请求：审批 ─────────────────────────────────────────────────────────
function onServerRequest(m) {
  var p = m.params || {};
  if (state.thread && (p.threadId || p.conversationId) === state.thread.id) {
    activityVersion++;
    if (/requestUserInput/.test(m.method)) setTask('waitingInput',t('请回答下面的问题。'));
    else if (/Approval/.test(m.method)) setTask('waitingApproval',t('请处理下面的审批请求。'));
  }

  if (m.method === 'item/commandExecution/requestApproval' ||
      m.method === 'item/fileChange/requestApproval') {
    showApproval({
      id: m.id, method: m.method,
      kind: m.method.indexOf('fileChange') >= 0 ? t('文件改动') : t('执行命令'),
      // v2 的两个接口要的是 accept / acceptForSession / decline / cancel
      style: 'v2',
      title: m.method.indexOf('fileChange') >= 0 ? t('要改文件') : t('要执行命令'),
      command: p.command || '',
      cwd: p.cwd || (p.grantRoot ? t('写入目录：') + p.grantRoot : ''),
      reason: p.reason || (p.grantRoot ? t('请求写入权限：') + p.grantRoot : ''),
      threadId: p.threadId, turnId: p.turnId
    });
    return;
  }

  // 老接口
  if (m.method === 'execCommandApproval' || m.method === 'applyPatchApproval') {
    var isPatch = m.method === 'applyPatchApproval';
    var cmd = isPatch ? Object.keys(p.fileChanges || {}).join('\n') : (p.command || []).join(' ');
    showApproval({
      id: m.id, method: m.method, style: 'legacy',
      kind: isPatch ? t('文件改动') : t('执行命令'),
      title: isPatch ? t('要改文件') : t('要执行命令'),
      command: cmd, cwd: p.cwd || '',
      reason: p.reason || (p.grantRoot ? t('请求写入权限：') + p.grantRoot : ''),
      threadId: p.conversationId
    });
    return;
  }

  if (m.method === 'item/tool/requestUserInput') {
    showQuestions(m.id, p);
    return;
  }

  if (m.method === 'item/permissions/requestApproval') {
    showApproval({
      id: m.id, method: m.method, style: 'perm',
      kind: t('权限'), title: t('请求额外权限'),
      command: JSON.stringify(p.permissions || {}, null, 2),
      permissions: p.permissions || {},
      cwd: p.cwd || '', reason: p.reason || '',
      threadId: p.threadId, turnId: p.turnId
    });
    return;
  }

  // 不认识的：如实告诉使用者，并且回一个错误，别让对面干等
  console.log('[codex] 没处理的服务端请求:', m.method, p);
  reply(m.id, null, t('手机端暂不支持这个请求：') + m.method);
  toast(t('Codex 发来一个手机端还不支持的请求：') + m.method);
}

function showApproval(o) {
  if (state.approvals[o.id]) return;

  var el = document.createElement('div');
  el.className = 'appr';
  state.approvals[o.id] = {el:el,threadId:o.threadId};
  el.innerHTML =
    '<div class="h">Codex ' + esc(o.title) + '</div>' +
    (o.command ? '<div class="c">' + esc(o.command) + '</div>' : '') +
    (o.cwd ? '<div class="w">' + esc(o.cwd) + '</div>' : '') +
    (o.reason ? '<div class="w">' + esc(o.reason) + '</div>' : '') +
    '<div class="btns"></div>';

  var btns = el.querySelector('.btns');
  // 每个选项是 [按钮文字, 决定, 样式, 点完之后的文字]。
  // 第 4 项**必须整条写全**，不能靠 t('已' + c[0]) 拼 —— c[0] 这时已经是
  // 翻好的文字了，拼出来是「已Approve」这种中英混排，而且拼出来的键
  // 永远匹配不到字典（原样返回），英文/西班牙文下必然出错。
  var choices = o.style === 'legacy'
    ? [[t('批准'), 'approved', 'p', t('已批准')], [t('本次会话都批准'), 'approved_for_session', '', t('本会话已批准')],
       [t('拒绝'), 'legacy-deny', 'd', t('已拒绝')], [t('中止'), 'abort', 'd', t('已中止')]]
    : [[t('批准'), 'accept', 'p', t('已批准')], [t('本次会话都批准'), 'acceptForSession', '', t('本会话已批准')],
       [t('拒绝'), 'decline', 'd', t('已拒绝')], [t('拒绝并中止'), 'cancel', 'd', t('已拒绝并中止')]];

  var done = false;
  choices.forEach(function (c) {
    var b = document.createElement('button');
    b.textContent = c[0];
    if (c[2]) b.className = c[2];
    b.onclick = function () {
      if (done) return;
      if(!state.ready){toast(t('连接已断开，请等重连后再处理'));return;}
      done = true;
      Array.prototype.forEach.call(btns.querySelectorAll('button'), function (x) { x.disabled = true; });
      b.textContent = c[3] || c[0];

      var decision = c[1];
      var payload;
      if (decision === 'legacy-deny') {
        payload = { decision: { denied: { rejection: t('用户在手机上拒绝了') } } };
      } else if (o.style === 'perm') {
        // 权限请求的应答结构不同：要回一份「授予了什么」
        payload = { permissions: decision === 'accept' || decision === 'acceptForSession' ? o.permissions || {} : {}, scope: decision === 'acceptForSession' ? 'session' : 'turn' };
      } else {
        payload = { decision: decision };
      }
      if(!reply(o.id, payload)){done=false;return;}
      delete state.approvals[o.id];
      if(state.thread && state.thread.id===o.threadId) { setTask('running',t('已提交审批，等待任务继续。')); refreshObservedThread(); }
      // 把这张卡留下来当作记录，但改成已完成的样子
      el.style.opacity = '.55';
      el.querySelector('.h').textContent = (c[3] || c[0]) + t('：') + o.title;
      setTimeout(function () { el.remove(); }, 1200);
    };
    btns.appendChild(b);
  });

  // 挂到独立容器：切会话/返回列表时 #body 会被清空，混在一起的话这张卡会被抹掉，
  // 而 Codex 那边还在等你答复 —— 那就变成一个「说不清的卡住」。
  $('apprs').appendChild(el);
  scrollDown(true);
  toast(t('Codex 需要你确认'));
}

function showQuestions(id, p) {
  if(state.approvals[id])return;
  var qs = p.questions || [];
  var el = document.createElement('div');
  el.className = 'appr';
  state.approvals[id]={el:el,threadId:p.threadId};
  el.innerHTML = '<div class="h">' + t('Codex 想问你') + '</div>';
  var inputs = [];
  qs.forEach(function (q) {
    var d = document.createElement('div');
    d.style.marginBottom = '10px';
    d.innerHTML = '<div style="font-size:13.5px;margin-bottom:5px">' + esc(q.question || q.text || '') + '</div>';
    if (q.options && q.options.length) {
      var sel = document.createElement('select');
      sel.style.cssText = 'width:100%;padding:9px;border-radius:9px;background:#111;' +
        'color:#eee;border:1px solid #333;font:inherit';
      q.options.forEach(function (op) {
        var o = document.createElement('option');
        o.value = typeof op === 'string' ? op : (op.value || op.label || '');
        o.textContent = typeof op === 'string' ? op : (op.label || op.value || '');
        sel.appendChild(o);
      });
      d.appendChild(sel);
      inputs.push({ q: q, get: function () { return sel.value; } });
    } else {
      var inp = document.createElement('input');
      inp.style.cssText = 'width:100%;padding:9px;border-radius:9px;background:#111;' +
        'color:#eee;border:1px solid #333;font:inherit';
      d.appendChild(inp);
      inputs.push({ q: q, get: function () { return inp.value; } });
    }
    el.appendChild(d);
  });

  var b = document.createElement('button');
  b.className = 'p';
  b.textContent = t('提交');
  b.style.cssText = 'padding:9px 16px;border-radius:9px;background:#2f7d4f;color:#fff;font-weight:600';
  b.onclick = function () {
    var answers = {};
    inputs.forEach(function (x) { answers[x.q.id || x.q.question] = {answers:[x.get()]}; });
    if(!reply(id, { answers: answers }))return;
    delete state.approvals[id];
    el.remove();
  };
  var row = document.createElement('div');
  row.className = 'btns';
  row.appendChild(b);
  el.appendChild(row);

  $('apprs').appendChild(el);
  scrollDown(true);
}

// ── 通知 ─────────────────────────────────────────────────────────────────────
function onNotify(method, p) {
  if(method === 'serverRequest/resolved') {
    var resolved = state.approvals[p.requestId];
    if(resolved && resolved.el)resolved.el.remove();
    delete state.approvals[p.requestId];
  }
  if (!state.thread || state.view !== 'thread' || (p.threadId && p.threadId !== state.thread.id)) return;
  activityVersion++;

  switch (method) {
    case 'serverRequest/resolved':
      var request = state.approvals[p.requestId];
      if(request && request.el)request.el.remove();
      delete state.approvals[p.requestId];
      refreshObservedThread();
      break;
    case 'thread/status/changed':
      if (statusKind(p.status) === 'active' || statusKind(p.status) === 'systemError') applyObservedStatus({status:p.status},null);
      else refreshObservedThread();
      break;
    case 'turn/started':
      state.running = true; state.turnId = (p.turn && p.turn.id) || null;
      setTask('running',t('任务已开始，正在接收进度。'));
      renderFooter(); break;

    case 'turn/completed':
      state.running = false; state.turnId = null;
      var ended = p.turn && p.turn.status;
      setTask(ended === 'failed' ? 'failed' : ended === 'interrupted' ? 'interrupted' : ended === 'completed' ? 'completed' : 'unknown',
        ended === 'completed' ? t('最近一轮任务已完成。') : t('请查看最近的任务结果。'));
      Object.keys(state.items).forEach(function (k) {
        if (state.items[k].el) {
          var c = state.items[k].el.querySelector('.cursor');
          if (c) c.classList.remove('cursor');
        }
      });
      renderFooter();
      // 回合结束**不立刻**还写锁，而是交给闲置计时器（5 分钟）。
      //
      // 一开始是「回合结束就还」，结果是：每发一条消息都要重新 resume 一次，
      // 界面上每次都显示「正在加载对话」—— 明明刚说过话。
      // 使用者连着发几条是很常见的，每条都等一遍完全没必要。
      //
      // 代价是手机可能多占着写锁几分钟（电脑上此时打开同一个会话会被挡），
      // 但只要有交互就一直续期、闲置够了就还，不会无限期占着。
      scheduleRelease();
      break;

    case 'item/started':
      if (p.item) { upsertItem(p.item); noteActivity(p.item); setTask(p.item.type === 'reasoning' ? 'thinking' : 'running',t('正在接收最新进度。')); } break;

    case 'item/completed':
      if (p.item) { upsertItem(p.item, true); noteActivity(p.item); renderTaskStatus(); } break;

    case 'item/agentMessage/delta':
      appendDelta(p.itemId, p.delta, 'text'); break;

    case 'item/reasoning/summaryTextDelta':
      appendDelta(p.itemId, p.delta, 'think', p.summaryIndex); break;

    case 'item/reasoning/summaryPartAdded':
      break;

    case 'item/commandExecution/outputDelta':
    case 'item/fileChange/outputDelta':
      appendDelta(p.itemId, p.delta, 'out'); break;

    case 'turn/plan/updated':
      renderPlan(p.plan || [], p.turnId); break;

    case 'thread/name/updated':
      if (state.thread && p.name) { state.thread.name = p.name; $('title').textContent = p.name; }
      break;

    case 'error':
      addError(p.message || p.error || JSON.stringify(p)); break;

    default:
      break;
  }
}

/** 把增量接到对应的 item 上 —— 每个 delta 都带 itemId，所以能精确落到那一条 */
/**
 * 正文渲染的长度上限。
 *
 * 命令输出动辄几 MB（构建日志、目录遍历），整段塞进 DOM 会让页面直接卡死 ——
 * 手机上尤其明显。超长的只留头尾，中间标明省略了多少 ——
 * 想看全文可以去电脑上翻，手机上要的是「知道它跑了什么、结果大概是什么」。
 */
var MAX_OUT = 24000;
var MAX_TEXT = 48000;
var MAX_THINK = 16000;

function clip(text, max) {
  var s = String(text == null ? '' : text);
  if (s.length <= max) return { text: s, clipped: 0 };
  var head = Math.floor(max * 0.7), tail = max - head;
  return {
    text: s.slice(0, head) + '\n\n' + t('…… 省略 {n} 个字符 ……', {n: s.length - max}) + '\n\n' + s.slice(-tail),
    clipped: s.length - max
  };
}

/**
 * 把流式增量攒到下一帧再渲染。
 *
 * 原来每来一个 token 就把整条消息重新跑一遍 markdown 解析，消息越长越慢 ——
 * 一篇长回复写到最后，每个字都要重解析几万字，这就是「卡到没法对话」的来源。
 * 改成每帧最多渲染一次：视觉上完全看不出差别，开销降一两个数量级。
 */
function schedulePaint(rec) {
  if (rec._paint) return;
  var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
  rec._paint = raf(function () {
    rec._paint = null;
    var bb = rec.el && rec.el.querySelector('.bub');
    if (!bb) return;
    var c = clip(rec.acc, MAX_TEXT);
    bb.innerHTML = fmt(c.text) + (c.clipped ? '<div class="clipped">' + t('已省略 {n} 字', {n:c.clipped}) + '</div>' : '');
    bb.classList.add('cursor');
    scrollDown();
  });
}

function appendDelta(itemId, delta, kind, summaryIndex) {
  if (!itemId || !delta) return;
  var rec = state.items[itemId];
  if (!rec) {
    // 还没见过这个 item（列表是分页拉的），先建一个占位，等 item/completed 补全
    rec = state.items[itemId] = { item: { id: itemId, type: kind === 'think' ? 'reasoning' : 'agentMessage' },
      acc: '', created: false };
    state.order.push(itemId);
    rec.el = buildItem(rec.item, rec);
    $('body').appendChild(rec.el);
  }

  if (kind === 'think') {
    if (!rec.summaryParts) rec.summaryParts = {};
    var part = summaryIndex == null ? 0 : summaryIndex;
    rec.summaryParts[part] = (rec.summaryParts[part] || '') + delta;
    rec.thinkText = Object.keys(rec.summaryParts).sort(function(a,b){return Number(a)-Number(b);}).map(function(k){return rec.summaryParts[k];}).join('\n\n');
    if (!rec.el || !rec.el.isConnected) {
      rec.el = buildReasoning(rec.item, rec);
      $('body').appendChild(rec.el);
    }
    rec.el.style.display = '';
    delete rec.el.dataset.empty;
    rec.el.open = true;
    task.activity = t('思考摘要：') + rec.thinkText.replace(/\*\*/g,'').slice(-180);
    setTask('thinking',t('正在接收思考摘要。'));
    if (rec._tpaint) return;
    var raf1 = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    rec._tpaint = raf1(function () {
      rec._tpaint = null;
      var tb = rec.el && rec.el.querySelector('.body');
      if (tb) tb.textContent = clip(rec.thinkText, MAX_THINK).text;
      scrollDown();
    });
  } else if (kind === 'out') {
    rec.outText = (rec.outText || '') + delta;
    if (rec._opaint) return;
    var raf2 = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    rec._opaint = raf2(function () {
      rec._opaint = null;
      var ob = rec.el && rec.el.querySelector('.out');
      if (!ob) return;
      var c = clip(rec.outText, MAX_OUT);
      ob.textContent = c.text + (c.clipped ? '\n\n' + t('…… 已省略 {n} 个字符 ……', {n:c.clipped}) : '');
      // 输出流着的时候别自动展开 —— 几 MB 的内容展开会直接把页面拖住。
      // 想看就点一下标题栏。
    });
  } else {
    rec.acc = (rec.acc || '') + delta;
    schedulePaint(rec);
  }
}

// ── item 渲染 ────────────────────────────────────────────────────────────────
/**
 * 一个 item 一个 DOM 节点，按 id 索引。
 * 这样 item/started、delta、item/completed 都会落到同一个节点上 ——
 * 之前是「一个流式节点」，一个回合里出现两条消息就会串在一起。
 */
function upsertItem(item, isComplete) {
  if (!item || !item.id) return;
  Array.prototype.forEach.call($('body').querySelectorAll('.empty,.skel'),function(n){n.remove();});
  var rec = state.items[item.id];
  if (!rec) {
    // ★ 服务端把「我刚发的那条」回推上来了 —— 它多半和本地先画的那条是同一句话。
    //
    //   回显曾导致一条发送内容出现两次。
    //   原因就是这个：addLocalUser() 先画了一条占位（local-<时间戳>），
    //   服务端随后回推真正的 item（另一个 id），而**没有任何代码把两者对上** ——
    //   于是同一句话画两遍。原来这里还写着「它马上会被服务端的回推顶掉」，
    //   但「顶掉」那件事从来没有被实现过（注释骗了我们自己一轮）。
    //
    //   现在：把先画的那条**改名**成服务端的 id、节点留在原位（不闪、不跳），
    //   内容用服务端那份重建（附件、图片都在里面）。
    if (item.type === 'userMessage') {
      var ph = takePendingLocal(userTextOf(item));
      if (ph) {
        var old = state.items[ph.id];
        delete state.items[ph.id];
        rec = state.items[item.id] = { item: item, acc: '', created: false };
        var at = state.order.indexOf(ph.id);
        if (at >= 0) state.order[at] = item.id; else state.order.push(item.id);
        var node = buildItem(item, rec);
        if (old && old.el && old.el.isConnected) old.el.replaceWith(node);
        else $('body').appendChild(node);
        rec.el = node;
        tidySoon();
        scrollDown();
        return;
      }
    }
    rec = state.items[item.id] = { item: item, acc: '', created: false };
    state.order.push(item.id);
    rec.el = buildItem(item, rec);
    $('body').appendChild(rec.el);
    tidySoon();
    scrollDown();
    return;
  }

  rec.item = item;
  if (isComplete && item.type === 'reasoning' && Array.isArray(item.summary) && item.summary.length) {
    rec.thinkText = ''; rec.summaryParts = null;
  }
  if (isComplete && item.type === 'agentMessage' && typeof item.text === 'string') rec.acc = item.text;
  // 流式过程中这个 item 的正文已经一条条拼出来了，完成时再整块重建一次是浪费 ——
  // 只有在我们手上没有内容（比如断线重连后补推）时才需要重建。
  var haveText = rec.acc && rec.acc.length >= String(item.text || '').length;
  if (!isComplete && haveText && item.type === 'agentMessage') {
    tidySoon();
    return;
  }

  var fresh = buildItem(item, rec);
  if (rec.el && rec.el.open) fresh.open = true;
  if (rec.el && rec.el.isConnected) rec.el.replaceWith(fresh);
  else $('body').appendChild(fresh);
  rec.el = fresh;
  tidySoon();
  scrollDown();
}

/**
 * 合并思考块是有必要的（一条会话里可能几十个），但它要遍历整个列表 ——
 * 流式过程中每个 item 完成都跑一遍，列表越长越慢。
 * 攒一下再跑：视觉上没差别，开销从「每次」变成「每 300ms 最多一次」。
 */
var tidyTimer = null;
function tidySoon() {
  clearTimeout(tidyTimer);
  tidyTimer = setTimeout(tidyItems, 300);
}

function buildItem(item, rec) {
  switch (item.type) {
    case 'userMessage': return buildUser(item);
    case 'agentMessage': return buildAgent(item, rec);
    case 'reasoning': return buildReasoning(item, rec);
    case 'commandExecution': return buildCommand(item, rec);
    case 'fileChange': return buildFileChange(item);
    case 'plan': return buildPlanItem(item);
    case 'mcpToolCall': case 'dynamicToolCall': case 'functionCallOutput':
      return buildToolCall(item);
    case 'webSearch': return buildWebSearch(item);
    case 'subAgentActivity': return buildSubAgent(item);
    case 'collabAgentToolCall': return buildCollab(item);
    case 'imageView': return buildImage(item.path);
    case 'imageGeneration':
      return buildImage(item.savedPath || (item.result && item.result.path));
    case 'contextCompaction':
      return buildNote(t('上下文已压缩'));
    case 'enteredReviewMode': case 'exitedReviewMode':
      return buildNote(t('评审模式：') + JSON.stringify(item.review || {}).slice(0, 80));
    case 'hookPrompt':
      return buildNote(t('hook：') + (item.fragments || []).map(function (f) { return f.text || ''; }).join(' ').slice(0, 120));
    default:
      return buildNote(asText(item.type) + (item.text != null ? t('：') + asText(item.text) : ''));
  }
}

function el(cls, html) {
  var d = document.createElement('div');
  d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}

function buildUser(item) {
  var txt = (item.content || []).map(function (c) { return asText(c.text); }).join('');
  var node=el('msg user', '<div class="who">' + t('你') + '</div><div class="bub">' + fmt(txt) + '</div>');
  (item.content||[]).forEach(function(c){
    if(c.type==='localImage' && c.path)node.appendChild(buildImageView(c.path));
    else if(c.type==='image' && /^data:image\/(png|jpeg|gif|webp);base64,/.test(c.url||'')){
      var img=document.createElement('img');img.src=c.url;img.alt=t('上传的图片');img.style.cssText='max-width:100%;max-height:240px;border-radius:10px';node.appendChild(img);
    }
  });
  return node;
}

/**
 * 把「本该是字符串、实际可能是对象/数组」的字段读成人话。
 *
 * 为什么需要：对象字段被直接转成字符串时会显示「[object Object]」。
 * 服务端某个字段是对象或 {text:…} 数组，而渲染时直接字符串拼接。
 * 认不出来时显示 JSON（有上限）—— 让人看得出这是什么、能反馈，
 * 也比一串 [object Object] 强。
 */
function asText(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return v.map(asText).filter(Boolean).join('\n');
  if (typeof v === 'object') {
    var keys = ['text', 'content', 'value', 'message', 'output', 'delta', 'summary'];
    for (var i = 0; i < keys.length; i++) {
      if (v[keys[i]] != null) { var t2 = asText(v[keys[i]]); if (t2) return t2; }
    }
    try { return JSON.stringify(v).slice(0, 2000); } catch (e) { return String(v); }
  }
  return String(v);
}

function buildAgent(item, rec) {
  var txt = asText(item.text) || rec.acc || '';
  var c = clip(txt, MAX_TEXT);
  return el('msg agent', '<div class="who">Codex</div><div class="bub">' + fmt(c.text) +
    (c.clipped ? '<div class="clipped">' + t('已省略 {n} 字', {n:c.clipped}) + '</div>' : '') + '</div>');
}

/**
 * reasoning 的正文取法。
 *
 * 这里踩过一个坑：`summary` 和 `content` 是**字符串数组**（`["**Planning…**"]`），
 * 不是对象数组。原来按 `s.text` 读，结果全是 undefined —— 界面上一排排
 * 「思考过程」点开都是空的，看着像没数据，其实是读错了字段。
 * 两种形态都兜住，免得服务端哪版改了又白屏。
 */
function reasoningText(item, rec) {
  if (rec && rec.thinkText) return rec.thinkText;
  var pick = function (arr) {
    if (!Array.isArray(arr)) return '';
    return arr.map(function (x) {
      if (typeof x === 'string') return x;
      if (x && typeof x === 'object') return x.text || x.summary || '';
      return '';
    }).filter(Boolean).join('\n\n');
  };
  return pick(item.summary);
}

function buildReasoning(item, rec) {
  var body = reasoningText(item, rec);
  var d = document.createElement('details');
  d.className = 'think';
  // 空的不占位置。实际数据里 reasoning 条目可能比消息还多，而多数没有正文
  // （历史里的思考摘要本来就不一定留）。每个都渲染一个空折叠块的话，
  // 一屏全是「思考过程」，正经内容反而找不着。
  if (!String(body || '').trim()) { d.style.display = 'none'; d.dataset.empty = '1'; }
  d.open = !!body && state.running;
  d.innerHTML = '<summary>' + t('思考摘要') + '</summary><div class="body">' + esc(body || '') + '</div>';
  return d;
}

/**
 * 整理一下渲染出来的条目：
 *   1. 把空的思考块**从 DOM 里去掉**（不是隐藏）—— 隐藏的节点仍然夹在中间，
 *      会把本该合并的思考块隔开，还会让相邻判断失效
 *   2. 把挨着的思考块合成一个
 *
 * 实测一条会话里 reasoning 条目能到 46 个（比消息还多），而多数没有正文。
 * 电脑版上这些收在一条时间线里，手机屏幕更小，更得收拾干净。
 * 只合并**相邻**的 —— 中间隔了别的操作就说明是两段独立的思考。
 */
function tidyItems() {
  // Keep one connected node per item ID: deltas may arrive after an empty start.
  // Merging/removing indexed nodes sends later deltas into detached DOM nodes.
  Object.keys(state.items).forEach(function(id) {
    var rec = state.items[id];
    if (rec.item.type !== 'reasoning' || !rec.el) return;
    var empty = !reasoningText(rec.item,rec).trim();
    rec.el.style.display = empty ? 'none' : '';
    if (empty) rec.el.dataset.empty = '1'; else delete rec.el.dataset.empty;
  });
}

function buildCommand(item, rec) {
  var raw = item.aggregatedOutput || rec.outText || '';
  var c = clip(raw, MAX_OUT);
  var out = c.text + (c.clipped ? '\n\n' + t('…… 已省略 {n} 个字符 ……', {n:c.clipped}) : '');
  var cmd = Array.isArray(item.command) ? item.command.join(' ') : (item.command || '');
  // 命令往往是一长串绝对路径 + 参数（实测开头就是 pwsh.exe 的完整路径），
  // 手机上直接铺开会把关键部分挤出屏幕，所以显示时掐掉目录前缀
  var shown = cmd.replace(/^"[^"]*[\\/]([^\\/"]+)"\s*/, '$1 ').trim();
  var exit = item.exitCode;
  var badge = '';
  if (exit !== undefined && exit !== null) {
    badge = '<span class="badge ' + (exit === 0 ? 'ok' : 'bad') + '">' +
      (exit === 0 ? t('成功') : t('退出 {code}', {code: exit})) + '</span>';
  } else if (item.status) {
    badge = '<span class="badge ' + (/complete|success/i.test(item.status) ? 'ok' : '') + '">' +
      esc(item.status) + '</span>';
  }
  var dur = item.durationMs ? '<span class="badge">' + Math.round(item.durationMs / 100) / 10 + 's</span>' : '';

  var d = document.createElement('details');
  d.className = 'tool';
  d.innerHTML =
    '<summary><span class="kind">' + t('命令') + '</span>' +
    '<span class="head">' + esc(shown) + '</span>' + dur + badge + '</summary>' +
    '<pre class="out">' + esc(out) + '</pre>';
  return d;
}

function buildFileChange(item) {
  var changes = item.changes || item.fileChanges || {};
  var list = Array.isArray(changes) ? changes : Object.keys(changes).map(function (k) {
    var v = changes[k];
    return { path: k, kind: (v && (v.type || v.kind)) || 'update' };
  });

  // 改动的文件也能点开看 —— 光看「改了 21 个文件」还是不知道做得对不对
  var box = document.createElement('div');
  var sum = '<div class="toolhd"><span class="kind">' + t('文件') + '</span>' +
    '<span class="head">' + t('{n} 个文件有改动', {n:list.length}) + '</span>' +
    (item.status ? '<span class="badge' + (item.status === 'completed' ? ' ok' : '') + '">' +
      esc(item.status) + '</span>' : '') + '</div>';
  box.innerHTML = sum;

  // 有图片产出就先把图摆出来（一眼就能判断方向）
  var imgs = list.filter(function (c) { return IMG_RE.test(c.path || c.file || ''); });
  imgs.slice(0, 6).forEach(function (c) {
    box.appendChild(buildImageView(c.path || c.file));
  });

  var rest = list.filter(function (c) { return imgs.indexOf(c) < 0; });
  if (rest.length) {
    var det = document.createElement('details');
    det.className = 'tool';
    det.style.marginTop = '8px';
    det.innerHTML = '<summary><span class="kind">' + t('其他') + '</span>' +
      '<span class="head">' + t('{n} 个文件', {n:rest.length}) + '</span></summary>';
    var wrap = document.createElement('div');
    wrap.style.padding = '0 10px 10px';
    rest.slice(0, 40).forEach(function (c) {
      var kind = String(c.kind || c.type || 'update').toLowerCase();
      var mark = /add|create/.test(kind) ? '+' : (/del|remove/.test(kind) ? '−' : '±');
      wrap.appendChild(buildFileCard(c.path || c.file || '', mark));
    });
    det.appendChild(wrap);
    box.appendChild(det);
  }
  if (!list.length) box.innerHTML += '<div class="note" style="padding:8px 13px">' + t('（没有明细）') + '</div>';
  return box;
}

function buildPlanItem(item) {
  return el('', '<div class="plan"><div class="h">' + t('计划') + '</div><div>' +
    fmt(asText(item.text)) + '</div></div>');
}

function buildToolCall(item) {
  var name = item.name || item.tool || item.namespace || t('工具');
  var detail = '';
  try {
    detail = item.arguments ? JSON.stringify(item.arguments).slice(0, 100) : '';
  } catch (e) { }
  var out = item.output || (item.result ? JSON.stringify(item.result).slice(0, 400) : '') ||
    (item.error ? t('错误：') + item.error : '');
  var d = document.createElement('details');
  d.className = 'tool';
  d.innerHTML = '<summary><span class="kind">' + t('工具') + '</span>' +
    '<span class="head">' + esc(name + (detail ? '  ' + detail : '')) + '</span>' +
    (item.status ? '<span class="badge">' + esc(item.status) + '</span>' : '') + '</summary>' +
    '<pre class="out">' + esc(out) + '</pre>';
  return d;
}

/**
 * 文件在手机上的样子。
 *
 * 为什么要有这个：Codex 说「生成了 3 张图 / 改了这个文件」，而使用者只能看到
 * 一行路径文字 —— 看不到产出就没法判断方向对不对。
 *
 * 图片直接显示（这是最需要「看一眼」的）；pdf、word、文本走链接，
 * 交给浏览器自己处理：iOS/Android 的浏览器都能直接预览 pdf 和文本，
 * 我们没必要自己做一个查看器。
 */
function fileUrl(p, w) {
  if (!p) return '';
  // 不再带 root：允许读哪些目录由**服务端**自己决定。
  // 原来这里把会话的 cwd 传过去当「允许范围」，而服务端直接采信 ——
  // 等于让请求方自己划边界。实测带一个别的 root 就能读到 access-key.txt。
  // 服务端现在从它自己的会话缓存里取工作目录，这条参数已经没有任何作用。
  return '/codex/file?path=' + encodeURIComponent(p) + (w ? '&w=' + w : '');
}

var IMG_RE = /\.(png|jpe?g|gif|webp|bmp|svg|ico)$/i;
var DOC_RE = /\.(pdf|docx?|xlsx?|pptx?|md|txt|json|csv|log|ya?ml|xml)$/i;

function fileIcon(p) {
  if (IMG_RE.test(p)) return '🖼';
  if (/\.pdf$/i.test(p)) return '📕';
  if (/\.(docx?|rtf)$/i.test(p)) return '📄';
  if (/\.(xlsx?|csv)$/i.test(p)) return '📊';
  if (/\.(pptx?)$/i.test(p)) return '📽';
  if (/\.(zip|7z|rar)$/i.test(p)) return '🗜';
  if (/\.(mp4|mov|webm)$/i.test(p)) return '🎬';
  return '📄';
}

/** 图片：直接显示出来，点一下看原图 */
/**
 * 取一个受保护的资源：加密开着就解密后再用。
 *
 * 图片不能靠 fetch 拦截解决 —— `<img src="...">` 是浏览器自己发的请求，
 * 拦不到。所以要显式取回来、解密、再塞成一个 blob 地址。
 * 失败就退回明文地址（电脑上没配密钥时本来就该走明文）。
 */
function protectedUrl(url, mime) {
  var secret = window.__dshE2eeSecret;
  if (!secret || !window.DshE2EE || !window.DshE2EE.fetchToBlobUrl) {
    return Promise.resolve(url);
  }
  var enc = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'e2ee=1';
  return window.DshE2EE.fetchToBlobUrl(secret, enc, mime).catch(function () {
    return url;    // 解不开就用明文那条，别让图裂掉
  });
}

// Keep preview blob URLs alive while their images are visible (long-press/save
// still works), then release them when the images leave the document.
var imageBlobRecords = [];
var imageBlobObserver = null;
function releaseImageBlob(record) {
  var i = imageBlobRecords.indexOf(record);
  if (i < 0) return;
  imageBlobRecords.splice(i, 1);
  URL.revokeObjectURL(record.url);
  if (!imageBlobRecords.length && imageBlobObserver) {
    imageBlobObserver.disconnect();
    imageBlobObserver = null;
  }
}
function watchImageBlob(img, url) {
  var record = { img: img, url: url };
  imageBlobRecords.push(record);
  if (!imageBlobObserver && typeof MutationObserver !== 'undefined') {
    imageBlobObserver = new MutationObserver(function () {
      imageBlobRecords.slice().forEach(function (entry) {
        if (!entry.img.isConnected) releaseImageBlob(entry);
      });
    });
    imageBlobObserver.observe(document.body, { childList: true, subtree: true });
  }
  // Very old browsers without MutationObserver cannot track removal.
  if (!imageBlobObserver) setTimeout(function () { releaseImageBlob(record); }, 60000);
  return function () { releaseImageBlob(record); };
}

function buildImageView(p, caption) {
  var d = document.createElement('div');
  d.className = 'imgbox';
  if (!p) { d.innerHTML = '<div class="tool"><div style="padding:9px 13px">🖼 ' + t('（没有路径）') + '</div></div>'; return d; }

  var secret = window.__dshE2eeSecret;
  d.innerHTML = '<div class="imgwrap"></div>' +
    '<div class="imgcap">' + fileIcon(p) + ' ' + esc(shortPath(p)) + '</div>';
  var wrap = d.querySelector('.imgwrap');

  function showNote(msg, withRetry) {
    wrap.innerHTML = '<div class="tool"><div style="padding:9px 13px;font-size:12.5px;' +
      'color:var(--dim)">🖼 ' + esc(msg) + esc(shortPath(p)) +
      (withRetry ? ' · <a href="#" class="imgretry">' + esc(t('重试')) + '</a>' : '') +
      '</div></div>';
    var a = wrap.querySelector('.imgretry');
    if (a) a.addEventListener('click', function (ev) { ev.preventDefault(); start(); });
  }

  /** 取图。有钥匙就走加密那条（privateFetch 会带 x-dsh-e2ee，并且被拦了会补证重发）。 */
  function start() {
    if (!secret) {
      // 内网明文模式：本来就没有钥匙，直接用地址（和以前一样）
      wrap.innerHTML = '<a href="' + esc(fileUrl(p)) + '" target="_blank" rel="noopener">' +
        '<img loading="lazy" alt="' + esc(caption || t('图片')) + '" src="' + esc(fileUrl(p, 900)) + '"></a>';
      var plain = wrap.querySelector('img');
      plain.onerror = function () { showNote(t('打不开这张图：'), true); };
      return;
    }
    showNote(t('正在取图：'), false);
    privateFetch(fileUrl(p, 900), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      })
      .then(function (b) {
        if (!d.isConnected) return;
        var url = URL.createObjectURL(b);
        wrap.innerHTML = '<a href="#" class="imgopen"><img alt="' + esc(caption || t('图片')) + '"></a>';
        var img = wrap.querySelector('img');
        var link = wrap.querySelector('a');
        var release = watchImageBlob(img, url);
        img.onerror = function () { release(); showNote(t('打不开这张图：'), true); };
        img.src = url;
        link.addEventListener('click', function (ev) { ev.preventDefault(); openFull(); });
      })
      .catch(function (e) {
        // 如实说：多半是这台设备还没验证完，或者那个文件真的不在了
        showNote(t('这张图没取回来：'), true);
      });
  }

  /** 点开看原图：也走加密，取回来开一个 blob */
  function openFull() {
    privateFetch(fileUrl(p), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(function (b) {
        var url = URL.createObjectURL(b);
        try { window.open(url, '_blank', 'noopener'); }
        finally { setTimeout(function () { URL.revokeObjectURL(url); }, 60000); }
      })
      .catch(function () { toast(t('原图没取回来，稍后再试')); });
  }

  start();
  return d;
}

/** 只要文件名那一段 —— 手机上全路径太长 */
function shortPath(p) {
  var s = String(p || '');
  var parts = s.split(/[\\/]/);
  return parts.length > 1 ? parts.slice(-2).join('/') : s;
}

/** 通用文件卡片：图标 + 名字 + 打开 */
function buildFileCard(p, note) {
  var d = document.createElement('a');
  d.className = 'filecard';
  d.href = fileUrl(p);
  d.target = '_blank';
  d.rel = 'noopener';
  d.innerHTML = '<span class="fi">' + fileIcon(p) + '</span>' +
    '<span class="fn">' + esc(shortPath(p)) + '</span>' +
    (note ? '<span class="fnote">' + esc(note) + '</span>' : '') +
    '<span class="fgo">' + t('打开') + ' ›</span>';
  return d;
}

function buildWebSearch(item) {
  var q = typeof item.query === 'string' ? item.query : JSON.stringify(item.query || '');
  var n = (item.results || []).length;
  var d = document.createElement('details');
  d.className = 'tool';
  var rows = (item.results || []).slice(0, 12).map(function (r) {
    var title = r.title || r.name || r.url || '';
    var url = r.url || '';
    return '<li>' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' +
      esc(title) + '</a>' : esc(title)) + '</li>';
  }).join('');
  d.innerHTML = '<summary><span class="kind">' + t('搜索') + '</span>' +
