          fixed = true;
          return true;
        }
        if (!fixed) {
          // 锚点没了：退回按高度差补（只补一次，别重复累加）
          main.scrollTop = prevTop + (main.scrollHeight - prevHeight);
          fixed = true;
          return true;
        }
        return false;
      };

      // 连着对位一段时间，用**每帧**的方式。
      //
      // 用 setTimeout 试过，不稳；原因是还有别人也在动滚动位置 ——
      // 浏览器自己的滚动锚定会在我们之后又调一次，差出两千多像素。
      // requestAnimationFrame 跑在每次布局之后，能稳定地把它抓回来。
      // fix() 是幂等的，对上了就什么都不做，所以每帧调用没有副作用。
      //
      // 「使用者一动就停」靠的是手势事件（见 initScrollWatch），
      // **不能靠比较位置** —— 那会把浏览器的调整误判成使用者在操作，
      // 于是第一帧之后就收手，等于没对（这个坑刚踩过）。
      fix();
      var deadline = Date.now() + 900;
      state.anchorStop = stopAll;
      var loop = function () {
        if (!state.anchorTimers) return;
        fix();
        if (Date.now() > deadline) { state.anchorTimers = null; return; }
        state.anchorTimers = requestAnimationFrame(loop);
      };
      state.anchorTimers = requestAnimationFrame(loop);
    } else {
      prependOlderHint();
    }
  }).catch(function (e) {
    if (hint) hint.textContent = t('加载更早的失败：') + e.message;
  }).then(function () {
    state.loadingOlder = false;
  });
}

/**
 * 此刻视野里最上面那一条 —— 用来当滚动锚点。
 *
 * 必须跳过「空的思考块」：整理的时候它们会被从 DOM 里删掉，
 * 拿一个即将被删的元素当锚点，对位逻辑会因为 isConnected 为假而直接跳过，
 * 结果就是页面猛地跳一下（实测跳了 2920px）。
 */
function firstVisibleBlock() {
  var main = $('main');
  var rect = main.getBoundingClientRect();
  var all = main.querySelectorAll('.bub,.tool,.think,.msg,.plan');
  for (var i = 0; i < all.length; i++) {
    var el = all[i];
    if (el.dataset && el.dataset.empty === '1') continue;
    // 自己会被删的，或者祖先会被删的，都跳过
    if (el.closest && el.closest('details.think[data-empty="1"]')) continue;
    if (el.getBoundingClientRect().bottom > rect.top + 4) return el;
  }
  return null;
}

/** 离开当前会话：把写锁还回去 */
function releaseThread() {
  var t = state.thread;
  if (!state.resumed || state.resuming || state.handingBack) return;
  if (state.running) {
    // The task must finish, but leaving its page must not hold the desktop
    // writer forever. Observe this exact thread until it becomes idle.
    if(t){state.resumed=false;scheduleDetachedHandback(t.id);}
    return;
  }
  clearTimeout(state.releaseTimer);state.releaseTimer=null;
  state.resumed = false;
  if (!t || !state.ready) return;
  // The server may keep this ID in loaded/list during its idle grace period.
  // Mark observation-only before unsubscribe so an in-flight observer response
  // cannot reacquire the writer. Only an explicit Connect clears this marker.
  if(!state.handedBackThreads)state.handedBackThreads=Object.create(null);
  state.handedBackThreads[t.id]=true;
  // 不等结果 —— 使用者已经在往外走了，卡在这里只会让他觉得卡顿
  call('thread/unsubscribe', { threadId: t.id }).catch(function () { });
}

function scheduleDetachedHandback(tid) {
  if(detachedHandbacks[tid])clearTimeout(detachedHandbacks[tid]);
  detachedHandbacks[tid]=setTimeout(function(){
    if(!detachedHandbacks[tid])return;
    if(!state.ready){scheduleDetachedHandback(tid);return;}
    call('thread/read',{threadId:tid,includeTurns:false},10000).then(function(r){
      if(!detachedHandbacks[tid])return;
      var kind=statusKind(r && r.thread && r.thread.status);
      if(kind==='notLoaded'){clearTimeout(detachedHandbacks[tid]);delete detachedHandbacks[tid];return;}
      if(kind!=='idle'){scheduleDetachedHandback(tid);return;}
      // Never unsubscribe while the task is active. If the status changes
      // between this read and unsubscribe, the app-server remains the arbiter.
      return call('thread/unsubscribe',{threadId:tid},10000).then(function(){
        clearTimeout(detachedHandbacks[tid]);delete detachedHandbacks[tid];
      });
    }).catch(function(){if(detachedHandbacks[tid])scheduleDetachedHandback(tid);});
  },30*1000);
}

/**
 * 这个页面有没有握着写锁 —— 用来在标题栏给个提示。
 * 使用者在电脑上打不开同一个会话时，至少能从手机上看出是这边占着。
 */
function updateLockHint() {
  var el = document.getElementById('lockhint');
  if (!el) return;
  el.style.display = state.view === 'thread' ? 'flex' : 'none';
  el.textContent = state.handoffPaused ? t('实时更新暂停 · 仅查看') : !state.ready ? t('连接中 · 仅查看') : state.resumed ? t('手机可发送') : t('当前仅查看');
  ['session-control-hint','lock-control-status'].forEach(function(id){
    var hint=$(id);if(!hint)return;
    hint.textContent=state.handoffPaused ? t('实时更新暂停 · 仅查看') : !state.ready ? t('连接中 · 仅查看') : state.resumed
      ?tr('手机已连接此会话，可以发送。电脑能否接手仍由 Codex 的写入锁决定。')
      :tr('当前仅查看。原会话可能由电脑或其他执行端控制；创建独立副本即可在手机继续，不必关闭电脑。');
  });
  // 点它 = 打开「会话写入锁」面板（也是一个入口，见 openLockPanel 的说明）
  if (!el.onclick) {
    el.onclick = function () { openLockPanel(); };
    el.onkeydown = function (ev) {
      if (ev && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openLockPanel(); }
    };
  }
}

/**
 * 「这个会话在别处开着」。
 *
 * 这不是错误，是 Codex 的设计：一个会话同时只能有一个写入者。
 * 电脑上打开着某个会话时，它占着独占写锁，手机这边就进不去 —— 反过来也一样
 * （所以我们在离开时必须 unsubscribe）。光报一句错误没用，得给条出路。
 */
function showWriterConflict(t, why) {
  // 把手机看到的原文记下来（随释放请求报给服务端进日志）。
  // 没有它的时候，服务端只看到一个会话 id —— 排查全靠猜，而这次正是
  // 「猜出来的判据是坏的」把使用者坑了一轮。
  lastWriterError = String(why || '');
  var card = document.createElement('div');
  card.className = 'appr';
  card.id = 'writer-conflict';
  card.innerHTML =
    '<div class="h">' + tr('消息未发送：会话由另一个执行服务占用') + '</div>' +
    '<div class="w" style="margin-top:0">' + tr('这条会话目前只能查看，刚才的消息没有发送。可以复制已保存的上下文，在手机开独立会话继续；电脑上的原会话照常运行。正在执行的步骤不会完整复制，两边改同一项目文件也可能冲突。输入和附件仍在。') + '</div>' +
    '<div class="btns"></div>';

  var btns = card.querySelector('.btns');

  var b1 = document.createElement('button');
  b1.className = 'p';
  b1.textContent = tr('复制上下文，在手机独立续聊');
  b1.onclick = function () { forkCurrentThread(t).then(function(ok){if(ok)card.remove();}); };
  btns.appendChild(b1);

  var b2 = document.createElement('button');
  b2.textContent = tr('同项目新会话（不复制对话）');
  b2.onclick = function () { card.remove(); newThread(t.cwd || null); };
  btns.appendChild(b2);

  var b3 = document.createElement('button');
  b3.textContent = tr('继续查看');
  b3.onclick = function () { card.remove(); };
  btns.appendChild(b3);

  var b4 = document.createElement('button');
  b4.textContent = tr('查看会话控制');
  b4.onclick = openLockPanel;
  btns.appendChild(b4);

  var old = document.getElementById('writer-conflict');
  if (old) old.remove();
  $('body').appendChild(card);
  scrollDown(true);
}

/** Request only the bridge phone subscription handback. */
var lastWriterError = '';

function phoneHandbackIssue(ws, tid) {
  if(!state.ready || !ws || state.ws!==ws || ws.readyState!==1 || !state.thread || state.thread.id!==tid)
    return tr('连接或会话已改变，未断开手机连接；请重新检查后再交还。');
  if(state.running || state.sending || state.resuming || state.queueActivating || state.forking || resumeSubscription ||
     Object.keys(state.pending || {}).some(function(id){return /^(thread\/(start|fork|resume)|turn\/(start|steer))$/.test(state.pending[id].method || '');}))
    return tr('仍有手机任务或连接请求在进行，未断开连接；请等完成后再交还。');
  if(Object.keys(state.approvals || {}).length)
    return tr('还有授权、选择或提问待处理，未断开连接；请处理后再交还。');
  if(typeof queueEntries!=='undefined' && queueEntries.length || queueDraft)
    return tr('仍有待发送内容，未断开连接；请先处理或取消待办后再交还。');
  return '';
}

function verifyPhoneHandbackIdle(ws, tid, requireCurrent) {
  var issue=phoneHandbackIssue(ws,tid);
  if(issue)return Promise.reject(new Error(issue));
  return call('thread/loaded/list',{},10000).then(function(r){
    var ids=r && (r.data || r.threadIds);
    if(!Array.isArray(ids) || r.nextCursor || ids.some(function(id){return typeof id!=='string' || !id;}))
      throw new Error(tr('无法确认所有手机会话的状态，未断开连接；请稍后重试。'));
    ids=ids.slice();
    if(requireCurrent && ids.indexOf(tid)<0)ids.push(tid);
    Object.keys(detachedHandbacks).forEach(function(id){if(ids.indexOf(id)<0)ids.push(id);});
    return Promise.all(ids.map(function(id){
      return call('thread/read',{threadId:id,includeTurns:false},10000).then(function(meta){
        var thread=meta && meta.thread,kind=statusKind(thread && thread.status);
        if(!thread || thread.id!==id || (kind!=='idle' && kind!=='notLoaded') || (id===tid && requireCurrent && kind!=='idle'))
          throw new Error(tr('其他手机会话仍在运行、等待处理或状态未确认，未断开连接；请等完成后再交还。'));
      });
    })).then(function(){
      var changed=phoneHandbackIssue(ws,tid);if(changed)throw new Error(changed);
      return ids;
    });
  });
}

function askReleasePhone(tid, done) {
  // Current Codex may retain an idle writer for roughly a minute after its last
  // subscriber leaves. Socket closure does not prove the computer can resume.
  // Never close a socket with active or unanswered work, and never restart an
  // app-server or the desktop process.
  var ws=state.ws,token={},ids=[],j={writerReleaseVerified:false,writerReleased:null,writerAvailability:'unknown',handoffStatus:'requested'};
  var issue=state.handingBack ? tr('正在检查交还，请稍候再操作。') : phoneHandbackIssue(ws,tid);
  if(issue){done(issue,false,j);return Promise.resolve(false);}
  state.handingBack=token;clearTimeout(state.releaseTimer);state.releaseTimer=null;renderFooter();
  return verifyPhoneHandbackIdle(ws,tid,true).then(function(loaded){
    ids=loaded;
    // This is the encrypted socket that owns the phone subscription, not a new
    // HTTP helper's independent RPC connection.
    return call('thread/unsubscribe',{threadId:tid},15000);
  }).then(function(r){
    j.subscriptionStatus=r && r.status;
    if(['unsubscribed','notSubscribed','notLoaded'].indexOf(j.subscriptionStatus)<0)
      throw new Error(tr('尚未确认取消手机订阅；电脑能否接手仍待确认。'));
    // A background turn or question may arrive during unsubscribe. Check again
    // before closing the shared phone socket, including all other loaded threads.
    return verifyPhoneHandbackIdle(ws,tid,false);
  }).then(function(after){
    var changed=phoneHandbackIssue(ws,tid);if(changed)throw new Error(changed);
    if(!state.handedBackThreads)state.handedBackThreads=Object.create(null);
    ids.concat(after,[tid]).forEach(function(id){state.handedBackThreads[id]=true;});
    state.resumed=false;state.awaitingFirstTurn=false;state.handoffPaused=true;
    setTask('unlinked',tr('已请求交还；电脑能否接手仍待确认。这里继续只读查看，不会自动重新占用。'));
    // Map first, then keep the socket disconnected. A persistent observer may
    // retain Codex's writer; only the user can restore this phone connection.
    ws.close(1000,'phone-handoff');
    j.phoneConnectionCloseRequested=true;
    done(tr('已请求断开手机控制连接，实时更新已暂停；电脑能否接手仍待实际确认。Codex 可能还要约一分钟才释放空闲会话，请稍后在电脑重试。需要时请明确恢复手机连接。'),true,j);
    return true;
  }).catch(function(e){
    done(tr('交还未完成；已保留手机连接：')+e.message,false,j);
    return false;
  }).finally(function(){
    state.handingBack=null;
    renderFooter();
    if(state.ready && state.resumed)scheduleRelease();
  });
}



/**
 * 拉一次「账户 / 额度 / 模型 / 项目」。
 *
 * 这些电脑版都有，手机上也该有 —— 尤其额度：在外面跑了半天，
 * 想知道还剩多少，不该只能回电脑上看。
 */
function loadAccount() {
  call('account/read', {}).then(function (r) { state.account = r; }).catch(function () { });
  call('account/rateLimits/read', {}).then(function (r) { state.limits = r; }).catch(function () { });
  call('account/usage/read', {}).then(function (r) { state.usage = r; }).catch(function () { });
}

function loadModels() {
  return call('model/list', {}).then(function (r) {
    state.models = (r && r.data) || [];
  }).catch(function () { state.models = []; });
}
function loadCollaborationModes() {
  return call('collaborationMode/list',{}).then(function(r){
    state.collaborationModes=((r && r.data)||[]).filter(function(m){return m && ['plan','default'].indexOf(m.mode)>=0;});
  }).catch(function(){state.collaborationModes=[];});
}
function selectedCollaborationMode() {
  if(!state.pick.mode)return null;
  var preset=state.collaborationModes.filter(function(m){return m.mode===state.pick.mode;})[0];
  if(!preset)throw Error(t('服务端没有返回可用协作模式，请使用当前会话设置。'));
  var model=state.pick.model || (state.thread && state.thread.model) || preset.model;
  if(!model)throw Error(t('请等待会话模型信息加载后再切换模式'));
  return {mode:preset.mode,settings:{model:model,
    reasoning_effort:state.pick.effort || preset.reasoning_effort || null,developer_instructions:null}};
}
function collaborationLabel(mode) { return mode==='plan'?t('规划（Plan）'):mode==='default'?t('执行（Default）'):t('沿用会话设置'); }
function openCollaborationPicker() {
  var choices=[{label:t('沿用会话设置'),mode:null}].concat(state.collaborationModes.map(function(m){return {label:collaborationLabel(m.mode),mode:m.mode};}));
  pickList(t('协作模式'),choices,collaborationLabel(state.pick.mode),function(choice){state.pick.mode=choice.mode;openSheet();});
  var info=document.createElement('div');info.className='info';
  info.textContent=state.collaborationModes.length?t('模式将在下一条新任务生效；不会改变电脑配置的审批或沙箱权限。'):t('服务端没有返回可用协作模式，请使用当前会话设置。');
  $('sheetInner').appendChild(info);
}

/** 从会话列表里攒出「最近用过的项目目录」—— 没有专门的项目接口，这是最实在的来源 */
function collectProjects(threads) {
  var seen = {};
  (threads || []).forEach(function (t) {
    if (!t.cwd) return;
    if (!seen[t.cwd]) seen[t.cwd] = { path: t.cwd, n: 0, at: 0 };
    seen[t.cwd].n++;
    seen[t.cwd].at = Math.max(seen[t.cwd].at, timestampMs(t.updatedAt || t.recencyAt));
  });
  return Object.keys(seen).map(function (k) { return seen[k]; })
    .sort(function (a, b) { return b.at - a.at; });
}

/** 目录名，用来当项目显示名（全路径在手机上太长） */
function baseName(p) {
  var s = String(p || '').replace(/[\\/]+$/, '');
  var i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/'));
  return i >= 0 ? s.slice(i + 1) : s;
}

// ── 输入区 ───────────────────────────────────────────────────────────────────
function renderFooter() {
  var paused=$('phone-observation-paused');if(paused)paused.hidden=!state.handoffPaused;
  renderTaskStatus();
  renderAttachments();
  renderQueue();
  renderQueueSaveNotice();
  updateLockHint();   // 「占用中」的提示跟着写锁状态走
  var f = $('footer');
  if (state.view !== 'thread') { f.style.display = 'none'; return; }
  f.style.display = '';
  if (window.DshI18n) window.DshI18n.apply(f);
  var row = f.querySelector('.iconrow');
  var old = row.querySelector('.stop');
  var busy = row.querySelector('.loading');
  var uncertain = !state.ready || ['checking','unknown','offline'].indexOf(task.kind) >= 0;
  var saveOnly=queueOnly();
  var readOnlySave=task.kind==='unlinked';
  var connectionPanel=$('connect-thread-panel');
  if(connectionPanel){
    connectionPanel.hidden=!!state.resumed||!state.thread;
    $('connect-current').disabled=!state.ready||!!state.resuming||!!state.handingBack||!!state.queueActivating;
    $('connect-current').textContent=state.resuming?t('正在连接此会话…'):t('连接此会话');
    $('fork-from-composer').disabled=!state.ready||!!state.forking||!!state.handingBack;
  }
  $('send-mode').style.display=(state.running||saveOnly)&&!readOnlySave?'':'none';
  // ★ 不再因为「状态没确认」就禁用「立即补充」，也不再把它改回「排队发送」。
  //   原来那样做的后果（使用者实测）：任务进行中，他只能排队，而且界面上
  //   看不出为什么；更早的一版还会把他选过的「立即补充」永久覆盖掉。
  //   现在他选什么就是什么，真发的时候会先确认一次当前任务再决定 ——
  //   确认到了就真插队，确认不到就按排队保存并**明确告诉他**。
  var immOpt = $('send-mode').querySelector('option[value="immediate"]');
  if (immOpt) {
    immOpt.disabled = false;
    immOpt.title = uncertain ? t('状态未确认：发送时会先确认一次当前任务') : '';
  }
  $('send-mode').value = sendModePref();
  // Queue is a choice only while a task is running or the executor/status is
  // unconfirmed. For a completed or idle task, send() starts a new turn even
  // when the saved running-task preference is Queue, so the button must say Send.
  var queuing=readOnlySave||((state.running||saveOnly)&&$('send-mode').value==='queue');
  $('send').disabled = !!state.sending || !!state.handingBack || !!state.queueActivating || !!(state.thread && state.forking===state.thread.id) || draftAttachments().some(function(a){return a.status!=='ready';});
  $('send').classList.toggle('queue',queuing);
  $('send').textContent=readOnlySave?t('保存待办'):queuing?t('排队'):'↑';
  $('send').style.fontSize=queuing?'13px':'';
  $('send').title = readOnlySave?t('仅保存到电脑，尚未执行'):queuing ? t('保存到电脑队列，不打断任务') : uncertain ? t('状态未确认：发送时会先确认一次当前任务') : state.running ? t('发送补充意见') : t('发送');
  $('send').setAttribute('aria-label',readOnlySave?t('保存待办'):queuing ? t('加入队列') : state.running ? t('发送补充意见') : t('发送'));
  if(state.queueSavingThreadId===state.thread.id){$('send').textContent=t('保存中…');$('send').setAttribute('aria-label',t('保存中…'));}
  $('input').placeholder = readOnlySave?t('此会话只读；可以保存待办，或复制上下文到手机独立续聊…'):saveOnly ? t('先保存要求，等待接通执行端…') : queuing ? t('输入下一项要求，完成后依次执行…') : state.running ? t('补充要求，不会停止当前任务…') : t('说点什么…');

  // 正在加载会话时，把发送键换成一个明确的「加载中」——
  // 大会话要等几分钟，只弹一句转瞬即逝的提示，使用者会以为按了没反应，
  // 然后反复点。输入框里的字不会丢（send 里只有真正发出去时才清空）。
  if (state.resuming && !busy) {
    if (old) old.remove();
    var ld = document.createElement('span');
    ld.className = 'loading';
    ld.textContent = t('加载中…');
    ld.style.cssText = 'font-size:13px;color:var(--dim);padding:0 10px;' +
      'align-self:center;flex:none';
    row.insertBefore(ld, $('send'));
    $('send').style.display = 'none';
    return;
  }
  if (!state.resuming && busy) {
    busy.remove();
    $('send').style.display = '';
  }
  if (state.resuming) return;

  if (state.running && !old) {
    var s = document.createElement('button');
    s.className = 'stop';
    s.textContent = t('停止');
    s.onclick = stopTurn;
    row.insertBefore(s, $('send'));
    $('send').style.display = '';
  } else if (!state.running && old) {
    old.remove();
    $('send').style.display = '';
  }
  if (old) old.disabled = !state.ready;
}

/**
 * 发消息。第一次发之前才 resume —— 因为 resume 会把整个会话加载进来，
 * 大会话（实测有 3.3GB 的）要几分钟。读历史不需要它，所以不该一进来就付这个代价。
 */
function send() {
  if(state.handingBack){toast(t('正在检查交还，请稍候再操作。'));return;}
  if(state.queueActivating){toast(t('正在确认发送已存内容…'));return;}
  var box = $('input');
  var text = box.value.trim();
  if (!state.thread) return;
  // The visible button is disabled while forking, but keyboard shortcuts can
  // still call send(). Do not submit the snapshot to the original as well.
  if (state.forking===state.thread.id) { toast(t('正在创建独立会话…')); return; }
  var attachments=draftAttachments().slice();
  if(!text && !attachments.length)return;
  if(attachments.some(function(a){return a.status!=='ready';})){toast(t('请等待附件上传完成，或移除上传失败的附件'));return;}
  if (state.sending) { toast(t('消息正在发送')); return; }
  // 他要「立即补充」，但此刻状态没确认：不要一句「先确认」把他挡回去 ——
  // 先替他确认一次，能插队就插队，不能就排队保存并说清楚。
  if (task.kind==='unlinked') { enqueueDraft(text,box,attachments,{deferred:true}); return; }
  if (queueOnly() && $('send-mode').value === 'immediate') {
    sendWhenUncertain(text, box, attachments);
    return;
  }
  if (queueOnly()) { enqueueDraft(text,box,attachments); return; }
  if (!state.ready || ['checking','unknown','offline'].indexOf(task.kind) >= 0) { toast(t('先确认任务状态，再发送消息')); refreshObservedThread(); return; }
  if (state.running) { if($('send-mode').value==='queue')enqueueDraft(text,box,attachments);else steerTurn(text,box,attachments); return; }

  if (state.resuming) { toast(t('会话还在加载，稍等一下')); return; }

  if (!state.resumed) {
    var sendingThread = state.thread;
    state.resuming = true;
    var t0 = Date.now();
    renderFooter();

    // 显示秒数在走 —— 大会话要几分钟，只弹一句转瞬即逝的提示，
    // 使用者会以为按了没反应，然后反复点。
    var note = document.createElement('div');
    note.id = 'resume-note';
    note.className = 'tool';
    note.innerHTML = '<div style="padding:9px 13px;font-size:12.5px;color:var(--dim)">' +
      t('正在加载这个会话… <span id="resume-sec">0</span> 秒') +
      '<div style="font-size:11.5px;color:var(--dim2);margin-top:4px">' +
      t('会话越大越久（有的要几分钟）。加载完会自动把你要发的内容发出去，不用重打。') +
      '</div></div>';
    $('apprs').appendChild(note);

    var tick = setInterval(function () {
      var el = document.getElementById('resume-sec');
      if (el) el.textContent = String(Math.round((Date.now() - t0) / 1000));
    }, 1000);

    call('thread/resume', { threadId: sendingThread.id, excludeTurns: true }, 600000).then(function (r) {
      clearInterval(tick);
      note.remove();
      if (state.thread !== sendingThread || state.view !== 'thread') {
        call('thread/unsubscribe',{threadId:sendingThread.id}).catch(function(){});
        return;
      }
      state.resumed = true;
      scheduleRelease();
      state.resuming = false;
      updateLockHint();
      note.remove();
      var th = (r && (r.thread || r)) || {};
      if (th.name) { state.thread.name = th.name; $('title').textContent = th.name; }
      if (r && r.model) state.thread.model = r.model;
      if (r && r.reasoningEffort) state.thread.reasoningEffort = r.reasoningEffort;
      if (r && r.cwd) state.thread.cwd = r.cwd;
      if (statusKind(th.status) === 'active') {
        setTask('checking',t('会话仍在执行，正在确认可补充的当前轮次；输入已保留。'));
        refreshObservedThread();
        toast(t('已连接运行中的会话，请确认状态后选择排队或立即补充'));
        return;
      }
      toast(t('加载好了（{n} 秒），正在发送…', {n: Math.round((Date.now() - t0) / 1000)}));
      // 加载完就把使用者刚才输入的内容发出去，不用他再打一遍
      box.value = text;
      renderFooter();
      send();
    }).catch(function (e) {
      clearInterval(tick);
      note.remove();
      if(state.thread !== sendingThread || state.view !== 'thread')return;
      state.resuming = false;
      note.remove();
      renderFooter();
      if (/active writer/i.test(e.message)) showWriterConflict(state.thread, e.message);
      else if (/超时|timed out|timeout/i.test(e.message)) {
        addError(t('这个会话太大，加载超时了。历史还能正常翻看，但发消息暂时不行 —— 换一条小一点的会话，或者在电脑上把它处理完。'));
      } else {
        addError(t('这个会话没能加载起来：') + e.message);
      }
    });
    return;
  }

  var submittedThread=state.thread;
  state.sending = true;
  activityVersion++;
  task.activity = '';
  state.turnId = null;
  state.running = true;
  setTask('running',t('消息正在发送，等待任务回执。'));
  renderFooter();

  var params = {
    threadId: state.thread.id,
    input: attachmentInput(text,attachments),
    clientUserMessageId:'pocket-bridge-'+(attachments.some(function(a){return a.upload.kind!=='image';})?'upload-':'msg-')+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2))
  };
  if (state.pick.model) params.model = state.pick.model;
  if (state.pick.effort) params.effort = state.pick.effort;
  try { var mode=selectedCollaborationMode();if(mode)params.collaborationMode=mode; }
  catch(e){state.sending=false;state.running=false;setTask('idle',e.message);toast(e.message);return;}

  // 回执里也带着这一轮的 id —— 不能只依赖 turn/started 通知，
  // 那条一旦没收到，后面的「停止」就会因为缺 turnId 而失败。
  call('turn/start', params).then(function (r) {
    state.sending = false;
    attachmentSent(submittedThread.id,attachments);
    if(state.thread!==submittedThread)return;
    state.awaitingFirstTurn = false;
    if(!submittedThread.name && text && (!submittedThread.preview || submittedThread.preview===t('新会话'))){
      submittedThread.preview=text.replace(/\s+/g,' ').slice(0,72);
      $('title').textContent=submittedThread.preview;
    }
    addLocalUser(attachmentLabel(text,attachments),userTextOf({content:params.input}),params.clientUserMessageId);
    clearSubmittedTextDraft(submittedThread.id,text);
    var id = r && (r.turnId || (r.turn && r.turn.id));
    if (id) state.turnId = id;
    renderFooter();
  }).catch(function (e) {
    state.sending = false;
    if(state.thread!==submittedThread)return;
    state.running = false;
    setTask('unknown',t('发送未确认，正在重新同步任务状态。'));
    renderFooter();
    if (/not found|not loaded/i.test(e.message)) {
      state.resumed = false;
      addError(t('这个会话在服务端被卸载了。再发一次会自动重新加载。'));
    } else {
      addError(t('发送失败：') + e.message);
    }
  });
}

/**
 * 问一次「现在有没有正在跑的那一轮」，拿到它的编号（插队必须带这个）。
 * 拿不到就返回 null —— 调用方据此退回排队，绝不假装插队成功。
 */
function confirmRunningTurn(){
  var tid=state.thread&&state.thread.id;
  if(!tid)return Promise.resolve(null);
  return call('thread/turns/list',{threadId:tid,limit:1,sortDirection:'desc',itemsView:'notLoaded'},8000)
    .then(function(r){
      var t0=r&&r.data&&r.data[0];
      return t0&&t0.status==='inProgress'?t0.id:null;
    },function(){return null;});
}

/**
 * 状态还没确认、但使用者选了「立即补充」时走这里：
 * 先确认一次；确认到正在跑的那一轮就真插队，确认不到就按排队保存并如实说明。
 */
function sendWhenUncertain(text,box,attachments){
  var sendingThread=state.thread;
  if(!sendingThread)return;
  if(!state.resumed){enqueueDraft(text,box,attachments,{deferred:true,
    savedNotice:t('尚未连接到此会话，只保存了待办，没有发送。')});return;}
  state.sending=true;renderFooter();
  toast(t('正在确认当前任务…'));
  refreshObservedThread();
  confirmRunningTurn().then(function(turnId){
    if(state.thread!==sendingThread||state.view!=='thread'){
      state.sending=false;renderFooter();return;
    }
    if(turnId){state.turnId=turnId;steerTurn(text,box,attachments);return;}
    enqueueDraft(text,box,attachments,{deferred:true,
      savedNotice:t('没能确认当前任务，已按排队保存')});
  });
}

function steerTurn(text,box,attachments) {
  attachments=attachments || [];
  if(!state.turnId){
    // Reuse the thread-bound confirmation path for a running turn whose ID
    // has not yet arrived from the observer.
    sendWhenUncertain(text,box,attachments);
    return;
  }
  var tid=state.thread.id, turnId=state.turnId,input=attachmentInput(text,attachments);
  state.sending=true;
  renderFooter();
  call('turn/steer',{threadId:tid,expectedTurnId:turnId,input:input},15000).then(function(){
    attachmentSent(tid,attachments);
    clearSubmittedTextDraft(tid,text);
    if(state.thread && state.thread.id===tid){
      addLocalUser(attachmentLabel(text,attachments),userTextOf({content:input}));
      toast(t('补充意见已发送，任务继续执行'));
    }
  }).catch(function(e){
    if(state.thread && state.thread.id===tid){
      addError(t('补充意见未确认送达，输入已保留。') + (/not found|not loaded|active writer/i.test(e.message)
        ? t('当前任务由电脑端独立服务执行，手机暂时无法向它发送；请在电脑端补充。') : e.message));
    }
  }).finally(function(){state.sending=false;renderFooter();refreshObservedThread();});
}

/** 本地先把用户这条画出来，不等服务端回推 —— 手感差别很大 */
function addLocalUser(text,wireText,clientId) {
  if(clientId && Object.keys(state.items).some(function(key){var item=state.items[key].item;return item && item.type==='userMessage' && item.clientId===clientId;}))return;
  var id = 'local-' + Date.now() + '-' + Math.random().toString(16).slice(2, 6);
  var rec = state.items[id] = { item: { id: id, type: 'userMessage' }, acc: text, created: true };
  state.order.push(id);
  rec.el = buildUser({ content: [{ type: 'text', text: text }] });
  $('body').appendChild(rec.el);
  // 记进「等回推」的名单：服务端那条一到，就把它对上（见 upsertItem），
  // 否则同一句话会被画两遍。
  rememberPendingLocal(id, wireText===undefined?text:wireText,clientId);
  scrollDown(true);
}

// ── 本地占位 ↔ 服务端回推 的配对 ──────────────────────────────────────────────
//
// 只在这两条路上产生占位：send()（立即发送）和 steerTurn()（立即补充）。
// 服务端回推的顺序和我们发的顺序一致，所以**先到先配**（FIFO）。
var PENDING_LOCAL_MAX = 5;      // 最多记几条，免得越攒越多
var PENDING_LOCAL_TTL = 120000; // 两分钟还没等到回推就不再等（那条多半不会来了）

function normalizeSaid(s) {
  return String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
}

/** 服务端那条 userMessage 说的是什么（正文部分） */
function userTextOf(item) {
  var c = (item && item.content) || [];
  if (Array.isArray(c)) {
    return c.filter(function (x) { return x && x.type === 'text'; })
      .map(function (x) { return x.text || ''; }).join('\n');
  }
  return String((item && item.text) || '');
}

function rememberPendingLocal(id, raw, clientId) {
  state.pendingLocal = state.pendingLocal || [];
  state.pendingLocal.push({ id: id, raw: normalizeSaid(raw), clientId:clientId||'', at: Date.now() });
  while (state.pendingLocal.length > PENDING_LOCAL_MAX) state.pendingLocal.shift();
}

/**
 * 取一条「等着被回推对上」的占位。
 *
 * 先找**一字不差**的；找不到再退一步认「前缀相同」—— 因为带附件时本地那条是
 * `正文 + 附件：a、b`，而服务端回推的正文只有 `正文`。前缀比对只在
 * 「刚发出去、还没等到回推」的这几条里做，而且先到先配，所以不会张冠李戴到
 * 会话里别的消息上。
 */
function takePendingLocal(serverText, clientId) {
  var list = state.pendingLocal || [];
  var want = normalizeSaid(serverText);
  var now = Date.now();
  list = list.filter(function (p) { return now - p.at < PENDING_LOCAL_TTL; });
  state.pendingLocal = list;
  if (!want && !clientId) return null;
  var i;
  for (i = 0; i < list.length; i++) if ((clientId && list[i].clientId===clientId) || (want && list[i].raw === want)) break;
  if (i >= list.length) {
    for (i = 0; i < list.length; i++) {
      var a = list[i].raw;
      if (a && want && (a.indexOf(want) === 0 || want.indexOf(a) === 0)) break;
    }
  }
  if (i >= list.length) return null;
  var hit = list.splice(i, 1)[0];
  // 占位那条的 DOM/记录由调用方负责改名，这里只把它从名单里摘掉
  return hit;
}

/**
 * 停止当前这一轮。
 *
 * `turn/interrupt` 的 turnId 是**必填**的。原来只有收到 turn/started 通知时
 * 才记下它，一旦那条通知没到（连接抖动、或者页面刚打开时那一轮已经在跑），
 * state.turnId 就是空的 —— 于是发出去一个缺字段的请求，报
 * 「Invalid request: missing field `turnId`」，而且停不下来。
 *
 * 兜底办法：真不知道 turnId 时，先 resume 一次把它问出来（resume 的回执里带着
 * 当前这一轮），再停。比直接发个坏请求强。
 */
function stopTurn() {
  if (!state.thread) return;

  var doStop = function (turnId) {
    call('turn/interrupt', { threadId: state.thread.id, turnId: turnId })
      .then(function () {
        task.detail=t('已请求停止，等待服务确认。');
        renderTaskStatus();
        refreshObservedThread();
        toast(t('已请求停止'));
      })
      .catch(function (e) { addError(t('停止失败：') + e.message); });
  };

  if (state.turnId) { doStop(state.turnId); return; }

  toast(t('正在确认当前这一轮…'));
  call('thread/turns/list', { threadId: state.thread.id, limit:1,sortDirection:'desc',itemsView:'notLoaded' }, 8000).then(function (r) {
    var current=r && r.data && r.data[0];
    var id = current && /inProgress|in_progress/.test(current.status) && current.id;
    if (id) { state.turnId = id; doStop(id); return; }
    // 连服务端都说不出这一轮是什么，那多半它已经跑完了 —— 把界面状态收回来
    refreshObservedThread();
    toast(t('没有确认到执行中的任务，正在刷新状态'));
  }).catch(function (e) {
    addError(t('停止失败：拿不到当前这一轮（{err}）', {err:e.message}));
  });
}

// ── 菜单 ─────────────────────────────────────────────────────────────────────
// ── 设置面板 ─────────────────────────────────────────────────────────────────
//
// 电脑版有的东西这里也要有：账户、额度、模型、思考强度、项目目录。
// 尤其额度 —— 在外面用了一天，想知道还剩多少，不该只能回电脑上看。

function fmtDuration(mins) {
  if (!mins) return '';
  if (mins < 60) return mins + t(' 分钟');
  if (mins < 1440) return Math.round(mins / 60) + t(' 小时');
  return Math.round(mins / 1440) + t(' 天');
}

function fmtReset(ts) {
  if (!ts) return '';
  var t = Number(ts);
  if (t < 1e12) t *= 1000;
  var d = Math.round((t - Date.now()) / 60000);
  if (d <= 0) return tr('即将重置');
  if (d < 60) return d + tr(' 分钟后重置');
  if (d < 1440) return Math.round(d / 60) + tr(' 小时后重置');
  return Math.round(d / 1440) + tr(' 天后重置');
}

function fmtTokens(n) {
  var v = Number(n) || 0;
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return String(v);
}

/** 账户卡：邮箱、套餐、额度条 */
function accountCard() {
  var a = state.account && state.account.account;
  var rl = state.limits && state.limits.rateLimits;
  var d = document.createElement('div');
  d.className = 'acct';

  if (!a && !rl) {
    d.innerHTML = '<div class="row"><span class="k">' + t('账户') + '</span>' +
      '<span class="v" style="color:var(--dim)">' + t('读不到') + '</span></div>';
    return d;
  }

  var html = '';
  if (a) {
    html += '<div class="row"><span class="k">' + t('账户') + '</span><span class="v">' +
      esc(a.email || a.type || '') + '</span></div>';
    if (a.planType) {
      html += '<div class="row"><span class="k">' + t('套餐') + '</span><span class="v">' +
        esc(a.planType) + '</span></div>';
    }
  }

  if (rl && rl.primary) {
    var p = Math.max(0, Math.min(100, Number(rl.primary.usedPercent) || 0));
    html += '<div class="usage">' +
      '<div class="ubar"><i style="width:' + p + '%"></i></div>' +
      '<div class="utxt"><span>' + t('本周期已用 {p}%', {p:p}) + '</span>' +
      '<span>' + esc(fmtReset(rl.primary.resetsAt)) + '</span></div>' +
      '</div>';
  } else {
    // 走到这里不代表「没有额度」，而是这个账号拿不到周期额度数据 ——
    // 余额制账号（比如 DeepSeek）就没有 primary，只有 credits。
    //
    // 以前这里什么都不渲染，结果是：账户区有邮箱有套餐，额度区一片空白。
    // 使用者分不清是「用完了」「这个套餐本来就没有」还是「查询失败了」。
    // 现在一律说清楚 —— 空白是最糟的状态，它让人没法判断。
    html += '<div class="row"><span class="k">' + t('额度') + '</span>' +
      '<span class="v" style="color:var(--dim)">' +
      (rl ? t('本套餐无周期额度') : t('读不到')) + '</span></div>';
  }
  if (rl && rl.credits && rl.credits.hasCredits) {
    html += '<div class="row"><span class="k">' + t('余额') + '</span><span class="v">' +
      esc(rl.credits.balance || '') + '</span></div>';
  }

  var u = state.usage && state.usage.summary;
  if (u) {
    html += '<div class="row"><span class="k">' + t('累计用量') + '</span><span class="v">' +
      esc(fmtTokens(u.lifetimeTokens)) + ' tokens</span></div>';
  }

  d.innerHTML = html;
  return d;
}

function sheetRow(label, value, onPick, hint) {
  var b = document.createElement('button');
  b.className = 'srow';
  b.innerHTML = '<span class="k">' + esc(label) + '</span>' +
    '<span class="v">' + esc(value) + '</span><span class="arw">›</span>';
  if (hint) b.title = hint;
  // 同理包一层：onPick 如果收参数，直接赋值会把点击事件传进去
  b.onclick = function () { onPick(); };
  return b;
}

/** 二级选择页：一个列表，点一项就回去 */
function pickList(title, items, currentLabel, onPick) {
  var inner = $('sheetInner');
  inner.innerHTML = '';

  var head = document.createElement('button');
  head.className = 'shead';
  head.textContent = '‹ ' + title;
  head.onclick = openSheet;
  inner.appendChild(head);

  if (!items.length) {
    var e = document.createElement('div');
    e.className = 'info';
    e.textContent = t('没有可选项。');
    inner.appendChild(e);
    return;
  }

  items.forEach(function (it) {
    var b = document.createElement('button');
    b.className = 'sopt' + (it.label === currentLabel ? ' on' : '');
    b.innerHTML = '<span class="t">' + esc(it.label) + '</span>' +
      (it.sub ? '<span class="s">' + esc(it.sub) + '</span>' : '') +
      (it.label === currentLabel ? '<span class="ck">✓</span>' : '');
    b.onclick = function () { onPick(it); };
    inner.appendChild(b);
  });
}

function openRenameThreadPanel() {
  if (state.view !== 'thread' || !state.thread) return;
  var target = state.thread;
  var tid = target.id;
  var current = displayThreadTitle(target,'');
  state.renameEditingId=tid;clearTimeout(state.releaseTimer);state.releaseTimer=null;
  function finishRename(){if(state.renameEditingId===tid)state.renameEditingId=null;scheduleRelease();}
  var inner = $('sheetInner'); inner.innerHTML = '';
  var back = document.createElement('button');
  back.className = 'shead'; back.textContent = '‹ ' + tr('重命名这个会话');
  back.onclick = function(){finishRename();openSheet();}; inner.appendChild(back);
  var label = document.createElement('div');
  label.className = 'stitle'; label.textContent = tr('当前名称'); inner.appendChild(label);
  var shown = document.createElement('div');
  shown.className = 'info'; shown.style.overflowWrap = 'anywhere';
  shown.textContent = current || tr('（没有标题）'); inner.appendChild(shown);
  var input = document.createElement('input');
  input.id = 'rename-input'; input.type = 'text'; input.autocomplete = 'off';
  input.setAttribute('aria-label', tr('新名字')); input.value = current;
  promptInputStyle(input); input.style.marginBottom = '10px'; inner.appendChild(input);
  var error = document.createElement('div');
  error.id = 'rename-error'; error.className = 'info'; error.setAttribute('role', 'alert');
  error.style.color = 'var(--bad)'; error.hidden = true; inner.appendChild(error);
  var save = document.createElement('button');
  save.id = 'rename-save'; save.className = 'btn p'; save.textContent = tr('保存名称');
  save.onclick = function () {
    var name = input.value.trim();
    if (!name) { error.textContent = tr('请输入会话名称'); error.hidden = false; input.focus(); return; }
    if (name === current) { finishRename();closeSheet();return; }
    error.hidden = true; save.disabled = true; save.textContent = tr('正在保存…');
    call('thread/name/set', { threadId: tid, name: name }).then(function () {
      target.name = name;
      state.threads.forEach(function (th) { if (th.id === tid) th.name = name; });
      state.searchThreads.forEach(function (th) { if (th.id === tid) th.name = name; });
      writeThreadCache(state.threads);
      if (state.thread && state.thread.id === tid) $('title').textContent = displayThreadTitle(target);
      toast(tr('已改名'));
      finishRename();
      if (inner.contains(save)) closeSheet();
    }).catch(function (e) {
      error.textContent = tr('改名失败：') + e.message;
      error.hidden = false; save.disabled = false; save.textContent = tr('保存名称');
    });
  };
  input.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); save.click(); } };
  inner.appendChild(save);
  var cancel = document.createElement('button');
  cancel.className = 'sclose'; cancel.textContent = tr('取消');
  cancel.onclick = function(){finishRename();openSheet();}; inner.appendChild(cancel);
  $('sheet').classList.add('on');
  input.focus({ preventScroll: true }); input.select();
}

function openSheet() {
  var inner = $('sheetInner');
  inner.innerHTML = '';
  var inThread = state.view === 'thread' && state.thread;

  // 账户与额度 —— 放在最上面，因为它是最常想瞄一眼的东西
  inner.appendChild(accountCard());

  if (inThread) {
    var t = state.thread;
    var sec = document.createElement('div');
    sec.className = 'stitle';
    sec.textContent = tr('这个会话');
    inner.appendChild(sec);

    // 项目（工作目录）
    inner.appendChild(sheetRow(tr('项目'), baseName(t.cwd || tr('（默认）')), function () {
      var items = state.projects.map(function (p) {
        return { label: baseName(p.path), sub: p.path, path: p.path };
      });
      // 换目录等于换一个上下文，得新开一个会话才行 —— 说清楚，别让人以为改了没生效
      pickList(tr('选择项目（会新开一个会话）'), items, baseName(t.cwd || ''), function (it) {
        closeSheet();
        newThread(it.path);
      });
      var note = document.createElement('div');
      note.className = 'info';
      note.textContent = tr('Codex 的工作目录是会话级的，中途改不了 —— 选了会新开一个会话在那个目录下。');
      $('sheetInner').insertBefore(note, $('sheetInner').children[1] || null);
      var other = document.createElement('button');
      other.className = 'sopt';
      other.id = 'project-other-folder';
      other.innerHTML = '<span class="t">' + esc(tr('其他文件夹（手输绝对路径）')) + '</span><span class="arw">›</span>';
      other.onclick = openNewThreadPicker;
      $('sheetInner').appendChild(other);
    }, t.cwd || ''));

    // 模型
    inner.appendChild(sheetRow(tr('模型'),
      modelLabel(state.pick.model || t.model || tr('（会话默认）')), function () {
        var items = [{ label: tr('（用会话自己的）'), model: null }].concat(
          state.models.map(function (m) {
            return {
              label: m.displayName || m.id, sub: m.id, model: m.id,
              efforts: m.supportedReasoningEfforts || m.reasoningEfforts || []
            };
          }));
        pickList(tr('选择模型'), items, modelLabel(state.pick.model || t.model), function (it) {
          // Returning to the conversation's model also returns to its own
          // effort. A different model with no explicit effort uses that model's
          // default; carrying over the old effort would misstate what we send.
          state.pick.model = it.model && it.model !== t.model ? it.model : null;
          state.pick.effort = null;
          state.currentEfforts = state.pick.model ? (it.efforts || []) : null;
          openSheet();
        });
      }));

    // 思考强度
    var modelId = state.pick.model || t.model;
    var mdl = state.models.filter(function (m) { return m.id === modelId; })[0];
    var efforts = state.currentEfforts ||
      (mdl && (mdl.supportedReasoningEfforts || mdl.reasoningEfforts)) || [];
    var differentModel = !!state.pick.model && state.pick.model !== t.model;
    var defaultEffortLabel = differentModel ? tr('所选模型默认档位') : tr('（用会话自己的）');
    var shownEffort = state.pick.effort || (differentModel ? defaultEffortLabel : t.reasoningEffort || tr('（默认）'));
    inner.appendChild(sheetRow(tr('思考强度'),
      shownEffort, function () {
        var items = [{ label: defaultEffortLabel, effort: null }].concat(
          efforts.map(function (e) {
            return {
              label: e.reasoningEffort || e.effort || String(e),
              sub: e.description || '', effort: e.reasoningEffort || e.effort
            };
          }));
        pickList(tr('选择思考强度'), items, shownEffort, function (it) {
          state.pick.effort = it.effort;
          openSheet();
        });
      }));

    inner.appendChild(sheetRow(tr('协作模式'),collaborationLabel(state.pick.mode),openCollaborationPicker));

    var sec2 = document.createElement('div');
    sec2.className = 'stitle';
    sec2.textContent = tr('操作');
    inner.appendChild(sec2);

    inner.appendChild(sheetRow(tr('重命名这个会话'), '', openRenameThreadPanel));

    inner.appendChild(sheetRow(tr('归档这个会话'), '', openArchiveThreadPanel));

    inner.appendChild(sheetRow(tr('回到会话列表'), '', function () { closeSheet(); loadThreads(); }));
  } else {    var info = document.createElement('div');
    info.className = 'info';
    info.textContent = state.account && state.account.account
      ? tr('在手机上用 Codex。会话和电脑上是同一份 —— 手机上发的话，电脑那边也看得到。')
      : tr('还没读到账户信息。检查一下 Codex 是否已登录。');
    inner.appendChild(info);
  }

  // ── 会话写入锁（**两个视图里都有**）────────────────────────────────────────
  //
  // 写入锁入口需要固定位置，方便查找。
  // 原来它只长在被占用那张错误卡片上 —— 那不叫入口，那叫碰运气。
  // 这里给它一个固定的位置：设置面板里，点进去就是那个面板。
  var secLock = document.createElement('div');
  secLock.className = 'stitle';
  secLock.textContent = tr('会话写入锁');
  inner.appendChild(secLock);

  inner.appendChild(sheetRow(tr('会话写入锁'),
    // 值里给**会话名**，别只写「（这条会话）」—— 让人一眼看出这一下会动到哪一条
    state.thread ? displayThreadTitle(state.thread,tr('（没有标题）')) : tr('先打开一条会话'),
    function () { openLockPanel(); }));

  var lockHintRow = document.createElement('div');
  lockHintRow.className = 'info';lockHintRow.id='session-control-hint';
  lockHintRow.textContent = state.resumed
    ? tr('手机已连接此会话，可以发送。电脑能否接手仍由 Codex 的写入锁决定。')
    : tr('当前仅查看。原会话可能由电脑或其他执行端控制；创建独立副本即可在手机继续，不必关闭电脑。');
  inner.appendChild(lockHintRow);

  var sec3 = document.createElement('div');
  sec3.className = 'stitle';
  sec3.textContent = tr('其他');
  inner.appendChild(sec3);

  // 语言：自动按设备语言选（i18n.js 读 navigator.languages），但手动选过就以手动为准。
  // makeSwitcher() 自己会写 localStorage['dsh-lang']，change 时也会调 applyAll()。

  langRow.className = 'srow';
  var langKey = document.createElement('span');

  langKey.setAttribute('data-i18n', '语言');

  langRow.appendChild(langKey);

  inner.appendChild(langRow);

  inner.appendChild(sheetRow(tr('Dot · 官方使用指南'), tr('通过官方 ChatGPT App'), function () {
    location.href = '/dot-guide' + location.hash;
  }));

  inner.appendChild(sheetRow(tr('换一个目标（DSH / Codex）'), '', function () {
    // 带上 location.hash（加密密钥），否则换一次目标就变明文
    location.href = '/?target=pick' + location.hash;
  }));
  inner.appendChild(sheetRow(tr('刷新账户与额度'), '', function () {

    setTimeout(openSheet, 900);
  }));

  inner.appendChild(sheetRow(tr('重新连接'), '', function () {
    closeSheet();
    try { state.ws.close(); } catch (e) { }
    toast(tr('正在重连…'));
  }));

  var close = document.createElement('button');

  close.textContent = tr('关闭');

  $('sheet').classList.add('on');
  if (window.DshI18n) window.DshI18n.apply($('sheetInner'));

function modelLabel(id) {
  if (!id) return t('（会话默认）');
  var m = state.models.filter(function (x) { return x.id === id; })[0];
  return m ? (m.displayName || m.id) : id;
}

function closeSheet() {
  $('sheet').classList.remove('on');
  if(state.renameEditingId){state.renameEditingId=null;scheduleRelease();}
}

/**
 * 「会话写入锁」面板：为释放写入锁提供固定入口。
 *
 * 原来那个「释放电脑端的锁」只长在**被占用那张卡片**上，也就是说：
 * 只有正好撞上冲突、而且正好看见那张卡片，才知道有这个功能。
 * 仅在错误卡片中出现的操作不易被发现。
 *
 * 现在有三个入口，都在人能想到的地方：
 *   1. 设置面板（⚙）→「会话写入锁」——随时可点，不依赖有没有冲突；
 *   2. 标题栏那个「🔒 占用中」小标（手机正占着锁时才有）—— 点它也是这里；
 *   3. 撞上冲突时那张卡片上的按钮（原来就有）。
 */
function openLockPanel() {
  var inner = $('sheetInner');
  inner.innerHTML = '';

  var head = document.createElement('button');
  head.className = 'shead';
  head.textContent = '‹ ' + tr('会话控制');
  head.onclick = openSheet;
  inner.appendChild(head);

  var th = state.thread;
  var info = document.createElement('div');
  info.className = 'info';
  info.textContent = tr('同一条会话同时只能有一个地方发送。查看不会占锁；若电脑正在使用原会话，手机可以创建独立副本继续。已保存的待办尚未执行。');
  inner.appendChild(info);
  var promptInfo=document.createElement('div');promptInfo.className='info';promptInfo.textContent=tr('电脑端任务的授权、选择和提问仍需在电脑端处理；当前连接只能同步其记录。手机接管后发起的新任务，可以在这里处理请求。');inner.appendChild(promptInfo);

  if (th) {
    var row = document.createElement('div');
    row.className = 'srow';
    row.innerHTML = '<span class="k">' + esc(tr('这条会话')) + '</span>' +
      '<span class="v">' + esc(displayThreadTitle(th,tr('（没有标题）'))) + '</span>';
    inner.appendChild(row);

    var st = document.createElement('div');
    st.className = 'info';st.id='lock-control-status';
    st.textContent = state.resumed
      ? tr('手机已连接此会话，可以发送。电脑能否接手仍由 Codex 的写入锁决定。')
      : tr('当前仅查看。原会话可能由电脑或其他执行端控制；创建独立副本即可在手机继续，不必关闭电脑。');
    inner.appendChild(st);

    if(!state.resumed){
      var fork=document.createElement('button');fork.className='btn p';
      fork.textContent=tr('复制上下文，在手机独立续聊');
      fork.onclick=function(){closeSheet();forkCurrentThread(th);};
      inner.appendChild(fork);
      var forkHelp=document.createElement('div');forkHelp.className='info';
      forkHelp.textContent=tr('电脑原会话继续运行。副本只包含已保存的上下文；正在执行的步骤可能不完整。同一项目目录的并行文件修改可能冲突。');
      inner.appendChild(forkHelp);
      var connect=document.createElement('button');connect.className='btn';connect.id='lock-connect-current';
      connect.textContent=tr('连接此会话');connect.disabled=!state.ready||!!state.resuming||!!state.queueActivating;
      connect.onclick=function(){closeSheet();connectCurrentThread(false);};inner.appendChild(connect);
      var connectHelp=document.createElement('div');connectHelp.className='info';
      connectHelp.textContent=tr('正在执行的任务不会停止；连接后仍需点击发送。');inner.appendChild(connectHelp);
    }

    // ★ 先摆「没代价的那一个」：只松开手机这边占的会话，不碰电脑上的 Codex。
    //   两个按钮的分工必须一眼看清 —— 使用者 2026-09-27 分不清，
    //   以为「释放电脑端的锁」把电脑上的 Codex 弄坏了（那个按钮确实会关掉它，
    //   他没看错；但「只松手机」的这个当时还不存在）。
    var safe = document.createElement('button');
    safe.className = 'btn';
    safe.id = 'lock-release-phone';
    safe.textContent = tr('交还手机控制…');
    safe.style.display=state.resumed?'':'none';
    safe.onclick = function () {
      openPhoneReleasePanel(th);
    };
    inner.appendChild(safe);

    var safeCost = document.createElement('div');
    safeCost.className = 'info';
    safeCost.textContent = tr('此操作只请求取消桥对此会话的订阅，不关闭电脑 Codex，也不发送停止任务命令。Codex 可能保留占用一段时间；电脑能否接手需要实际确认。');
    safeCost.style.display=state.resumed?'':'none';
    inner.appendChild(safeCost);

    var ownerNote=document.createElement('div');ownerNote.className='info';
    ownerNote.textContent=tr('当前无法验证占用者，不能从手机关闭桌面 Codex。请在电脑结束原任务，或复制上下文独立续聊。');
    inner.appendChild(ownerNote);
  } else {
    var none = document.createElement('div');
    none.className = 'info';
    none.textContent = tr('先打开一条会话，再回到这里 —— 锁是按会话算的，得先知道是哪一条。');
    inner.appendChild(none);
  }

  var close = document.createElement('button');
  close.className = 'sclose';
  close.textContent = tr('关闭');
  close.onclick = closeSheet;
  inner.appendChild(close);

  $('sheet').classList.add('on');
  if (window.DshI18n) window.DshI18n.apply($('sheetInner'));
}

function openPhoneReleasePanel(th) {
  var inner=$('sheetInner');inner.innerHTML='';
  var head=document.createElement('button');head.className='shead';
  head.textContent='‹ '+tr('确认交还手机控制');head.onclick=openLockPanel;inner.appendChild(head);
  var name=document.createElement('div');name.className='stitle';
  name.textContent=displayThreadTitle(th,tr('（没有标题）'));inner.appendChild(name);
  var note=document.createElement('div');note.className='info';
  note.textContent=tr('先确认所有手机会话均已结束、没有待处理请求和待办，再取消当前订阅并断开这条手机连接。页面保留已加载的历史，实时更新暂停，只有你点击恢复后才重连。不关闭电脑 Codex，也不发送停止任务命令；电脑能否接手需要实际确认。');inner.appendChild(note);
  if(state.running){var running=document.createElement('div');running.className='info';running.textContent=tr('任务仍在运行，请等它结束后交还。查看或切回列表不会主动停止任务。');inner.appendChild(running);}
  if(state.awaitingFirstTurn){var empty=document.createElement('div');empty.className='info';empty.textContent=tr('尚未发送首条消息；交还会丢弃这个空会话。输入的草稿仍会保留在当前页面。');inner.appendChild(empty);}
  var result=document.createElement('div');result.id='phone-release-result';result.className='info';result.setAttribute('role','status');result.hidden=true;inner.appendChild(result);
  var confirmButton=document.createElement('button');confirmButton.className='btn';confirmButton.id='phone-release-confirm';
  confirmButton.textContent=tr('确认交还');confirmButton.disabled=state.running;
  confirmButton.onclick=function(){
    if(!state.thread||state.thread.id!==th.id||state.running)return;
    confirmButton.disabled=true;confirmButton.textContent=tr('正在请求交还…');
    askReleasePhone(th.id,function(text,ok,j){
      result.hidden=false;result.textContent=text;
      confirmButton.textContent=ok?tr('确认交还'):tr('重试');confirmButton.disabled=ok;confirmButton.hidden=ok;
      if(!ok)return;
      cancel.textContent=tr('关闭');cancel.onclick=closeSheet;
      if(state.thread&&state.thread.id===th.id){
        state.resumed=false;state.awaitingFirstTurn=false;
        if(!state.handedBackThreads)state.handedBackThreads=Object.create(null);
        state.handedBackThreads[th.id]=true;
        clearTimeout(state.releaseTimer);state.releaseTimer=null;
        setTask('unlinked',tr('已请求交还；电脑能否接手仍待确认。这里继续只读查看，不会自动重新占用。'));
      }
      var fork=document.createElement('button');fork.className='btn p';fork.textContent=tr('复制上下文，在手机独立续聊');
      fork.disabled=!!state.handoffPaused||!state.ready;
      fork.onclick=function(){closeSheet();forkCurrentThread(th);};inner.appendChild(fork);
      var fresh=document.createElement('button');fresh.className='btn';fresh.textContent=tr('新建同项目会话');
      fresh.disabled=!!state.handoffPaused||!state.ready;
      fresh.onclick=function(){closeSheet();newThread(th.cwd||null);};inner.appendChild(fresh);
    });
  };
  inner.appendChild(confirmButton);
  var cancel=document.createElement('button');cancel.className='sclose';cancel.textContent=tr('取消');cancel.onclick=openLockPanel;inner.appendChild(cancel);
  $('sheet').classList.add('on');
}

/**
 * 语音识别用哪个语言：跟着界面语言走。
 *
 * 原来两个调用点都写死 'zh-CN' —— 界面切成英文/西语了，语音还是按中文识别，
 * 说英文出来一堆同音错字（使用者问「语音模式是只有中文吗」就是这么来的）。
 * voice.js 本来就支持 o.lang，只是没人传。
 */
function voiceLang() {
  var cur = 'zh';
  try { if (window.DshI18n && window.DshI18n.lang) cur = window.DshI18n.lang() || 'zh'; } catch (e) { }
  if (cur === 'en') return 'en-US';
  if (cur === 'es') return 'es-ES';
  return 'zh-CN';
}

function toast(msg) {
  var t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:78px;transform:translateX(-50%);' +
      'background:#25252d;border:1px solid #35353f;color:#eee;padding:9px 18px;' +
      'border-radius:11px;font-size:13.5px;z-index:30;opacity:0;transition:opacity .18s;' +
      'pointer-events:none;max-width:84vw;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.style.opacity = '0'; }, 2400);
}

/**
 * 软键盘占掉的高度 → --kb。
 *
 * iOS Safari 弹键盘时**不改布局视口**，只改 visualViewport，所以
 * height:100dvh 一点用都没有，底部的输入框会被键盘盖住（这是老问题）。
 * 这里把「被吃掉的高度」量出来写成 CSS 变量，让容器跟着缩。
 *
 * 三条保守做法，都是怕算错：
 *   · 只取正数（算出来是负的就当 0）
 *   · 只缩不放 —— 算错时宁可留一条缝，也不能把整个界面顶出屏幕
 *   · 没有 visualViewport 就整个跳过（老浏览器上行为完全不变）
 *
 * ⚠️ 这一段**没有在真机上验过**（手上没有 iPhone，无头浏览器也不会弹键盘）。
 *    桌面浏览器不会触发它：visualViewport 高度始终等于窗口高度，--kb 恒为 0。
 *    真机验证在计划里单列（「Android/iOS 的真实前后台与锁屏测试需要真机参与」）。
 */
(function () {
  var vv = window.visualViewport;
  if (!vv) return;
  function apply() {
    try {
      var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', Math.round(kb) + 'px');
    } catch (e) { /* 量不出来就保持原样，不能因此把界面弄坏 */ }
  }
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
  apply();
})();

/**
 * 回到前台时核对一次「这条会话还归我们吗」。
 *
 * 为什么要它：服务端在手机断开 60 秒后会自动把占用还回电脑（那是使用者要的
 * 「手机端关闭后电脑端能接手」），所以手机切回来时本地那份「我占着它」可能已经过期。
 * 不核对的话，发消息会撞上「会话未加载」，使用者看到的是要刷新 —— 而他要的是
 * **切应用不需要刷新、换 DSH 再切回来也流畅**。
 */
function ensureOwnershipAfterResume() {
  if (state.view !== 'thread' || !state.thread || !state.ready) return;
  if (!state.resumed) { refreshObservedThread(); return; }
  var tid = state.thread.id;
  call('thread/loaded/list', {}, 6000).then(function (r) {
    var ids = (r && (r.data || r.threadIds)) || [];
    if (!Array.isArray(ids) || ids.indexOf(tid) >= 0) return;   // 还占着 / 问不出来 → 什么都不做
    // Returning to the tab is observation, not consent to seize the writer.
    if (state.thread && state.thread.id === tid) {
      state.resumed = false;
      clearTimeout(state.releaseTimer);state.releaseTimer=null;
      renderFooter();refreshObservedThread();
    }
  }).catch(function () { });
}

try {
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') ensureOwnershipAfterResume();
  });
} catch (e) { }

// 🎤 语音输入。
//
// 用浏览器原生的识别接口（DshVoice），不引依赖。关键是**不可用时要说实话**：
// iPhone 的 Safari 不开放这个接口，做个点了没反应的按钮比没有更糟 ——
// 而手机键盘自带的听写其实就能干这件事，而且更稳。
(function () {
  var btn = $('btn-voice');
  var box = $('input');
  var rec = null;
  var base = '';

  if (!window.DshVoice || !window.DshVoice.available()) {
    // 不可用时**不是**给一句一闪而过的 toast，而是打开一个能读、能照着做的面板。
    //
    // 原来的做法是 toast(whyNot()) —— 使用者的真实反馈是
    // 「有标识，但点了不知道怎么用」：toast 两秒就没了，
    // 而「iPhone 上要用键盘的麦克风」这件事需要好几个步骤才说得清。
    btn.title = window.DshVoice ? window.DshVoice.whyNot() : t('这个浏览器不支持语音输入');
    btn.style.opacity = '.45';
    btn.onclick = function () {
      if (window.DshVoice && window.DshVoice.explain) window.DshVoice.explain();
      else toast(t('这个浏览器不支持语音输入 —— 请用键盘上的麦克风。'));
    };
    return;
  }

  btn.title = t('语音输入');

  btn.onclick = function () {
    if (rec) { rec.stop(); return; }      // 再点一次 = 结束

    base = box.value ? box.value + ' ' : '';
    btn.textContent = '⏺';
    btn.style.color = '#ff6b6b';
    toast(t('在听了，说完会自动停下'));

    rec = window.DshVoice.start({
      lang: voiceLang(),
      // 边说边填进输入框 —— 使用者能看出它在听，而不是对着屏幕干等
      onPartial: function (text) {
        window.DshVoice.setInputValue(box, base + text);
      },
      onFinal: function (text) {
        window.DshVoice.setInputValue(box, (base + text).trim());
      },
      onError: function (msg) { toast(msg); },
      onEnd: function () {
        rec = null;
        btn.textContent = '🎤';
        btn.style.color = '';
      }
    });
  };
})();

var input = $('input');
input.addEventListener('input', function () {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    e.preventDefault();
    send();
  }
});

// 语言切换时：静态的 data-i18n 由 apply() 刷新，JS 渲染出来的那几块自己重画一遍。

  // <select> 的 change 事件里把它自己删掉。
  if ($('sheet').classList.contains('on')) setTimeout(openSheet, 0);
};
