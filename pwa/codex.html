/** 子代理：Codex 会派好几个自己并行干活，电脑版上能看到它们各自的进展 */
function buildSubAgent(item) {
  var kind = item.kind || 'activity';
  var path = item.agentPath || item.agentThreadId || '';
  var label = /start/.test(kind) ? t('子代理启动')
    : /finish|complete|done/.test(kind) ? t('子代理完成')
    : /error|fail/.test(kind) ? t('子代理出错') : t('子代理');
  return el('', '<div class="tool"><div style="padding:9px 13px;font-size:12.5px;' +
    'color:#9a9aa4;display:flex;gap:9px"><span>🤖</span><span>' + esc(label) +
    (path ? '　<span style="color:#6a6a74;font-family:ui-monospace,monospace">' +
      esc(String(path).slice(-28)) + '</span>' : '') + '</span></div></div>');
}

/** 多个代理之间的协作调用 */
function buildCollab(item) {
  var tool = item.tool || 'collab';
  var prompt = item.prompt ? String(item.prompt).slice(0, 160) : '';

  // agentsStates 可能是数组也可能是对象（按代理 id 索引），两种都兜住 ——
  // 直接 .map 会在其中一种上抛异常，而且是在渲染中间抛，整条会话都出不来。
  var raw = item.agentsStates;
  var states = Array.isArray(raw) ? raw
    : (raw && typeof raw === 'object')
      ? Object.keys(raw).map(function (k) {
        var v = raw[k];
        return (v && typeof v === 'object') ? Object.assign({ id: k }, v) : { id: k, status: v };
      })
      : [];

  var rows = states.map(function (s) {
    return '<li><span class="st">·</span><span>' +
      esc(s.name || s.agentPath || s.threadId || s.id || '') +
      (s.status ? '　' + esc(String(s.status)) : '') + '</span></li>';
  }).join('');

  var d = document.createElement('details');
  d.className = 'tool';
  d.innerHTML = '<summary><span class="kind">' + t('协作') + '</span>' +
    '<span class="head">' + esc(tool + (prompt ? '　' + prompt : '')) + '</span>' +
    (item.status ? '<span class="badge">' + esc(item.status) + '</span>' : '') + '</summary>' +
    (rows ? '<ul class="files">' + rows + '</ul>' : '');
  return d;
}

function buildImage(path) {
  if (!path) return buildNote(t('图片'));
  // 图片直接显示出来 —— 这是最需要「看一眼」的产出
  return buildImageView(path);
}

function buildNote(text) {
  return el('', '<div class="tool"><div style="padding:9px 13px;font-size:12.5px;' +
    'color:#8e8e99">' + esc(text) + '</div></div>');
}

/**
 * 换了语言之后，把已经渲染出来的消息按新语言重画一遍。
 *
 * 为什么需要：消息列表是 JS 拼出来的（「你」「思考摘要」「命令」「成功」这些
 * 标签都在 JS 里），i18n.apply() 只认 data-i18n 属性，管不到它们。
 * item 数据本身没变，只是重新 buildItem 一次 —— 和 upsertItem 里
 * 「replaceWith 一个新节点」是同一个套路，所以连接关系不会丢。
 */
function rebuildItems() {
  if (state.view !== 'thread') return;
  var box = $('body');
  state.order.forEach(function (id) {
    var rec = state.items[id];
    // created=true 是 addLocalUser 先画出来的那条：正文在 rec.acc 里而不是
    // item.content 里，重画会把它画空，所以跳过。
    // ★ 注意：它**不是**「马上会被回推顶掉」—— 顶掉这件事是 upsertItem 里
    //   显式做的（用 takePendingLocal 配对，再把占位的 id 改名成服务端那条）。
    //   这句注释原来写的就是「马上会被服务端的回推顶掉」，而当时**没有那段代码** ——
    //   于是同一句话被画两遍。
    //   注释骗了自己一整轮，所以这里把「谁负责顶掉」写清楚。
    if (!rec || !rec.el || rec.created || !rec.item) return;
    var fresh = buildItem(rec.item, rec);
    if (rec.el.open) fresh.open = true;
    if (rec.el.isConnected) rec.el.replaceWith(fresh);
    else box.appendChild(fresh);
    rec.el = fresh;
  });
  var hint = document.getElementById('older-hint');
  if (hint) prependOlderHint();
  var jump = document.getElementById('jump');
  if (jump) jump.textContent = t('↓ 最新');
}

function addError(msg) {
  $('body').appendChild(el('msg err', '<div class="bub">' + esc(msg) + '</div>'));
  scrollDown();
}

function renderPlan(steps, turnId) {
  var old = document.getElementById('live-plan');
  if (old) old.remove();
  if (!steps.length) return;
  var rows = steps.map(function (s) {
    var st = String(s.status || '').toLowerCase();
    var mark = st === 'completed' ? '✓' : (st === 'inProgress' || st === 'in_progress' || st === 'started' ? '▸' : '○');
    var cls = st === 'completed' ? 'done' : (mark === '▸' ? 'doing' : '');
    return '<div class="s ' + cls + '"><span class="m">' + mark + '</span><span>' +
      esc(s.step || s.text || s.title || '') + '</span></div>';
  }).join('');
  var d = el('', '<div class="plan"><div class="h">' + t('进行中的计划') + '</div>' + rows + '</div>');
  d.id = 'live-plan';
  $('body').appendChild(d);
  scrollDown();
}

// ── 会话列表 ─────────────────────────────────────────────────────────────────
function loadThreads() {
  stopObserving();
  // 离开会话时把写锁还回去 —— 不还的话，电脑上的 Codex 就再也打不开它了
  releaseThread();
  state.view = 'list';
  state.thread = null;
  renderTaskStatus();
  state.items = {}; state.order = [];
  // 换会话时把「等回推的占位」也清掉：它们属于上一条会话，留着会认错人
  state.pendingLocal = [];
  $('title').textContent = 'Codex';
  $('back').style.display = 'none';
  $('footer').style.display = 'none';

  // 先把列表贴出来，再等服务端的新数据。
  //
  // 三层，按快慢排：
  //   1. 网关的预热缓存（/codex/threads）—— 电脑上一直在后台问，十几毫秒
  //   2. 浏览器 localStorage —— 上次访问留下的
  //   3. 直接问 app-server —— 8~10 秒（它得读每条会话的元数据，有几条是 GB 级的）
  //
  // 原来只有第 2 层，所以**冷启动（换浏览器、清了缓存）要等满 10 秒**。
  // 第 1 层是这一版加的：把「列会话」挪到电脑上做，手机上就不用等。
  var cached = readThreadCache();
  if (cached && cached.length) {
    state.threads = cached;
    state.projects = collectProjects(cached);
    renderThreads();
  } else {
    $('body').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  }

  // 第 1 层：问网关要预热好的列表（拿不到就安静地走下面那条）
  privateFetch('/codex/threads', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok || !j.list || !j.list.length) return;
      if (state.view !== 'list') return;
      state.threads = j.list;
      state.projects = collectProjects(j.list);
      writeThreadCache(j.list);
      renderThreads();
    })
    .catch(function () { });

  call('thread/list', { limit: 60 }).then(function (r) {
    if (state.view !== 'list') return;
    state.threads = (r && r.data) || [];
    state.projects = collectProjects(state.threads);
    writeThreadCache(state.threads);
    renderThreads();
  }).catch(function (e) {
    // 缓存能用就别把屏幕清掉 —— 好歹让人能点进去
    if (cached && cached.length) { toast(t('列表没能刷新：') + e.message); return; }
    $('body').innerHTML = '';
    addError(t('读不到会话列表：') + e.message);
    var b = document.createElement('button');
    b.className = 'btn'; b.textContent = t('重试');
    b.onclick = loadThreads;
    $('body').appendChild(b);
  });
}

var THREAD_CACHE_KEY = 'dsh-codex-threads-v1';

/** 上次拿到的会话列表 —— 用来先垫一下，别让屏幕空着 */
function readThreadCache() {
  try {
    var j = JSON.parse(localStorage.getItem(THREAD_CACHE_KEY) || 'null');
    // 超过一天就别用了：会话可能早被删了，贴出来反而误导
    if (!j || !j.at || Date.now() - j.at > 86400000) return null;
    return j.list || null;
  } catch (e) { return null; }
}

function writeThreadCache(list) {
  try {
    localStorage.setItem(THREAD_CACHE_KEY,
      JSON.stringify({ at: Date.now(), list: (list || []).slice(0, 60) }));
  } catch (e) { /* 存不下不影响功能 */ }
}

function renderThreads() {
  var box = $('body');
  var q = state.filter.trim().toLowerCase();
  box.innerHTML = '';

  // 搜索框
  var s = document.createElement('div');
  s.className = 'search';
  s.innerHTML = '<span style="color:#6a6a74">🔍</span>' +
    '<input id="q" placeholder="' + t('搜会话') + '" value="' + esc(state.filter) + '">';
  box.appendChild(s);
  var qi = s.querySelector('#q');
  qi.oninput = function () {
    state.filter = qi.value;
    renderThreadListOnly();
  };

  var nw = document.createElement('button');
  nw.className = 'btn p';
  nw.textContent = t('＋ 开一个新会话');
  // 必须包一层。直接写 `nw.onclick = newThread` 的话，点击事件会被当成
  // 第一个参数传进去 —— newThread(cwd) 收到一个 MouseEvent，于是把它塞进
  // params.cwd 发给服务端，报「invalid type: map, expected a string」。
  // 这个错到现在才被发现，是因为这个按钮平时没人点（都是从会话里开新的）。
  nw.onclick = function () { newThread(); };
  box.appendChild(nw);

  var listBox = document.createElement('div');
  listBox.id = 'thlist';
  box.appendChild(listBox);
  fillThreadList(listBox, q);
  if (window.DshI18n) window.DshI18n.apply(box);
}

function renderThreadListOnly() {
  var listBox = document.getElementById('thlist');
  if (!listBox) return;
  fillThreadList(listBox, state.filter.trim().toLowerCase());
}

function fillThreadList(box, q) {
  box.innerHTML = '';
  var list = state.threads.filter(function (t) {
    if (!q) return true;
    return ((t.name || '') + ' ' + (t.preview || '')).toLowerCase().indexOf(q) >= 0;
  });

  if (!list.length) {
    box.innerHTML = '<div class="empty">' + (q ? t('没有匹配的会话') : t('还没有会话')) + '</div>';
    return;
  }

  // ── 按**项目**分组，可以折叠 ────────────────────────────────────────────────
  //
  // 项目分组与 DSH 保持一致。原来这里按服务端给的 section（时间是「今天 / 更早」那一类）分组，
  // 而且是死标题、不能收 —— 会话一多就得一直往下滚。
  //
  // 分组键用 cwd（工作目录），组名取目录名，右边小字给完整路径的一部分。
  // 组的顺序按「组里最近动过的那条」排 —— 常用项目自然浮到上面。
  var groups = {};
  var order = [];
  list.forEach(function (th) {
    var key = th.cwd || '';
    if (!groups[key]) { groups[key] = { key: key, items: [], latest: 0 }; order.push(key); }
    groups[key].items.push(th);
    var at = th.updatedAt || th.recencyAt || 0;
    var when = typeof at === 'number' ? at : Date.parse(at);
    if (Number.isFinite(when) && when > groups[key].latest) groups[key].latest = when;
  });
  // 没有项目的那些放最后（比如还没定目录的会话）
  var sorted = order.slice().sort(function (a, b) {
    if (a === '') return 1;
    if (b === '') return -1;
    return groups[b].latest - groups[a].latest;
  });

  var folded = readFolded();

  // 搜索时**一律展开**：搜出来的东西藏在合着的组里，等于没搜到
  if (q) folded = {};

  // 全部折叠 / 全部展开 —— 会话多的时候一眼收干净
  var anyOpen = sorted.some(function (k) { return !folded[k]; });
  var all = document.createElement('button');
  all.className = 'pgfold';
  all.textContent = anyOpen ? t('全部折叠') : t('全部展开');
  all.onclick = function () {
    var next = readFolded();
    sorted.forEach(function (k) { if (anyOpen) next[k] = 1; else delete next[k]; });
    writeFolded(next);
    renderThreadListOnly();
  };
  box.appendChild(all);

  sorted.forEach(function (k) {
    var g = groups[k];
    var isFolded = !!folded[k];
    var head = document.createElement('button');
    head.className = 'pghead' + (isFolded ? ' closed' : '');

    var name = k ? baseName(k) : t('（没有项目）');
    var running = g.items.some(function (th) {
      var st = th.status && (th.status.type || th.status);
      return st === 'running' || st === 'active' || st === 'inProgress';
    });
    var waiting = g.items.some(function (th) {
      var flags = (th.status && th.status.activeFlags) || [];
      return flags.indexOf('waitingOnApproval') >= 0 || flags.indexOf('waitingOnUserInput') >= 0;
    });

    head.innerHTML = '<span class="arw">▼</span>' +
      '<span class="nm">' + esc(name) + '</span>' +
      '<span class="cnt">' + g.items.length + '</span>' +
      (running ? '<span class="live">' + esc(t('进行中')) + '</span>'
        : waiting ? '<span class="chip appr">' + esc(t('等待你')) + '</span>' : '') +
      (k ? '<span class="pth" title="' + esc(k) + '">' + esc(k) + '</span>' : '');
    head.onclick = function () {
      var next = readFolded();
      if (next[k]) delete next[k]; else next[k] = 1;
      writeFolded(next);
      renderThreadListOnly();
    };
    box.appendChild(head);

    if (isFolded) return;
    var wrap = document.createElement('div');
    wrap.className = 'pgwrap';
    g.items.forEach(function (th) { wrap.appendChild(threadRow(th)); });
    box.appendChild(wrap);
  });
  if (window.DshI18n) window.DshI18n.apply(box);
}

// ── 项目折叠状态 ──────────────────────────────────────────────────────────────
//
// 存的是「哪些项目是合着的」（而不是哪些是开着的）：新项目默认展开 ——
// 刚开的会话总得看得见，不该被一个以前折过的同名项目连累。
function readFolded() {
  try {
    var raw = localStorage.getItem('codex-proj-folded-v1');
    var o = raw ? JSON.parse(raw) : {};
    return (o && typeof o === 'object') ? o : {};
  } catch (e) { return {}; }
}
function writeFolded(o) {
  try { localStorage.setItem('codex-proj-folded-v1', JSON.stringify(o || {})); } catch (e) { }
}


/**
 * 这个会话有没有「还没看过的新动静」？
 *
 * 判据只用服务端给的 updatedAt 和我们本地记的「上次打开时间」比 ——
 * 不猜内容、不数条数。所以它表达的是「这条比你看的时候新」，
 * 不是「有几条未读」：真实条数服务端并没有给，编一个数字出来就是伪造。
 */
function seenKey(tid) { return 'dsh-seen-' + tid; }
function markSeen(t) {
  if (!t || !t.id) return;
  try { localStorage.setItem(seenKey(t.id), String(Date.now())); } catch (e) { }
}
function isUnread(t) {
  var at = t && (t.updatedAt || t.recencyAt);
  if (!at || !t.id) return false;
  var seen = 0;
  try { seen = Number(localStorage.getItem(seenKey(t.id))) || 0; } catch (e) { return false; }
  var when = typeof at === 'number' ? at : Date.parse(at);
  return Number.isFinite(when) && when > seen;
}

function threadRow(t) {
  var b = document.createElement('button');
  b.className = 'item';
  var title = t.name || t.preview || tr('（没有标题）');
  var st = t.status && (t.status.type || t.status);
  var running = st === 'running' || st === 'active' || st === 'inProgress';
  var flags = (t.status && t.status.activeFlags) || [];
  var bits = [];
  if (running) bits.push('<span class="chip run">' + tr('进行中') + '</span>');
  // 待审批 / 等待你回复：**只看服务端给的 activeFlags**。
  // 没有这个字段就什么都不显示 —— 宁可少提示，也不凭空说「在等你」。
  if (flags.indexOf('waitingOnApproval') >= 0) bits.push('<span class="chip appr">' + tr('等待审批') + '</span>');
  else if (flags.indexOf('waitingOnUserInput') >= 0) bits.push('<span class="chip wait">' + tr('等待你回复') + '</span>');
  if (t.model) bits.push('<span class="chip">' + esc(t.model) + '</span>');
  if (t.reasoningEffort) bits.push('<span class="chip">' + esc(t.reasoningEffort) + '</span>');
  bits.push('<span>' + esc(relTime(t.updatedAt || t.recencyAt)) + '</span>');

  b.innerHTML = '<div class="t">' + (isUnread(t) ? '<span class="dot" aria-hidden="true"></span>' : '') +
    esc(title) + '</div>' +
    '<div class="m">' + bits.join('') + '</div>';
  b.onclick = function () { openThread(t); };
  return b;
}

function newThread(cwd) {
  setConn('wait', t('创建中'));
  var params = {};
  // 指定项目就在那个目录下开会话；不指定就让服务端用默认目录
  if (cwd) params.cwd = cwd;

  call('thread/start', params).then(function (r) {
    setConn('ok', '已连接');
    var th = (r && (r.thread || r)) || {};
    if (!th.id) throw new Error(t('服务端没返回会话 id'));
    // 新建的会话本来就是加载好的，不用再 resume
    openThread({
      id: th.id, name: t('新会话'), cwd: (r && r.cwd) || cwd,
      model: (r && r.model) || null, reasoningEffort: (r && r.reasoningEffort) || null
    });
    state.resumed = true;
  }).catch(function (e) {
    setConn('ok', '已连接');
    addError(t('开新会话失败：') + e.message);
  });
}

// ── 单个会话 ─────────────────────────────────────────────────────────────────
/**
 * 打开一个会话 —— 只取最新一屏，往上滑再继续取。
 *
 * 这一版有两个关键改动，都是被大会话逼出来的：
 *
 * 1. **不再一进来就 resume**。resume 会把整个 rollout 加载进内存 ——
 *    实测一条 3.3GB 的会话要 3 分钟以上还没完。而**读历史根本不需要它**：
 *    `thread/items/list` 在同一个会话上只花 0.0 秒。
 *    所以 resume 推迟到真要发消息时才做。
 *
 * 2. **只取最新一页**（`sortDirection:'desc'` 拿到的就是最新的），
 *    往上滑再用 `nextCursor` 取更早的。会话有 3GB 还是 3MB，打开都是一瞬间。
 */
var PAGE_SIZE = 30;

function openThread(t) {
  stopObserving();
  state.view = 'thread';
  state.thread = t;
  markSeen(t);       // 记下「这条我看过了」，列表里的未读点靠它消掉
  queueEntries=[];renderQueue();refreshQueue();
  state.items = {}; state.order = [];
  // 换会话时把「等回推的占位」也清掉：它们属于上一条会话，留着会认错人
  state.pendingLocal = [];
  state.running = false;
  state.turnId = null;
  state.resuming = false;
  task = {kind:'checking',detail:tr('正在读取最近一轮任务的状态。'),activity:'',syncedAt:0};
  state.resumed = false;
  state.olderCursor = null;
  state.loadingOlder = false;
  state.noMore = false;

  $('title').textContent = t.name || t.preview || tr('会话');
  $('back').style.display = '';
  $('footer').style.display = '';
  $('body').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  renderFooter();
  var epoch = observerEpoch;

  call('thread/items/list', {
    threadId: t.id, limit: PAGE_SIZE, sortDirection: 'desc'
  }).then(function (r) {
    if (epoch !== observerEpoch || state.view !== 'thread') return;
    $('body').innerHTML = '';
    var rows = (r && r.data) || [];
    state.olderCursor = (r && r.nextCursor) || null;
    state.noMore = !state.olderCursor;

    if (!rows.length) {
      $('body').innerHTML = '<div class="empty"><div class="big">👋</div>' + tr('这是一个新会话。<br>在下面输入框里说点什么。') + '</div>';
    }
    // 服务端给的是「从新到旧」，界面要从上到下越来越新，所以倒过来渲染
    rows.slice().reverse().forEach(function (row) { appendItem(row.item || row); });
    if (window.DshI18n) window.DshI18n.apply($('body'));

    if (state.olderCursor) prependOlderHint();
    renderFooter();
    tidyItems();
    scrollDown(true);
    startObserving();

  }).catch(function (e) {
    if (epoch !== observerEpoch || state.view !== 'thread') return;
    startObserving();
    // 刚建出来的会话还没有落盘的记录，服务端会回「not supported yet」之类的话。
    // 那不是错误 —— 它就是「还没有历史」，按空会话显示就好。
    // 把它当错误弹出来，使用者会以为开新会话失败了。
    if (/not supported|no rollout|not found|not loaded/i.test(e.message)) {
      $('body').innerHTML = '<div class="empty"><div class="big">👋</div>' + tr('这是一个新会话。<br>在下面输入框里说点什么。') + '</div>';
      renderFooter();
      return;
    }
    $('body').innerHTML = '';
    addError(tr('读不到会话内容：') + e.message);
  });
}

/**
 * 在后台把这个会话加载起来，好让「发送」不用等。
 *
 * 关键在 `excludeTurns: true` —— 它让服务端**只建立会话、不读历史**。
 *
 * 一开始我以为「发消息必须先 resume，而 resume 就是读整个存档」，
 * 于是大会话（实测 3.4GB 的）要等几分钟，界面上一直显示「正在加载对话」。
 * 检查 schema 后发现 ThreadResumeParams 里本来就有这个开关：
 *
 *   excludeTurns: "return only thread metadata and live-resume state
 *                  without populating `thread.turns`"
 *
 * 实测同一条 3.4GB 的会话：完整加载 200 秒都没完，
 * 带 excludeTurns 只要 **1.1 秒**，而且紧接着就能 turn/start。
 * 历史本来就走 thread/items/list 分页拉，根本不需要 resume 去读。
 */
function warmUpThread() { /* 不再预加载：翻看会话不该占电脑的写锁。 只在真正要发消息时才 resume。 */ }

/** 闲置一段时间后把写锁还回去 */
function scheduleRelease() {
  clearTimeout(state.releaseTimer);
  state.releaseTimer = setTimeout(function () {
    if (state.running || state.resuming) { scheduleRelease(); return; }
    releaseThread();
    renderFooter();
  }, 5 * 60 * 1000);
}

/** 把一个 item 渲染并接到末尾 */
function appendItem(it) {
  if (!it || !it.id || state.items[it.id]) return null;
  var rec = state.items[it.id] = { item: it, acc: it.text || '', created: false, snapshot:JSON.stringify(it) };
  state.order.push(it.id);
  rec.el = buildItem(it, rec);
  $('body').appendChild(rec.el);
  return rec.el;
}

/** 把一批（从新到旧）插到最前面，保持时间顺序 */
function prependItems(rows) {
  var frag = document.createDocumentFragment();
  rows.slice().reverse().forEach(function (row) {
    var it = row.item || row;
    if (!it || !it.id || state.items[it.id]) return;
    var rec = state.items[it.id] = { item: it, acc: it.text || '', created: false };
    // 插到最前面，但顺序要保持：倒着遍历时用 insertBefore 逐个往前放
    rec.el = buildItem(it, rec);
    frag.insertBefore(rec.el, frag.firstChild);
  });
  var body = $('body');
  body.insertBefore(frag, body.firstChild);
}

/** 顶部那个「正在加载更早的」提示 */
function prependOlderHint() {
  var old = document.getElementById('older-hint');
  if (old) old.remove();
  var d = document.createElement('div');
  d.id = 'older-hint';
  d.style.cssText = 'text-align:center;color:var(--dim);font-size:12.5px;' +
    'padding:14px 0 10px';
  d.textContent = state.noMore ? t('已经是最早的了') : t('往上滑加载更早的');
  $('body').insertBefore(d, $('body').firstChild);
}

/**
 * 往上翻一页。
 *
 * 要点是**保持视野不动**：内容插在前面会把整页往下顶。
 *
 * 一开始我用「内容长高了多少、就把滚动位置补多少」来算，实测补多了两倍
 * （增高 2513px 却补了 5433px）—— 因为插进来的内容随后还会被合并、被折叠，
 * 高度在一次更新里会变好几次，拿某一时刻的高度差去补必然对不上。
 *
 * 改成**锚定一个元素**：记下「此刻视野最上面那一条」相对视口的位置，
 * 更新完再把它对回同一个位置。这样中间高度怎么变都不影响。
 */
function loadOlder() {
  if (state.loadingOlder || state.noMore || !state.olderCursor || state.view !== 'thread') return;
  state.loadingOlder = true;

  var hint = document.getElementById('older-hint');
  if (hint) hint.textContent = t('正在加载更早的…');

  var main = $('main');
  var anchor = firstVisibleBlock();
  var anchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
  // 兜底用：万一锚点还是没了（比如被合并掉），至少按高度差补一下，
  // 总比完全不补、让页面猛地跳走要好
  var prevHeight = main.scrollHeight;
  var prevTop = main.scrollTop;

  call('thread/items/list', {
    threadId: state.thread.id, limit: PAGE_SIZE,
    sortDirection: 'desc', cursor: state.olderCursor
  }).then(function (r) {
    var rows = (r && r.data) || [];
    state.olderCursor = (r && r.nextCursor) || null;
    state.noMore = !state.olderCursor;

    if (rows.length) {
      prependItems(rows);
      tidyItems();
      prependOlderHint();

      var fixed = false;
      var stopAll = function () {
        // anchorTimers 现在是 requestAnimationFrame 的 id（一个数字），
        // 不再是定时器数组 —— 两种都兜住，免得改法变一次就抛一次
        var t = state.anchorTimers;
        if (Array.isArray(t)) t.forEach(clearTimeout);
        else if (t) (window.cancelAnimationFrame || clearTimeout)(t);
        state.anchorTimers = null;
        state.anchorStop = null;
      };
      var fix = function () {
        if (anchor && anchor.isConnected) {
          var diff = anchor.getBoundingClientRect().top - anchorTop;
          if (Math.abs(diff) > 1) main.scrollTop += diff;
          fixed = true;
          return true;
        }
        if (!fixed) {
          // 锚点没了：退回按高度差补（只补一次，别重复累加）
          main.scrollTop = prevTop + (main.scrollHeight - prevHeight);
          fixed = true;
          return true;
        }
        return false;
      };

      // 连着对位一段时间，用**每帧**的方式。
      //
      // 用 setTimeout 试过，不稳；原因是还有别人也在动滚动位置 ——
      // 浏览器自己的滚动锚定会在我们之后又调一次，差出两千多像素。
      // requestAnimationFrame 跑在每次布局之后，能稳定地把它抓回来。
      // fix() 是幂等的，对上了就什么都不做，所以每帧调用没有副作用。
      //
      // 「使用者一动就停」靠的是手势事件（见 initScrollWatch），
      // **不能靠比较位置** —— 那会把浏览器的调整误判成使用者在操作，
      // 于是第一帧之后就收手，等于没对（这个坑刚踩过）。
      fix();
      var deadline = Date.now() + 900;
      state.anchorStop = stopAll;
      var loop = function () {
        if (!state.anchorTimers) return;
        fix();
        if (Date.now() > deadline) { state.anchorTimers = null; return; }
        state.anchorTimers = requestAnimationFrame(loop);
      };
      state.anchorTimers = requestAnimationFrame(loop);
    } else {
      prependOlderHint();
    }
  }).catch(function (e) {
    if (hint) hint.textContent = t('加载更早的失败：') + e.message;
  }).then(function () {
    state.loadingOlder = false;
  });
}

/**
 * 此刻视野里最上面那一条 —— 用来当滚动锚点。
 *
 * 必须跳过「空的思考块」：整理的时候它们会被从 DOM 里删掉，
 * 拿一个即将被删的元素当锚点，对位逻辑会因为 isConnected 为假而直接跳过，
 * 结果就是页面猛地跳一下（实测跳了 2920px）。
 */
function firstVisibleBlock() {
  var main = $('main');
  var rect = main.getBoundingClientRect();
  var all = main.querySelectorAll('.bub,.tool,.think,.msg,.plan');
  for (var i = 0; i < all.length; i++) {
    var el = all[i];
    if (el.dataset && el.dataset.empty === '1') continue;
    // 自己会被删的，或者祖先会被删的，都跳过
    if (el.closest && el.closest('details.think[data-empty="1"]')) continue;
    if (el.getBoundingClientRect().bottom > rect.top + 4) return el;
  }
  return null;
}

/** 离开当前会话：把写锁还回去 */
function releaseThread() {
  var t = state.thread;
  if (!state.resumed || state.running || state.resuming) return;
  state.resumed = false;
  if (!t || !state.ready) return;
  // 不等结果 —— 使用者已经在往外走了，卡在这里只会让他觉得卡顿
  call('thread/unsubscribe', { threadId: t.id }).catch(function () { });
}

/**
 * 这个页面有没有握着写锁 —— 用来在标题栏给个提示。
 * 使用者在电脑上打不开同一个会话时，至少能从手机上看出是这边占着。
 */
function updateLockHint() {
  var el = document.getElementById('lockhint');
  if (!el) return;
  el.style.display = state.resumed ? 'flex' : 'none';
  // 点它 = 打开「会话写入锁」面板（也是一个入口，见 openLockPanel 的说明）
  if (!el.onclick) {
    el.onclick = function () { openLockPanel(); };
    el.onkeydown = function (ev) {
      if (ev && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); openLockPanel(); }
    };
  }
}

/**
 * 「这个会话在别处开着」。
 *
 * 这不是错误，是 Codex 的设计：一个会话同时只能有一个写入者。
 * 电脑上打开着某个会话时，它占着独占写锁，手机这边就进不去 —— 反过来也一样
 * （所以我们在离开时必须 unsubscribe）。光报一句错误没用，得给条出路。
 */
function showWriterConflict(t, why) {
  // 把手机看到的原文记下来（随释放请求报给服务端进日志）。
  // 没有它的时候，服务端只看到一个会话 id —— 排查全靠猜，而这次正是
  // 「猜出来的判据是坏的」把使用者坑了一轮。
  lastWriterError = String(why || '');
  var card = document.createElement('div');
  card.className = 'appr';
  card.id = 'writer-conflict';
  card.innerHTML =
    '<div class="h">' + tr('消息未发送：会话由另一个执行服务占用') + '</div>' +
    '<div class="w" style="margin-top:0">' + tr('这条会话正开在电脑上，手机发不出去。<br><br>你能做的：<br>· 点下面「释放电脑端的锁」→ 手机继续用这条会话（会关掉电脑上的 Codex，正在跑的任务可能被中断）<br>· 或者另开一条会话（不会接着当前任务的进度）<br><br>你输入的内容和附件都还在。') + '</div>' +
    '<div class="btns"></div>';

  var btns = card.querySelector('.btns');

  var b1 = document.createElement('button');
  b1.className = 'p';
  b1.textContent = tr('在同一个项目里开新的');
  b1.onclick = function () { card.remove(); newThread(t.cwd || null); };
  btns.appendChild(b1);

  var b2 = document.createElement('button');
  b2.textContent = tr('重试');
  b2.onclick = function () { card.remove(); toast(tr('正在重试…')); openThread(t); };
  btns.appendChild(b2);

  // ★ 「释放电脑端的锁」按钮。
  //
  //   原来这里**故意没有**这条路（文案原文是「本页面不会关闭电脑 Codex 或
  //   强行解锁」）：怕把使用者电脑上正在跑的任务弄坏。但那个顾虑的代价是
  //   「人在外面、手机彻底用不了」—— 而这是他要的功能之一，不该由我们替他决定。
  //   所以改成：**给按钮，但把代价写在确认框里**，而且服务端还要求 confirm:true
  //   才动手（手滑、别的网页替你 POST 都做不成）。
  //
  //   服务端做的事、以及为什么只能这么做（桌面版那个 app-server 没有端口，
  //   够不到它，只能让它的进程结束），写在 scripts/codex-lock.js 头部。
  var b3 = document.createElement('button');
  b3.className = 'd';
  b3.textContent = tr('释放电脑端的锁');
  b3.onclick = function () { releaseDesktopLock(t, card, b3); };
  btns.appendChild(b3);

  var old = document.getElementById('writer-conflict');
  if (old) old.remove();
  $('body').insertBefore(card, $('body').firstChild);
  scrollDown(true);
}

/**
 * 请电脑端把这条会话交出来（服务端动作见 scripts/codex-lock.js）。
 *
 * 两条规矩：
 *   1. **先确认再做**。确认框必须把代价写全 —— 尤其是「电脑上正在跑的任务
 *      可能会被终止」。这跟更换密钥、换地址那两个危险按钮是同一条规矩：
 *      后果说清楚了，使用者才有资格决定要不要按。
 *   2. 做完**自动重试**加载这条会话。使用者按这个按钮的目的就是「接着下指令」，
 *      让他再手动点一次「重试」是把我们的内部分工摊给他看。
 *
 * 服务端回的是 code（不是一句拼好的中文）：文案在这儿出三种语言，
 * 服务端那边的 message 只进日志/排查用。
 */
var LOCK_RESULT_TEXT = {
  'app-server': '现在能拿到这条会话了 —— 占着它的不是电脑那边（多半是手机自己之前占着）。已经还回去，正在重试…',
  'none': '这条会话的锁本来就是空的。正在重试…',
  'desktop-closed': '已经让电脑端交出这条会话（电脑上的 Codex 可能已被关闭）。正在重试…',
  'not-desktop': '会话被另一个 Codex 占着，但电脑上的 Codex 没开着 —— 不是它占的，我没有动任何东西。请稍等再试一次。',
  'still-locked': '电脑上的 Codex 已经关掉，但这条会话还是拿不到。请稍等再试，或在电脑上重开一次 Codex。',
  'stop-failed': '没能关掉电脑上的 Codex —— 锁没释放，什么都没变。',
  'unclear': '没问出锁在谁手里，所以**没有动电脑上的任何东西**。',
  'bad-thread': '会话编号不对，请回到列表重新打开这条会话。',
  'no-confirm': '释放没做成（没有确认）。'
};

/** 手机上次撞上「被占用」时看到的原文 —— 只随释放请求发给服务端进日志，用来诊断 */
var lastWriterError = '';

function releaseDesktopLock(t, card, btn) {
  var tid = t && t.id;
  if (!tid) { toast(tr('会话编号不对，请回到列表重新打开这条会话。')); return; }
  if (!confirm(tr('释放电脑端的锁？\n\n· 电脑上的 Codex 会关掉，正在跑的任务可能被中断\n· 会话内容不会丢\n· 之后手机就能接着下指令\n\n确定吗？'))) return;

  var label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '⏳'; }
  toast(tr('正在释放电脑端的锁…'));
  askReleaseLock(tid, function (text, ok) {
    if (btn) { btn.disabled = false; btn.textContent = label; }
    if (!ok) {
      // ★ 失败要**留在屏幕上**，不能只飘一条 toast。
      //   操作结果需要留在屏幕上，否则结果一闪而过、
      //   而界面看起来和按之前一模一样。
      showLockResult(text, t);
      return;
    }
    toast(text);
    if (card) card.remove();
    var old = document.getElementById('lock-result');
    if (old) old.remove();
    openThread(t);
  });
}

/**
 * 释放失败时留下的一张卡片：说清发生了什么、并且能再试一次。
 * 不自动消失 —— 使用者需要看到它才会知道「这一下到底做了没有」。
 */
function showLockResult(text, t) {
  var old = document.getElementById('lock-result');
  if (old) old.remove();
  var card = document.createElement('div');
  card.className = 'appr';
  card.id = 'lock-result';
  card.innerHTML = '<div class="h">' + tr('释放电脑端的锁：没成功') + '</div>' +
    '<div class="w" style="margin-top:0"></div><div class="btns"></div>';
  card.querySelector('.w').textContent = text;
  var btns = card.querySelector('.btns');

  var again = document.createElement('button');
  again.className = 'p';
  again.textContent = tr('再试一次');
  again.onclick = function () { card.remove(); releaseDesktopLock(t, null, null); };
  btns.appendChild(again);

  var ok = document.createElement('button');
  ok.textContent = tr('知道了');
  ok.onclick = function () { card.remove(); };
  btns.appendChild(ok);

  $('body').insertBefore(card, $('body').firstChild);
  scrollDown(true);
}

/**
 * 真的去发那一枪。
 *
 * 从 releaseDesktopLock() 里拆出来是因为**它现在有两个入口**：
 *   · 「被占用」那张卡片上的按钮（做完自动重试打开会话）
 *   · 设置面板里的「会话写入锁」（做完只留一句提示，人还在面板里）
 * 确认框、请求头、code→人话的映射只能有一份 —— 两份迟早会走样，
 * 而这条路的走样代价是「按了没反应」或者「代价没说清就动手」。
 */
/**
 * 释放**手机这边**的锁 —— 一个电脑程序都不碰。
 *
 * 和 askReleaseLock 的区别（使用者 2026-09-27 要的第二个按钮）：
 *   前者找的是**电脑端**占着的锁，最后一招是关掉电脑上的 Codex（有代价）
 *   这个只收手机自己的摊子：把我们 app-server 对这条会话的占用还回去，
 *   再把我们自己起的那个服务停掉（桌面版不在它范围内）
 *
 * 代价为零，所以服务端**不要求** confirm；界面上仍然问一句，是为了让人
 * 知道「接下来手机要重连一次」。
 */
function askReleasePhone(tid, done) {
  privateFetch('/codex/lock', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-dsh-lock': '1' },
    body: JSON.stringify({ action: 'phone', threadId: tid })
  }).then(function (r) {
    return r.json().then(function (j) { return j || {}; },
      function () { throw Error('HTTP ' + r.status); });
  }).then(function (j) {
    if (j.ok) { done(tr('手机端的锁已经松开（电脑上的 Codex 没被动过）。'), true, j); return; }
    done(tr('释放手机端的锁：没成功') + (j.error || j.message ? '：' + (j.error || j.message) : ''), false, j);
  }).catch(function (e) {
    done(tr('释放手机端的锁：没成功') + '：' + e.message, false);
  });
}

function askReleaseLock(tid, done) {
  privateFetch('/codex/lock', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-dsh-lock': '1' },
    body: JSON.stringify({
      threadId: tid, confirm: true,
      // 把「手机看到的原文」一并报上去（只进服务端日志）。下次「点不动」时，
      // 日志里就有第一手材料，不用再靠猜。
      seenError: lastWriterError || undefined
    })
  }).then(function (r) {
    // 409 也带 JSON（ok:false + code），所以两种状态都往下读
    return r.json().then(function (j) { return j || {}; },
      function () { throw Error('HTTP ' + r.status); });
  }).then(function (j) {
    if (j.ok) {
      var m = LOCK_RESULT_TEXT[j.method];
      done(tr(m || '这条会话的锁本来就是空的。正在重试…'), true);
      return;
    }
    var key = j.code && LOCK_RESULT_TEXT[j.code] ? j.code : null;
    done(key ? tr(LOCK_RESULT_TEXT[key]) : tr('释放失败：') + (j.error || j.message || '未知原因'), false);
  }).catch(function (e) {
    done(tr('释放失败：') + e.message, false);
  });
}

/**
 * 拉一次「账户 / 额度 / 模型 / 项目」。
 *
 * 这些电脑版都有，手机上也该有 —— 尤其额度：在外面跑了半天，
 * 想知道还剩多少，不该只能回电脑上看。
 */
function loadAccount() {
  call('account/read', {}).then(function (r) { state.account = r; }).catch(function () { });
  call('account/rateLimits/read', {}).then(function (r) { state.limits = r; }).catch(function () { });
  call('account/usage/read', {}).then(function (r) { state.usage = r; }).catch(function () { });
}

function loadModels() {
  return call('model/list', {}).then(function (r) {
    state.models = (r && r.data) || [];
  }).catch(function () { state.models = []; });
}

/** 从会话列表里攒出「最近用过的项目目录」—— 没有专门的项目接口，这是最实在的来源 */
function collectProjects(threads) {
  var seen = {};
  (threads || []).forEach(function (t) {
    if (!t.cwd) return;
    if (!seen[t.cwd]) seen[t.cwd] = { path: t.cwd, n: 0, at: 0 };
    seen[t.cwd].n++;
    seen[t.cwd].at = Math.max(seen[t.cwd].at, Number(t.updatedAt || t.recencyAt) || 0);
  });
  return Object.keys(seen).map(function (k) { return seen[k]; })
    .sort(function (a, b) { return b.at - a.at; });
}

/** 目录名，用来当项目显示名（全路径在手机上太长） */
function baseName(p) {
  var s = String(p || '').replace(/[\\/]+$/, '');
  var i = Math.max(s.lastIndexOf('\\'), s.lastIndexOf('/'));
  return i >= 0 ? s.slice(i + 1) : s;
}

// ── 输入区 ───────────────────────────────────────────────────────────────────
function renderFooter() {
  renderTaskStatus();
  renderAttachments();
  renderQueue();
  updateLockHint();   // 「占用中」的提示跟着写锁状态走
  var f = $('footer');
  if (state.view !== 'thread') { f.style.display = 'none'; return; }
  f.style.display = '';
  if (window.DshI18n) window.DshI18n.apply(f);
  var row = f.querySelector('.iconrow');
  var old = row.querySelector('.stop');
  var busy = row.querySelector('.loading');
  var uncertain = !state.ready || ['checking','unknown','offline'].indexOf(task.kind) >= 0;
  var saveOnly=queueOnly();
  $('send-mode').style.display=(state.running||saveOnly)?'':'none';
  // ★ 不再因为「状态没确认」就禁用「立即补充」，也不再把它改回「排队发送」。
  //   原来那样做的后果（使用者实测）：任务进行中，他只能排队，而且界面上
  //   看不出为什么；更早的一版还会把他选过的「立即补充」永久覆盖掉。
  //   现在他选什么就是什么，真发的时候会先确认一次当前任务再决定 ——
  //   确认到了就真插队，确认不到就按排队保存并**明确告诉他**。
  var immOpt = $('send-mode').querySelector('option[value="immediate"]');
  if (immOpt) {
    immOpt.disabled = false;
    immOpt.title = uncertain ? t('状态未确认：发送时会先确认一次当前任务') : '';
  }
  $('send-mode').value = sendModePref();
  // 「排队」是按**他选的那个**算的。状态没确认时不再强制显示排队 ——
  // 那种情况下按下去会先确认一次（见 send 与 steerTurn）。
  var queuing=($('send-mode').value==='queue');
  $('send').disabled = !!state.sending || draftAttachments().some(function(a){return a.status!=='ready';});
  $('send').textContent=queuing?t('排队'):'↑';
  $('send').style.fontSize=queuing?'13px':'';
  $('send').title = queuing ? t('保存到电脑队列，不打断任务') : uncertain ? t('状态未确认：发送时会先确认一次当前任务') : state.running ? t('发送补充意见') : t('发送');
  $('send').setAttribute('aria-label',queuing ? t('加入队列') : state.running ? t('发送补充意见') : t('发送'));
  $('input').placeholder = saveOnly ? t('先保存要求，等待接通执行端…') : queuing ? t('输入下一项要求，完成后依次执行…') : state.running ? t('补充要求，不会停止当前任务…') : t('说点什么…');

  // 正在加载会话时，把发送键换成一个明确的「加载中」——
  // 大会话要等几分钟，只弹一句转瞬即逝的提示，使用者会以为按了没反应，
  // 然后反复点。输入框里的字不会丢（send 里只有真正发出去时才清空）。
  if (state.resuming && !busy) {
    if (old) old.remove();
    var ld = document.createElement('span');
    ld.className = 'loading';
    ld.textContent = t('加载中…');
    ld.style.cssText = 'font-size:13px;color:var(--dim);padding:0 10px;' +
      'align-self:center;flex:none';
    row.insertBefore(ld, $('send'));
    $('send').style.display = 'none';
    return;
  }
  if (!state.resuming && busy) {
    busy.remove();
    $('send').style.display = '';
  }
  if (state.resuming) return;

  if (state.running && !old) {
    var s = document.createElement('button');
    s.className = 'stop';
    s.textContent = t('停止');
    s.onclick = stopTurn;
    row.insertBefore(s, $('send'));
    $('send').style.display = '';
  } else if (!state.running && old) {
    old.remove();
    $('send').style.display = '';
  }
  if (old) old.disabled = !state.ready;
}

/**
 * 发消息。第一次发之前才 resume —— 因为 resume 会把整个会话加载进来，
 * 大会话（实测有 3.3GB 的）要几分钟。读历史不需要它，所以不该一进来就付这个代价。
 */
function send() {
  var box = $('input');
  var text = box.value.trim();
  if (!state.thread) return;
  var attachments=draftAttachments().slice();
  if(!text && !attachments.length)return;
  if(attachments.some(function(a){return a.status!=='ready';})){toast(t('请等待附件上传完成，或移除上传失败的附件'));return;}
  if (state.sending) { toast(t('消息正在发送')); return; }
  // 他要「立即补充」，但此刻状态没确认：不要一句「先确认」把他挡回去 ——
  // 先替他确认一次，能插队就插队，不能就排队保存并说清楚。
  if (queueOnly() && $('send-mode').value === 'immediate') {
    sendWhenUncertain(text, box, attachments);
    return;
  }
  if (queueOnly()) { enqueueDraft(text,box,attachments); return; }
  if (!state.ready || ['checking','unknown','offline'].indexOf(task.kind) >= 0) { toast(t('先确认任务状态，再发送消息')); refreshObservedThread(); return; }
  if (state.running) { if($('send-mode').value==='queue')enqueueDraft(text,box,attachments);else steerTurn(text,box,attachments); return; }

  if (state.resuming) { toast(t('会话还在加载，稍等一下')); return; }

  if (!state.resumed) {
    var sendingThread = state.thread;
    state.resuming = true;
    var t0 = Date.now();
    renderFooter();

    // 显示秒数在走 —— 大会话要几分钟，只弹一句转瞬即逝的提示，
    // 使用者会以为按了没反应，然后反复点。
    var note = document.createElement('div');
    note.id = 'resume-note';
    note.className = 'tool';
    note.innerHTML = '<div style="padding:9px 13px;font-size:12.5px;color:var(--dim)">' +
      t('正在加载这个会话… <span id="resume-sec">0</span> 秒') +
      '<div style="font-size:11.5px;color:var(--dim2);margin-top:4px">' +
      t('会话越大越久（有的要几分钟）。加载完会自动把你要发的内容发出去，不用重打。') +
      '</div></div>';
    $('apprs').appendChild(note);

    var tick = setInterval(function () {
      var el = document.getElementById('resume-sec');
      if (el) el.textContent = String(Math.round((Date.now() - t0) / 1000));
    }, 1000);

    call('thread/resume', { threadId: sendingThread.id, excludeTurns: true }, 600000).then(function (r) {
      clearInterval(tick);
      note.remove();
      if (state.thread !== sendingThread || state.view !== 'thread') {
        call('thread/unsubscribe',{threadId:sendingThread.id}).catch(function(){});
        return;
      }
      state.resumed = true;
      state.resuming = false;
      updateLockHint();
      note.remove();
      var th = (r && (r.thread || r)) || {};
      if (th.name) { state.thread.name = th.name; $('title').textContent = th.name; }
      if (r && r.model) state.thread.model = r.model;
      if (r && r.reasoningEffort) state.thread.reasoningEffort = r.reasoningEffort;
      if (r && r.cwd) state.thread.cwd = r.cwd;
      if (statusKind(th.status) === 'active') {
        setTask('checking',t('会话仍在执行，正在确认可补充的当前轮次；输入已保留。'));
        refreshObservedThread();
        toast(t('已连接运行中的会话，请确认状态后选择排队或立即补充'));
        return;
      }
      toast(t('加载好了（{n} 秒），正在发送…', {n: Math.round((Date.now() - t0) / 1000)}));
      // 加载完就把使用者刚才输入的内容发出去，不用他再打一遍
      box.value = text;
      renderFooter();
      send();
    }).catch(function (e) {
      clearInterval(tick);
      note.remove();
      if(state.thread !== sendingThread || state.view !== 'thread')return;
      state.resuming = false;
      note.remove();
      renderFooter();
      if (/active writer/i.test(e.message)) showWriterConflict(state.thread, e.message);
      else if (/超时|timed out|timeout/i.test(e.message)) {
        addError(t('这个会话太大，加载超时了。历史还能正常翻看，但发消息暂时不行 —— 换一条小一点的会话，或者在电脑上把它处理完。'));
      } else {
        addError(t('这个会话没能加载起来：') + e.message);
      }
    });
    return;
  }

  var submittedThread=state.thread;
  state.sending = true;
  activityVersion++;
  state.running = true;
  setTask('running',t('消息正在发送，等待任务回执。'));
  renderFooter();

  var params = {
    threadId: state.thread.id,
    input: attachmentInput(text,attachments)
  };
  if (state.pick.model) params.model = state.pick.model;
  if (state.pick.effort) params.effort = state.pick.effort;

  // 回执里也带着这一轮的 id —— 不能只依赖 turn/started 通知，
  // 那条一旦没收到，后面的「停止」就会因为缺 turnId 而失败。
  call('turn/start', params).then(function (r) {
    state.sending = false;
    attachmentSent(submittedThread.id,attachments);
    if(state.thread!==submittedThread)return;
    addLocalUser(attachmentLabel(text,attachments));
    if(box.value.trim()===text){box.value='';box.style.height='auto';}
    var id = r && (r.turnId || (r.turn && r.turn.id));
    if (id) state.turnId = id;
    renderFooter();
  }).catch(function (e) {
    state.sending = false;
    if(state.thread!==submittedThread)return;
    state.running = false;
    setTask('unknown',t('发送未确认，正在重新同步任务状态。'));
    renderFooter();
    if (/not found|not loaded/i.test(e.message)) {
      state.resumed = false;
      addError(t('这个会话在服务端被卸载了。再发一次会自动重新加载。'));
    } else {
      addError(t('发送失败：') + e.message);
    }
  });
}

/**
 * 问一次「现在有没有正在跑的那一轮」，拿到它的编号（插队必须带这个）。
 * 拿不到就返回 null —— 调用方据此退回排队，绝不假装插队成功。
 */
function confirmRunningTurn(){
  var tid=state.thread&&state.thread.id;
  if(!tid)return Promise.resolve(null);
  return call('thread/turns/list',{threadId:tid,limit:1,sortDirection:'desc',itemsView:'notLoaded'},8000)
    .then(function(r){
      var t0=r&&r.data&&r.data[0];
      return t0&&t0.status==='inProgress'?t0.id:null;
    },function(){return null;});
}

/**
 * 状态还没确认、但使用者选了「立即补充」时走这里：
 * 先确认一次；确认到正在跑的那一轮就真插队，确认不到就按排队保存并如实说明。
 */
function sendWhenUncertain(text,box,attachments){
  var sendingThread=state.thread;
  if(!sendingThread)return;
  state.sending=true;renderFooter();
  toast(t('正在确认当前任务…'));
  refreshObservedThread();
  confirmRunningTurn().then(function(turnId){
    if(state.thread!==sendingThread||state.view!=='thread'){
      state.sending=false;renderFooter();return;
    }
    if(turnId){state.turnId=turnId;steerTurn(text,box,attachments);return;}
    enqueueDraft(text,box,attachments,{deferred:true,
      savedNotice:t('没能确认当前任务，已按排队保存')});
  });
}

function steerTurn(text,box,attachments) {
  attachments=attachments || [];
  if(!state.turnId){
    // Reuse the thread-bound confirmation path for a running turn whose ID
    // has not yet arrived from the observer.
    sendWhenUncertain(text,box,attachments);
    return;
  }
  var tid=state.thread.id, turnId=state.turnId;
  state.sending=true;
  renderFooter();
  call('turn/steer',{threadId:tid,expectedTurnId:turnId,input:attachmentInput(text,attachments)},15000).then(function(){
    attachmentSent(tid,attachments);
    if(state.thread && state.thread.id===tid){
      addLocalUser(attachmentLabel(text,attachments));
      if(box.value===text){box.value='';box.style.height='auto';}
      toast(t('补充意见已发送，任务继续执行'));
    }
  }).catch(function(e){
    if(state.thread && state.thread.id===tid){
      addError(t('补充意见未确认送达，输入已保留。') + (/not found|not loaded|active writer/i.test(e.message)
        ? t('当前任务由电脑端独立服务执行，手机暂时无法向它发送；请在电脑端补充。') : e.message));
    }
  }).finally(function(){state.sending=false;renderFooter();refreshObservedThread();});
}

/** 本地先把用户这条画出来，不等服务端回推 —— 手感差别很大 */
function addLocalUser(text) {
  var id = 'local-' + Date.now() + '-' + Math.random().toString(16).slice(2, 6);
  var rec = state.items[id] = { item: { id: id, type: 'userMessage' }, acc: text, created: true };
  state.order.push(id);
  rec.el = buildUser({ content: [{ type: 'text', text: text }] });
  $('body').appendChild(rec.el);
  // 记进「等回推」的名单：服务端那条一到，就把它对上（见 upsertItem），
  // 否则同一句话会被画两遍。
  rememberPendingLocal(id, text);
  scrollDown(true);
}

// ── 本地占位 ↔ 服务端回推 的配对 ──────────────────────────────────────────────
//
// 只在这两条路上产生占位：send()（立即发送）和 steerTurn()（立即补充）。
// 服务端回推的顺序和我们发的顺序一致，所以**先到先配**（FIFO）。
var PENDING_LOCAL_MAX = 5;      // 最多记几条，免得越攒越多
var PENDING_LOCAL_TTL = 120000; // 两分钟还没等到回推就不再等（那条多半不会来了）

function normalizeSaid(s) {
  return String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
}

/** 服务端那条 userMessage 说的是什么（正文部分） */
function userTextOf(item) {
  var c = (item && item.content) || [];
  if (Array.isArray(c)) {
    return c.filter(function (x) { return x && x.type === 'text'; })
      .map(function (x) { return x.text || ''; }).join('\n');
  }
  return String((item && item.text) || '');
}

function rememberPendingLocal(id, raw) {
  state.pendingLocal = state.pendingLocal || [];
  state.pendingLocal.push({ id: id, raw: normalizeSaid(raw), at: Date.now() });
  while (state.pendingLocal.length > PENDING_LOCAL_MAX) state.pendingLocal.shift();
}

/**
 * 取一条「等着被回推对上」的占位。
 *
 * 先找**一字不差**的；找不到再退一步认「前缀相同」—— 因为带附件时本地那条是
 * `正文 + 附件：a、b`，而服务端回推的正文只有 `正文`。前缀比对只在
 * 「刚发出去、还没等到回推」的这几条里做，而且先到先配，所以不会张冠李戴到
 * 会话里别的消息上。
 */
function takePendingLocal(serverText) {
  var list = state.pendingLocal || [];
  var want = normalizeSaid(serverText);
  var now = Date.now();
  list = list.filter(function (p) { return now - p.at < PENDING_LOCAL_TTL; });
  state.pendingLocal = list;
  if (!want) return null;
  var i;
  for (i = 0; i < list.length; i++) if (list[i].raw === want) break;
  if (i >= list.length) {
    for (i = 0; i < list.length; i++) {
      var a = list[i].raw;
      if (a && want && (a.indexOf(want) === 0 || want.indexOf(a) === 0)) break;
    }
  }
  if (i >= list.length) return null;
  var hit = list.splice(i, 1)[0];
  // 占位那条的 DOM/记录由调用方负责改名，这里只把它从名单里摘掉
  return hit;
}

/**
 * 停止当前这一轮。
 *
 * `turn/interrupt` 的 turnId 是**必填**的。原来只有收到 turn/started 通知时
 * 才记下它，一旦那条通知没到（连接抖动、或者页面刚打开时那一轮已经在跑），
 * state.turnId 就是空的 —— 于是发出去一个缺字段的请求，报
 * 「Invalid request: missing field `turnId`」，而且停不下来。
 *
 * 兜底办法：真不知道 turnId 时，先 resume 一次把它问出来（resume 的回执里带着
 * 当前这一轮），再停。比直接发个坏请求强。
 */
function stopTurn() {
  if (!state.thread) return;

  var doStop = function (turnId) {
    call('turn/interrupt', { threadId: state.thread.id, turnId: turnId })
      .then(function () {
        task.detail=t('已请求停止，等待服务确认。');
        renderTaskStatus();
        refreshObservedThread();
        toast(t('已请求停止'));
      })
      .catch(function (e) { addError(t('停止失败：') + e.message); });
  };

  if (state.turnId) { doStop(state.turnId); return; }

  toast(t('正在确认当前这一轮…'));
  call('thread/turns/list', { threadId: state.thread.id, limit:1,sortDirection:'desc',itemsView:'notLoaded' }, 8000).then(function (r) {
    var current=r && r.data && r.data[0];
    var id = current && /inProgress|in_progress/.test(current.status) && current.id;
    if (id) { state.turnId = id; doStop(id); return; }
    // 连服务端都说不出这一轮是什么，那多半它已经跑完了 —— 把界面状态收回来
    refreshObservedThread();
    toast(t('没有确认到执行中的任务，正在刷新状态'));
  }).catch(function (e) {
    addError(t('停止失败：拿不到当前这一轮（{err}）', {err:e.message}));
  });
}

// 电脑版有的东西这里也要有：账户、额度、模型、思考强度、项目目录。

function fmtDuration(mins) {
  if (!mins) return '';
  if (mins < 60) return mins + t(' 分钟');
  if (mins < 1440) return Math.round(mins / 60) + t(' 小时');
  return Math.round(mins / 1440) + t(' 天');
}

function fmtReset(ts) {
  if (!ts) return '';
  var t = Number(ts);
  if (t < 1e12) t *= 1000;
  var d = Math.round((t - Date.now()) / 60000);
  if (d <= 0) return tr('即将重置');
  if (d < 60) return d + tr(' 分钟后重置');
  if (d < 1440) return Math.round(d / 60) + tr(' 小时后重置');
  return Math.round(d / 1440) + tr(' 天后重置');
}

function fmtTokens(n) {
  var v = Number(n) || 0;
  if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return String(v);
}

/** 账户卡：邮箱、套餐、额度条 */
function accountCard() {
  var a = state.account && state.account.account;
  var rl = state.limits && state.limits.rateLimits;
  var d = document.createElement('div');
  d.className = 'acct';

  if (!a && !rl) {
    d.innerHTML = '<div class="row"><span class="k">' + t('账户') + '</span>' +
      '<span class="v" style="color:var(--dim)">' + t('读不到') + '</span></div>';
    return d;
  }

  var html = '';
  if (a) {
    html += '<div class="row"><span class="k">' + t('账户') + '</span><span class="v">' +
      esc(a.email || a.type || '') + '</span></div>';
    if (a.planType) {
      html += '<div class="row"><span class="k">' + t('套餐') + '</span><span class="v">' +
        esc(a.planType) + '</span></div>';
    }
  }

  if (rl && rl.primary) {
    var p = Math.max(0, Math.min(100, Number(rl.primary.usedPercent) || 0));
    html += '<div class="usage">' +
      '<div class="ubar"><i style="width:' + p + '%"></i></div>' +
      '<div class="utxt"><span>' + t('本周期已用 {p}%', {p:p}) + '</span>' +
      '<span>' + esc(fmtReset(rl.primary.resetsAt)) + '</span></div>' +
      '</div>';
  } else {
    // 走到这里不代表「没有额度」，而是这个账号拿不到周期额度数据 ——
    // 余额制账号（比如 DeepSeek）就没有 primary，只有 credits。
    //
    // 以前这里什么都不渲染，结果是：账户区有邮箱有套餐，额度区一片空白。
    // 使用者分不清是「用完了」「这个套餐本来就没有」还是「查询失败了」。
    // 现在一律说清楚 —— 空白是最糟的状态，它让人没法判断。
    html += '<div class="row"><span class="k">' + t('额度') + '</span>' +
      '<span class="v" style="color:var(--dim)">' +
      (rl ? t('本套餐无周期额度') : t('读不到')) + '</span></div>';
  }
  if (rl && rl.credits && rl.credits.hasCredits) {
    html += '<div class="row"><span class="k">' + t('余额') + '</span><span class="v">' +
      esc(rl.credits.balance || '') + '</span></div>';
  }

  var u = state.usage && state.usage.summary;
  if (u) {
    html += '<div class="row"><span class="k">' + t('累计用量') + '</span><span class="v">' +
      esc(fmtTokens(u.lifetimeTokens)) + ' tokens</span></div>';
  }

  d.innerHTML = html;
  return d;
}

function sheetRow(label, value, onPick, hint) {
  var b = document.createElement('button');
  b.className = 'srow';
  b.innerHTML = '<span class="k">' + esc(label) + '</span>' +
    '<span class="v">' + esc(value) + '</span><span class="arw">›</span>';
  if (hint) b.title = hint;
  // 同理包一层：onPick 如果收参数，直接赋值会把点击事件传进去
  b.onclick = function () { onPick(); };
  return b;
}

/** 二级选择页：一个列表，点一项就回去 */
function pickList(title, items, currentLabel, onPick) {
  var inner = $('sheetInner');
  inner.innerHTML = '';

  var head = document.createElement('button');
  head.className = 'shead';
  head.textContent = '‹ ' + title;

  inner.appendChild(head);

    var e = document.createElement('div');
    e.className = 'info';
    e.textContent = t('没有可选项。');
    inner.appendChild(e);
    return;
  }

  items.forEach(function (it) {
    var b = document.createElement('button');
    b.className = 'sopt' + (it.label === currentLabel ? ' on' : '');
    b.innerHTML = '<span class="t">' + esc(it.label) + '</span>' +
      (it.sub ? '<span class="s">' + esc(it.sub) + '</span>' : '') +
      (it.label === currentLabel ? '<span class="ck">✓</span>' : '');
    b.onclick = function () { onPick(it); };

  });
}

function openSheet() {
  var inner = $('sheetInner');

  inner.appendChild(accountCard());

    sec.textContent = tr('这个会话');

    // 项目（工作目录）

      var items = state.projects.map(function (p) {

      });

      var head = document.createElement('div');
      pickList(tr('选择项目（会新开一个会话）'), items, baseName(t.cwd || ''), function (it) {
        closeSheet();

      });
      var note = document.createElement('div');
      note.className = 'info';

      $('sheetInner').insertBefore(note, $('sheetInner').children[1] || null);
      if (!items.length) head = head;
    }, t.cwd || ''));

    // 模型
    inner.appendChild(sheetRow(tr('模型'),
      modelLabel(state.pick.model || t.model || tr('（会话默认）')), function () {
        var items = [{ label: tr('（用会话自己的）'), model: null }].concat(
          state.models.map(function (m) {
            return {
              label: m.displayName || m.id, sub: m.id, model: m.id,
              efforts: m.supportedReasoningEfforts || m.reasoningEfforts || []
            };
          }));
        pickList(tr('选择模型'), items, modelLabel(state.pick.model || t.model), function (it) {
          state.pick.model = it.model;
          if (it.model) {
            // 换模型时把思考强度清掉 —— 不同模型支持的档位不一样，
            // 留着一个对方不认的值会直接报错
            state.pick.effort = null;
            state.currentEfforts = it.efforts || [];
          } else {
            state.currentEfforts = [];
          }
          openSheet();
        });
      }));

    // 思考强度
    var modelId = state.pick.model || t.model;
    var mdl = state.models.filter(function (m) { return m.id === modelId; })[0];
    var efforts = state.currentEfforts ||
      (mdl && (mdl.supportedReasoningEfforts || mdl.reasoningEfforts)) || [];
    inner.appendChild(sheetRow(tr('思考强度'),
      state.pick.effort || t.reasoningEffort || tr('（默认）'), function () {
        var items = [{ label: tr('（用会话自己的）'), effort: null }].concat(
          efforts.map(function (e) {
            return {
              label: e.reasoningEffort || e.effort || String(e),
              sub: e.description || '', effort: e.reasoningEffort || e.effort
            };
          }));
        pickList(tr('选择思考强度'), items, state.pick.effort || t.reasoningEffort, function (it) {
          state.pick.effort = it.effort;
          openSheet();
        });
      }));

    var sec2 = document.createElement('div');
    sec2.className = 'stitle';
    sec2.textContent = tr('操作');
    inner.appendChild(sec2);

    inner.appendChild(sheetRow(tr('重命名这个会话'), '', function () {
      closeSheet();
      var name = prompt(tr('新名字'), state.thread.name || '');
      if (name === null) return;
      call('thread/name/set', { threadId: state.thread.id, name: name })
        .then(function () {
          state.thread.name = name; $('title').textContent = name; toast(tr('已改名'));
        })
        .catch(function (e) { toast(tr('改名失败：') + e.message); });
    }));

    inner.appendChild(sheetRow(tr('归档这个会话'), '', function () {
      closeSheet();
      if (!confirm(tr('归档之后它会从列表里消失（不会删除）。'))) return;
      call('thread/archive', { threadId: state.thread.id })
        .then(function () { toast(tr('已归档')); loadThreads(); })
        .catch(function (e) { toast(tr('归档失败：') + e.message); });
    }));

    inner.appendChild(sheetRow(tr('回到会话列表'), '', function () { closeSheet(); loadThreads(); }));
  } else {    var info = document.createElement('div');
    info.className = 'info';
    info.textContent = state.account && state.account.account
      ? tr('在手机上用 Codex。会话和电脑上是同一份 —— 手机上发的话，电脑那边也看得到。')
      : tr('还没读到账户信息。检查一下 Codex 是否已登录。');
    inner.appendChild(info);
  }

  // ── 会话写入锁（**两个视图里都有**）────────────────────────────────────────
  //
  // 写入锁入口需要固定位置，方便查找。
  // 原来它只长在被占用那张错误卡片上 —— 那不叫入口，那叫碰运气。
  // 这里给它一个固定的位置：设置面板里，点进去就是那个面板。
  var secLock = document.createElement('div');
  secLock.className = 'stitle';
  secLock.textContent = tr('会话写入锁');
  inner.appendChild(secLock);

  inner.appendChild(sheetRow(tr('释放电脑端的锁'),
    // 值里给**会话名**，别只写「（这条会话）」—— 让人一眼看出这一下会动到哪一条
    state.thread ? (state.thread.name || state.thread.preview || tr('（没有标题）')) : tr('先打开一条会话'),
    function () { openLockPanel(); }));

    : tr('同一个会话同时只能有一个地方写。发消息时报「会话由另一个执行服务占用」时，用这里释放。');
  inner.appendChild(lockHintRow);

  var sec3 = document.createElement('div');
  sec3.className = 'stitle';
  sec3.textContent = tr('其他');
  inner.appendChild(sec3);

  // 语言：自动按设备语言选（i18n.js 读 navigator.languages），但手动选过就以手动为准。
  // makeSwitcher() 自己会写 localStorage['dsh-lang']，change 时也会调 applyAll()。

  langRow.className = 'srow';

  inner.appendChild(langRow);

  inner.appendChild(sheetRow(tr('换一个目标（DSH / Codex）'), '', function () {

    closeSheet();

  }));

  var close = document.createElement('button');
  close.className = 'sclose';
  close.textContent = tr('关闭');
  close.onclick = closeSheet;
  inner.appendChild(close);

  $('sheet').classList.add('on');
  if (window.DshI18n) window.DshI18n.apply($('sheetInner'));
}

function modelLabel(id) {

    };
    inner.appendChild(btn);

    var cost = document.createElement('div');
    cost.className = 'info';
    cost.textContent = tr('会关掉电脑上的 Codex，正在跑的任务可能被中断；会话内容不会丢。');
    inner.appendChild(cost);
  } else {
    var none = document.createElement('div');
    none.className = 'info';
    none.textContent = tr('先打开一条会话，再回到这里 —— 锁是**按会话**算的，得先知道是哪一条。');
    inner.appendChild(none);
  }

  var close = document.createElement('button');
  close.className = 'sclose';
  close.textContent = tr('关闭');
  close.onclick = closeSheet;
  inner.appendChild(close);

  $('sheet').classList.add('on');
  if (window.DshI18n) window.DshI18n.apply($('sheetInner'));
}

/**
 * 语音识别用哪个语言：跟着界面语言走。
 *
 * 原来两个调用点都写死 'zh-CN' —— 界面切成英文/西语了，语音还是按中文识别，
 * 说英文出来一堆同音错字（使用者问「语音模式是只有中文吗」就是这么来的）。
 * voice.js 本来就支持 o.lang，只是没人传。
 */
function voiceLang() {
  var cur = 'zh';
  try { if (window.DshI18n && window.DshI18n.lang) cur = window.DshI18n.lang() || 'zh'; } catch (e) { }
  if (cur === 'en') return 'en-US';
  if (cur === 'es') return 'es-ES';
  return 'zh-CN';
}

function toast(msg) {
  var t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:78px;transform:translateX(-50%);' +
      'background:#25252d;border:1px solid #35353f;color:#eee;padding:9px 18px;' +
      'border-radius:11px;font-size:13.5px;z-index:30;opacity:0;transition:opacity .18s;' +
      'pointer-events:none;max-width:84vw;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.style.opacity = '0'; }, 2400);
}

// ── 绑定 ─────────────────────────────────────────────────────────────────────
$('back').onclick = function () { loadThreads(); };
$('task-refresh').onclick = function () { refreshObservedThread(); };
document.addEventListener('visibilitychange',function() {
  if (document.hidden) { clearTimeout(observerTimer); return; }
  if (state.view === 'thread') { renderFooter(); startObserving(); }
});
window.addEventListener('pageshow',function(e) { if(e.persisted && state.view === 'thread') startObserving(); });

// 页面被关掉/切走时也要还锁。手机浏览器经常直接把页面丢掉，
// 不还的话那条会话就一直被我们占着，电脑上打不开。
window.addEventListener('pagehide', releaseThread);
window.addEventListener('beforeunload', releaseThread);
$('menu').onclick = openSheet;
$('sheet').onclick = function (e) { if (e.target === $('sheet')) closeSheet(); };
$('send').onclick = send;
$('send-mode').onchange=function(){setSendModePref(this.value);renderFooter();};
$('send-mode').value=sendModePref();

/**
 * 软键盘占掉的高度 → --kb。
 *
 * iOS Safari 弹键盘时**不改布局视口**，只改 visualViewport，所以
 * height:100dvh 一点用都没有，底部的输入框会被键盘盖住（这是老问题）。
 * 这里把「被吃掉的高度」量出来写成 CSS 变量，让容器跟着缩。
 *
 * 三条保守做法，都是怕算错：
 *   · 只取正数（算出来是负的就当 0）
 *   · 只缩不放 —— 算错时宁可留一条缝，也不能把整个界面顶出屏幕
 *   · 没有 visualViewport 就整个跳过（老浏览器上行为完全不变）
 *
 * ⚠️ 这一段**没有在真机上验过**（手上没有 iPhone，无头浏览器也不会弹键盘）。
 *    桌面浏览器不会触发它：visualViewport 高度始终等于窗口高度，--kb 恒为 0。
 *    真机验证在计划里单列（「Android/iOS 的真实前后台与锁屏测试需要真机参与」）。
 */
(function () {
  var vv = window.visualViewport;
  if (!vv) return;
  function apply() {
    try {
      var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', Math.round(kb) + 'px');
    } catch (e) { /* 量不出来就保持原样，不能因此把界面弄坏 */ }
  }
  vv.addEventListener('resize', apply);
  vv.addEventListener('scroll', apply);
  apply();
})();
// 输入区那两个小图标是有实际作用的，不是摆设：
// ＋ 开新会话（和列表页那个按钮同一件事，只是不用先退出去）
// ⇣ 跳回最新（翻历史翻远了的时候，比在右下角找浮标顺手）
$('btn-attach').onclick = openAttachmentPicker;
['pick-images','pick-files'].forEach(function(id){$(id).onchange=function(){chooseAttachments(this.files);this.value='';};});
$('btn-bottom').onclick = function () { stick = true; toBottom(true); updateJump(); };

/**
 * 回到前台时核对一次「这条会话还归我们吗」。
 *
 * 为什么要它：服务端在手机断开 60 秒后会自动把占用还回电脑（那是使用者要的
 * 「手机端关闭后电脑端能接手」），所以手机切回来时本地那份「我占着它」可能已经过期。
 * 不核对的话，发消息会撞上「会话未加载」，使用者看到的是要刷新 —— 而他要的是
 * **切应用不需要刷新、换 DSH 再切回来也流畅**。
 */
function ensureOwnershipAfterResume() {
  if (state.view !== 'thread' || !state.thread || !state.ready) return;
  var tid = state.thread.id;
  call('thread/loaded/list', {}, 6000).then(function (r) {
    var ids = (r && (r.data || r.threadIds)) || [];
    if (!Array.isArray(ids) || ids.indexOf(tid) >= 0) return;   // 还占着 / 问不出来 → 什么都不做
    state.resumed = false;
    renderFooter();
    call('thread/resume', { threadId: tid, excludeTurns: true }, 60000).then(function () {
      if (state.thread && state.thread.id === tid) { state.resumed = true; renderFooter(); }
    }, function () { /* 拿不回来也不是这里的事：发消息那条路会再试一次并如实报错 */ });
  }).catch(function () { });
}

try {
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') ensureOwnershipAfterResume();
  });
} catch (e) { }

// Do not release the phone lock by sending a pagehide request. Encryption of
// a request body is asynchronous, while the browser may terminate pagehide
// work at any time. The Codex connection monitor releases all phone-owned
// sessions after the final connection has stayed closed for 60 seconds; it
// also avoids sending a plaintext thread ID through a relay.

// 🔓 释放电脑端的锁 —— 就在语音旁边，一眼能看见。
//
// 为什么值得占一个常驻位置：Codex 的同一个会话同时只能有一个地方写，
// 电脑上的 Codex 开着它的时候，手机这边**发不出消息**。这时候人正站在外面，
// 唯一的出路就是这个按钮 —— 把它藏在一条错误提示里（原来的做法）等于没有。
//
// 点下去直接走释放流程：确认框先把代价说清（必要时会关掉电脑上的 Codex），
// 然后动手，做完把结果和「重试」一起摆出来。**不做成「再点一次才动」**——
// 那正是使用者说的「按了没反应」。
$('btn-lock').onclick = function () {
  if (!state.thread) { toast(t('先打开一条会话')); return; }
  releaseDesktopLock(state.thread, null, $('btn-lock'));
};

// 🎤 语音输入。
//
// 用浏览器原生的识别接口（DshVoice），不引依赖。关键是**不可用时要说实话**：
// iPhone 的 Safari 不开放这个接口，做个点了没反应的按钮比没有更糟 ——
// 而手机键盘自带的听写其实就能干这件事，而且更稳。
(function () {
  var btn = $('btn-voice');
  var box = $('input');
  var rec = null;
  var base = '';

  if (!window.DshVoice || !window.DshVoice.available()) {
    // 不可用时**不是**给一句一闪而过的 toast，而是打开一个能读、能照着做的面板。
    //
    // 原来的做法是 toast(whyNot()) —— 使用者的真实反馈是
    // 「有标识，但点了不知道怎么用」：toast 两秒就没了，
    // 而「iPhone 上要用键盘的麦克风」这件事需要好几个步骤才说得清。
    btn.title = window.DshVoice ? window.DshVoice.whyNot() : t('这个浏览器不支持语音输入');
    btn.style.opacity = '.45';
    btn.onclick = function () {
      if (window.DshVoice && window.DshVoice.explain) window.DshVoice.explain();
      else toast(t('这个浏览器不支持语音输入 —— 请用键盘上的麦克风。'));
    };
    return;
  }

  btn.title = t('语音输入');

  btn.onclick = function () {
    if (rec) { rec.stop(); return; }      // 再点一次 = 结束

    base = box.value ? box.value + ' ' : '';
    btn.textContent = '⏺';
    btn.style.color = '#ff6b6b';
    toast(t('在听了，说完会自动停下'));

    rec = window.DshVoice.start({
      lang: voiceLang(),
      // 边说边填进输入框 —— 使用者能看出它在听，而不是对着屏幕干等
      onPartial: function (text) {
        window.DshVoice.setInputValue(box, base + text);
      },
      onFinal: function (text) {
        window.DshVoice.setInputValue(box, (base + text).trim());
      },
      onError: function (msg) { toast(msg); },
      onEnd: function () {
        rec = null;
        btn.textContent = '🎤';
        btn.style.color = '';
      }
    });
  };
})();

var input = $('input');
input.addEventListener('input', function () {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});
input.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey && !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    e.preventDefault();
    send();
  }
});

// 语言切换时：静态的 data-i18n 由 apply() 刷新，JS 渲染出来的那几块自己重画一遍。
window.onLangChange = function () {
  applyI18n();
  renderFooter();
  if (state.view === 'list') renderThreads();
  else rebuildItems();
  // 设置面板本身也是按当时语言画出来的，重画一遍。延后一拍 —— 别在
  // <select> 的 change 事件里把它自己删掉。
  if ($('sheet').classList.contains('on')) setTimeout(openSheet, 0);
};

initScrollWatch();
connect();
</script>
</body>
</html>
