<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket Bridge">
<!-- PWA 声明。以前没有这几行：manifest 和图标在服务器上都有，却没人引用，
     于是 iOS 只能自己去探测 /apple-touch-icon-120x120.png，404，主屏图标是空的。 -->
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Codex</title>
<style>
  /* ── 设计基调 ───────────────────────────────────────────────────────────────
     这套值不是拍脑袋定的，是从 DSH 手机版页面上**量出来的**（见 scripts/measure-dsh-ui.js）：
     底色 #151517、卡片 #1b1b1c、分隔线 #2c2c2e、正文 16px、强调色 #679efe。
     两个界面放在一起看要是同一个产品，而不是两个拼凑的工具。 */
  :root{
    color-scheme:dark;
    --bg:#151517;          /* DSH 的 body 底色 */
    --card:#1b1b1c;        /* 次级块 */
    --card2:#232325;
    --line:#2c2c2e;        /* 分隔线 */
    --line2:#353638;
    --fg:#f9fafb;          /* 主文字 */
    --dim:#81858c;         /* 次要文字 */
    --dim2:#adb2b8;
    --accent:#679efe;      /* DSH 用的那个浅蓝 */
    --accent2:#3b5bfe;     /* 实心按钮的蓝 */
    --ok:#3ddc84; --warn:#e0b341; --bad:#e06c6c;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --rail:44px;           /* 左侧图标栏宽度，和 DSH 那种窄栏一致 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px;line-height:1.62;
    display:flex;flex-direction:column;
    /* 100dvh 管的是浏览器地址栏收放，**管不到软键盘** —— iOS 上键盘弹出时
       只改 visualViewport，不改布局视口，于是输入框会被盖住。
       所以再减去 --kb（由下面的 visualViewport 监听写进来，桌面上恒为 0）。 */
    height:calc(100dvh - var(--kb,0px));overflow:hidden;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  /* 键盘焦点必须看得见。
     手机页是触摸优先，但接了键盘（iPad 妙控键盘、安卓蓝牙键盘）就得能看清
     焦点在哪 —— 看不见焦点就等于不能用键盘操作。控制台那边一直有这条，
     手机页漏了；`-webkit-tap-highlight-color:transparent` 又把点击高亮关了，
     所以这里必须显式补上。 */
  button:focus-visible,summary:focus-visible,a:focus-visible,
  input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

  /* ── 顶栏 ───────────────────────────────────────────────────────────────── */
  header{
    flex:none;display:flex;align-items:center;gap:8px;
    padding:calc(var(--safe-t) + 9px) 12px 9px;
    background:rgba(11,11,12,.93);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);position:relative;z-index:6;
  }
  header h1{font-size:16.5px;margin:0;font-weight:640;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:var(--card);flex:none;font-size:16px;line-height:1}
  .ico:active{background:var(--card2)}
  .lock-help{flex:none;padding:9px 14px;text-align:left;font-size:12.5px;color:var(--accent);background:var(--card);border-bottom:1px solid var(--line)}
  .lock-advanced{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
  .lock-advanced summary{cursor:pointer;color:var(--warn);font-size:13px;padding:10px 2px}
  .conn{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);flex:none}
  .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .conn.ok .dot{background:var(--ok)} .conn.bad .dot{background:var(--bad)}
  .conn.wait .dot{background:var(--warn);animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.3}}
  #task-status{flex:none;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card);
    /* C19：状态区**占高封顶**。使用者截图里它吃了屏幕四分之一 —— 那是长文本
       （"正在同步历史记录，不代表电脑任务已停止…"那种整段话）把它撑开的。
       封顶之后无论里面写了什么，对话区都不会被挤没了。 */
    max-height:18vh;overflow:hidden}
  #task-status.expanded{max-height:min(60vh,440px);overflow-y:auto}
  #task-status[hidden]{display:none}
  #task-status .task-top{display:flex;align-items:center;gap:8px;font-size:14px}
  #task-status .task-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
  #task-status[data-kind="running"] .task-dot,#task-status[data-kind="thinking"] .task-dot{background:var(--accent);animation:pulse 1.3s infinite}
  #task-status[data-kind="completed"] .task-dot{background:var(--ok)}
  #task-status[data-kind="waitingApproval"] .task-dot,#task-status[data-kind="waitingInput"] .task-dot{background:var(--warn)}
  #task-status[data-kind="failed"] .task-dot,#task-status[data-kind="offline"] .task-dot{background:var(--bad)}
  #task-detail{font-size:13px;color:var(--dim2);margin-top:3px;overflow-wrap:anywhere;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
    max-height:1.5em}
  #task-status.expanded #task-detail{display:block;max-height:none;overflow:visible}
  /* C19：状态区**不允许**被长文本撑开。它只负责"一眼看出在不在跑"，
     正文归对话流。展开看全文由「详情」按钮负责。 */
  #task-more{font-size:12px;color:var(--accent);background:none;border:0;padding:2px 0;cursor:pointer}
  #task-more[hidden]{display:none}
  #task-activity{font-size:13px;color:var(--dim2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
  #task-activity[hidden]{display:none}
  #task-status.expanded #task-activity{display:block;overflow:visible}
  #task-status.expanded #task-activity[hidden]{display:none}
  #task-refresh{margin-left:auto;font-size:12px;color:var(--accent);padding:14px 10px;flex:none}
  button:disabled{opacity:.45;cursor:default}
  #attachments{display:flex;gap:7px;overflow-x:auto;max-height:112px;padding:4px 0 8px}
  #attachments:empty{display:none}
  .attachment{display:flex;align-items:center;gap:7px;min-width:170px;max-width:250px;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
  .attachment img{width:42px;height:42px;object-fit:cover;border-radius:6px}
  .attachment .info{min-width:0;flex:1;font-size:12px;overflow-wrap:anywhere}
  .attachment .status{color:var(--dim);font-size:11px}
  .attachment button{font-size:12px;flex:none;padding:5px}
  #send-mode{min-height:44px;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:8px;max-width:112px;font:inherit;font-size:12px;padding:5px}
  #queued-messages{max-height:130px;overflow:auto;font-size:12px;margin-bottom:5px}
  #queued-messages:empty{display:none}
  #queue-connect{display:block;margin:6px 0;padding:7px 10px;border:1px solid var(--line2);
    border-radius:8px;background:var(--card);color:var(--accent);font-size:12px;text-align:left}
  .queued-row{display:flex;align-items:center;gap:8px;padding:6px;border-bottom:1px solid var(--line)}
  .queued-row span{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
  .queued-row button{color:var(--dim2);font-size:12px;flex:none}

  main{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    /* 关掉浏览器自带的「滚动锚定」。
       它会在我往上插入旧内容时自动调整 scrollTop —— 而我自己也在调整，
       两边各补一次就翻倍：实测我补了 2513px，它又补了 2920px，
       结果页面猛地跳走。自己要控制滚动位置时，这个自动行为必须关掉。 */
    overflow-anchor:none;
  }
  main *{overflow-anchor:none}
  .pad{padding:13px}

  /* ── 会话列表 ───────────────────────────────────────────────────────────── */
  .search{
    display:flex;align-items:center;gap:8px;background:var(--card);border-radius:11px;
    padding:9px 12px;margin-bottom:11px;border:1px solid var(--line);
  }
  .search input{flex:1;background:none;border:0;outline:none;color:var(--fg);
    font:inherit;font-size:14.5px;min-width:0}
  .search input::placeholder{color:var(--dim2)}
  .sec{font-size:11.5px;color:var(--dim2);margin:16px 2px 7px;font-weight:600;
    letter-spacing:.05em;text-transform:uppercase}
  .sec:first-child{margin-top:2px}

  /* ── 会话列表：按**项目**分组，可以折叠，行为与 DSH 一致 ──
     折叠状态记在 localStorage 里：翻过一次的项目下次还是合着的，
     否则每次进列表都要重新折一遍，等于没做。 */
  .pghead{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:none;border:0;color:var(--fg);padding:14px 2px 8px;font:inherit}
  .pghead .arw{color:var(--dim2);font-size:11px;transition:transform .15s;flex:none}
  .pghead.closed .arw{transform:rotate(-90deg)}
  .pghead .nm{font-size:13.5px;font-weight:650;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .pghead .cnt{font-size:11px;color:var(--dim2);background:#242429;border-radius:6px;
    padding:1px 7px;flex:none}
  .pghead .live{font-size:11px;color:#8ce0a8;background:#1e3c29;border-radius:6px;
    padding:1px 7px;flex:none}
  .pghead .pth{font-size:10.5px;color:var(--dim2);margin-left:auto;flex:none;
    max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    direction:rtl;text-align:left}
  .pgwrap{margin:0 0 6px}
  .pgfold{font-size:12px;color:var(--dim2);background:none;border:0;font:inherit;
    padding:2px 2px 0;cursor:pointer}

  .item{
    display:block;width:100%;text-align:left;background:var(--card);
    border-radius:13px;padding:13px 14px;margin-bottom:8px;border:1px solid transparent;
  }
  .item:active{background:var(--card2)}
  .item .t{font-size:14.5px;font-weight:540;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .m{display:flex;gap:7px;align-items:center;margin-top:7px;
    font-size:11.5px;color:var(--dim2);flex-wrap:wrap}
  .chip{background:#242429;border-radius:6px;padding:1px 7px;font-size:11px}
  .chip.run{background:#1e3c29;color:#8ce0a8}
  .chip.appr{background:#3a2f16;color:#e8c07a}
  .chip.wait{background:#20303a;color:#8fc6e0}
  /* 未读点：靠 updatedAt 和本地「上次打开」比出来，不猜内容 */
  .item .t .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--accent);margin-right:7px;vertical-align:middle}

  /* ── 消息 ───────────────────────────────────────────────────────────────── */
  .msg{margin-bottom:14px}
  .msg .who{font-size:11.5px;color:var(--dim2);margin-bottom:4px}
  .bub{border-radius:14px;padding:10px 13px;white-space:pre-wrap;word-break:break-word;
    overflow-wrap:anywhere}
  .msg.user .bub{background:var(--accent2);color:#fff;border-bottom-right-radius:5px}
  .msg.user{margin-left:10%}
  .msg.agent .bub{background:var(--card);border-bottom-left-radius:5px}
  .msg.err .bub{background:#2a1c1c;color:#f0a0a0;font-size:13.5px}

  /* markdown */
  .bub h1,.bub h2,.bub h3{font-size:15.5px;margin:12px 0 5px;font-weight:650}
  .bub h1:first-child,.bub h2:first-child,.bub h3:first-child{margin-top:0}
  .bub p{margin:0 0 8px} .bub p:last-child{margin-bottom:0}
  .bub ul,.bub ol{margin:5px 0 8px;padding-left:21px}
  .bub li{margin-bottom:3px}
  .bub code{background:#00000055;padding:1px 5px;border-radius:5px;font-size:13px;
    font-family:ui-monospace,Menlo,monospace}
  .bub pre{background:#0e0e11;border:1px solid var(--line);border-radius:9px;
    padding:10px;overflow-x:auto;font-size:12.5px;margin:8px 0;line-height:1.55}
  .bub pre code{background:none;padding:0}
/* 交付文件：正文里那种 :codex-file-citation{...} 标记渲染成这个（点一下就下载） */
.bub .filecite{display:flex;align-items:center;gap:8px;width:100%;margin:6px 0;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#0e0e11;
  color:var(--text);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.bub .filecite:hover{border-color:var(--accent)}
.bub .filecite .fc-go{margin-left:auto;color:var(--accent);font-size:12.5px;white-space:nowrap}
  .bub a{color:#8ab4ff}
  .bub blockquote{border-left:3px solid var(--line2);margin:8px 0;padding-left:11px;
    color:var(--dim)}
  .bub hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .bub table{border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}
  .bub th,.bub td{border:1px solid var(--line2);padding:5px 9px;text-align:left}
  .cursor:after{content:'▍';color:var(--accent);animation:pulse 1s infinite}
  /* 内容被截断时给个说明，别让人以为东西丢了 */
  /* 图片产出：直接显示出来 */
  .imgbox{margin-bottom:11px}
  .imgbox a{display:block;text-decoration:none}
  .imgbox img{width:auto;max-width:100%;max-height:260px;border-radius:12px;border:1px solid var(--line);
    background:#0e0e11;display:block;min-width:40px;min-height:40px;object-fit:contain}
  .imgcap{font-size:11.5px;color:var(--dim);margin-top:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* 文件卡片：点开看内容 */
  .filecard{display:flex;align-items:center;gap:9px;padding:10px 8px;border-radius:10px;
    text-decoration:none;color:inherit}
  .filecard:active{background:var(--card2)}
  .filecard .fi{flex:none;font-size:16px}
  .filecard .fn{flex:1;min-width:0;font-size:13px;font-family:ui-monospace,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c9d4}
  .filecard .fnote{flex:none;font-size:11.5px;color:var(--dim2);min-width:18px;text-align:center}
  .filecard .fgo{flex:none;font-size:12px;color:var(--accent)}
  .toolhd{display:flex;align-items:center;gap:9px;padding:10px 13px;font-size:13px}

  .clipped{margin-top:8px;font-size:11.5px;color:var(--dim);
    border-top:1px dashed var(--line2);padding-top:6px}

  /* 思考过程 */
  .think{border-left:2px solid var(--line2);padding:2px 0 2px 11px;margin-bottom:12px}
  .think summary{font-size:12.5px;color:var(--dim);cursor:pointer;list-style:none;
    user-select:none;display:flex;align-items:center;gap:6px}
  .think summary::-webkit-details-marker{display:none}
  .think summary:before{content:'▸';transition:transform .15s;display:inline-block;
    color:var(--dim2)}
  .think[open] summary:before{content:'▾'}
  .think .body{font-size:13px;color:var(--dim);white-space:pre-wrap;
    word-break:break-word;margin-top:7px;line-height:1.65}

  /* 工具 / 命令 / 文件改动 */
  .tool{background:#131317;border:1px solid var(--line);border-radius:12px;
    margin-bottom:11px;overflow:hidden}
  .tool summary{list-style:none;cursor:pointer;padding:10px 13px;
    display:flex;align-items:center;gap:9px;user-select:none}
  .tool summary::-webkit-details-marker{display:none}
  .tool .kind{font-size:11px;color:var(--dim2);flex:none;min-width:34px}
  .tool .head{flex:1;min-width:0;font-size:13px;font-family:ui-monospace,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c9c9d4}
  .tool .badge{font-size:11px;flex:none;padding:1px 7px;border-radius:6px;
    background:#242429;color:var(--dim)}
  .tool .badge.ok{background:#16301f;color:#7fd8a0}
  .tool .badge.bad{background:#301a1a;color:#e0a0a0}
  .tool .out{margin:0;padding:0 13px 12px;font-family:ui-monospace,Menlo,monospace;
    font-size:12px;color:#b0b0bb;white-space:pre-wrap;word-break:break-all;
    max-height:340px;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
  .tool .out:empty{display:none}
  /* Historical tool calls are frequent. Keep the full detail behind the row. */
  .tool.trace{margin-bottom:3px;background:transparent;border-color:var(--line);border-radius:8px}
  .tool.trace summary{padding:5px 9px;min-height:32px;gap:6px}
  .tool.trace .kind{min-width:28px}
  .tool.trace .head{font-size:12px}
  .files{list-style:none;margin:0;padding:0 13px 11px;border-top:1px solid var(--line);
    padding-top:9px}
  .files li{font-size:12.5px;font-family:ui-monospace,Menlo,monospace;color:#c9c9d4;
    padding:3px 0;display:flex;gap:8px}
  .files li .st{flex:none;color:var(--dim2);min-width:20px}
  .files li .st.add{color:#7fd8a0} .files li .st.del{color:#e0a0a0}

  /* 计划 */
  .plan{background:#131317;border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;margin-bottom:11px}
  .plan .h{font-size:11.5px;color:var(--dim2);margin-bottom:7px}
  .plan .s{display:flex;gap:8px;font-size:13.5px;padding:3px 0;line-height:1.5}
  .plan .s .m{flex:none;color:var(--dim2)}
  .plan .s.done{color:var(--dim2);text-decoration:line-through}
  .plan .s.doing{color:#9dc4ff}

  /* 审批 */
  .appr{border:1px solid #6b5a1f;background:#231d0d;border-radius:13px;
    padding:13px 15px;margin-bottom:12px}
  .appr .h{font-size:12px;color:#e8d49a;margin-bottom:7px;font-weight:600}
  .appr .c{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#f0e6c0;
    background:#00000044;border-radius:8px;padding:9px 11px;white-space:pre-wrap;
    word-break:break-all;max-height:180px;overflow:auto}
  .appr .w{font-size:11.5px;color:#b9a878;margin-top:6px}
  .appr .btns{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
  .appr .btns button{font-size:13px;padding:8px 14px;border-radius:9px;
    background:#332c14;border:1px solid #5a4a1f;color:#f0e6c0}
  .appr .btns button.p{background:#2f7d4f;border-color:#2f7d4f;color:#fff;font-weight:600}
  .appr .btns button.d{color:#f0b0a8}
  .appr .btns button:disabled{opacity:.5}

  /* ── 输入区：照着 DSH 的样子做 ───────────────────────────────────────────────
     DSH 的输入区不是「一行输入框 + 一个按钮」，而是一个圆角大框，
     里面上面写内容、下面一排小图标，发送键是右侧一个实心圆。
     照这个结构做，两个界面切换时才不会有割裂感。 */
  footer{
    flex:none;padding:8px 12px calc(8px + var(--safe-b));
    background:var(--bg);
  }
  .composer{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:10px 12px 8px;
  }
  .composer:focus-within{border-color:var(--line2)}
  textarea{
    width:100%;background:none;border:0;color:var(--fg);font:inherit;
    padding:2px 2px 6px;resize:none;max-height:150px;min-height:26px;
    line-height:1.5;outline:none;
  }
  textarea::placeholder{color:var(--dim)}
  .iconrow{display:flex;align-items:center;gap:14px}
  .iconrow .sp{flex:1}
  .ibtn{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
    color:var(--dim);font-size:16px;flex:none;
  }
  .ibtn:active{background:var(--card2);color:var(--fg)}
  /* ── 触控热区 ────────────────────────────────────────────────────────────
     视觉上是 32/34px 的小按钮，但 iOS 人机指南要求可点区域至少 44×44 ——
     手机上点不准是很实际的体验问题，尤其是右下角这些拇指够得着的常用键。

     做法是用一个透明的伪元素把**可点范围**撑开 6px，视觉大小和排版都不变。
     比直接把按钮做大更好：既满足触控，又不会把输入区挤得没地方。 */
  .ibtn, .send, .ico{position:relative}
  .ibtn::after, .send::after, .ico::after{
    content:'';position:absolute;inset:-5px;border-radius:inherit}
  .send{
    width:34px;height:34px;padding:0;border-radius:50%;background:var(--accent2);flex:none;
    display:grid;place-items:center;color:#fff;font-size:17px;
  }
  /* A two-character queue label cannot fit in the 34px icon circle once the
     button's default padding is counted. Give text its own single-line pill. */
  .send.queue{width:64px;height:36px;padding:0 8px;border-radius:18px;
    white-space:nowrap;line-height:1}
  .send:disabled{background:var(--card2);color:var(--dim)}
  .stop{background:var(--bad);color:#fff;font-size:13.5px;padding:0 15px;
    height:34px;border-radius:17px;flex:none;font-weight:600}

  /* ── 状态 ───────────────────────────────────────────────────────────────── */
  .empty{text-align:center;color:var(--dim);padding:52px 22px;font-size:14px;line-height:2}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.45}
  .btn{display:block;width:100%;background:var(--card);border-radius:12px;
    padding:13px;text-align:center;font-weight:600;margin:0 0 9px}
  .btn.p{background:var(--accent2);color:#fff}
/* 危险按钮：会关掉电脑上的程序的那种。
   原来代码里一直写着 class="btn d"，但这个类没有样式 ——
   于是「释放电脑端的锁」在手机上跟普通按钮长得一样，使用者误按了它。 */
.btn.d{background:#3a1d1d;border:1px solid #a33;color:#ffd7d2;font-weight:600}
.btn.d:active{background:#4a2222}
/* 危险按钮上方的警告条：红底 + 加粗标题 */
.warn-red{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid #a33;
  background:#2a1515;color:#ffd7d2;font-size:12.5px;line-height:1.7}
.warn-red b{color:#ff9d92}
  .btn:active{opacity:.8}
  .skel{background:linear-gradient(90deg,#17171a,#202027,#17171a);background-size:200% 100%;
    animation:sh 1.3s infinite;border-radius:13px;height:70px;margin-bottom:8px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* 弹出面板 */
  .sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;
    align-items:flex-end;justify-content:center}
  .sheet.on{display:flex}
  .sheet .inner{background:var(--card);width:100%;max-width:520px;
    border-radius:18px 18px 0 0;padding:8px 12px calc(14px + var(--safe-b));
    max-height:88dvh;overflow-y:auto}

  /* 账户卡 */
  .acct{background:var(--bg);border:1px solid var(--line);border-radius:14px;
    padding:11px 14px;margin:8px 0 4px}
  .acct .row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;
    font-size:14px}
  .acct .k{color:var(--dim)}
  .acct .v{color:var(--fg);text-align:right;word-break:break-all}
  .usage{margin-top:9px}
  .ubar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
  .ubar i{display:block;height:100%;background:var(--accent);border-radius:3px;
    transition:width .3s}
  .utxt{display:flex;justify-content:space-between;font-size:11.5px;
    color:var(--dim);margin-top:5px}

  .stitle{font-size:11.5px;color:var(--dim);padding:14px 4px 5px;
    letter-spacing:.05em;text-transform:uppercase}

  .srow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 10px;border-radius:11px;font-size:15.5px}
  .srow:active{background:var(--card2)}
  .srow .k{flex:1;min-width:0}
  .srow .v{color:var(--dim);font-size:13.5px;max-width:52%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .srow .arw{color:var(--dim);flex:none}

  .shead{display:block;width:100%;text-align:left;padding:14px 10px;
    font-size:15.5px;font-weight:600;color:var(--accent)}
  .sopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:13px 10px;border-radius:11px}
  .sopt:active{background:var(--card2)}
  .sopt .t{font-size:15.5px;flex:none}
  .sopt .s{color:var(--dim);font-size:12px;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace}
  .sopt.on .t{color:var(--accent)}
  .sopt .ck{color:var(--accent);font-weight:700;flex:none}
  .sclose{display:block;width:100%;text-align:center;padding:14px;
    color:var(--dim);font-size:15px;margin-top:6px}
  .sheet .info{padding:4px 10px 12px;font-size:12.5px;color:var(--dim);line-height:1.7}
  @media(max-width:420px){
    /* Four tools, a mode picker and Stop cannot fit on a narrow phone in one row. */
    .iconrow{gap:6px;flex-wrap:wrap}
    .iconrow .ibtn{width:30px}
    .iconrow .sp{min-width:0}
    .iconrow #send-mode{order:-1;width:100%;max-width:none}
    .iconrow .stop{padding:0 10px}
  }
</style>

/* Codex 手机界面
 *
 * 目标：和电脑上差不多 —— 能看见它在想什么、跑什么命令、改了哪些文件、要你批准什么。
 *
 * 协议全部来自真实服务（不是照 schema 猜的）：
 *   initialize        {clientInfo}
 *   thread/list       {limit,searchTerm} → {data:[…]}, 每条带 section / status / model
 *   thread/items/list {threadId,limit}   → {data:[{turnId,item}]}
 *   turn/start        {threadId,input:[{type:'text',text}]}
 *   turn/interrupt    {threadId}
 *   thread/name/set   {threadId,name}    thread/archive {threadId}
 *   model/list        {}                 → {data:[{id,displayName}]}
 *
 * 推送：
 *   item/started | item/completed       带完整 item → 按 itemId 建索引更新
 *   item/agentMessage/delta             {itemId,delta}
 *   item/reasoning/summaryTextDelta     {itemId,summaryIndex,delta}
 *   item/commandExecution/outputDelta   {itemId,delta}
 *   turn/plan/updated                   {plan:[…]}
 *
 * 服务端还会**反过来请求**客户端，最重要的是审批：
 *   item/commandExecution/requestApproval → 应答 {decision:'accept'|'acceptForSession'|'decline'|'cancel'}
 *   item/fileChange/requestApproval       → 同上
 *   execCommandApproval / applyPatchApproval（老接口）→ {decision:'approved'|'approved_for_session'|{denied:{rejection}}|'abort'}
 * 不应答的话，需要授权的操作会一直卡着 —— 电脑版上就是个弹窗，手机上不能没有。

var t = (window.DshI18n && window.DshI18n.t) ? window.DshI18n.t : function (s) { return s; };

// 里的时间戳），那些作用域里改用 tr()。和 console.html 用的是同一套办法。
var tr = t;

if (window.DshI18n) window.DshI18n.register({

  "尝试连接并发送已存内容（不关闭电脑 Codex）": {en:"Try connecting to send saved messages (keeps desktop Codex open)",es:"Intentar conectar para enviar los mensajes guardados (sin cerrar Codex)"},
  "发送已存内容": {en:"Send saved messages",es:"Enviar mensajes guardados"},
  "正在确认发送已存内容…": {en:"Enabling saved messages…",es:"Habilitando mensajes guardados…"},
  "已确认发送已存内容；请查看会话中的执行结果。": {en:"Saved messages are enabled for sending. Check this conversation for execution results.",es:"Los mensajes guardados están habilitados para enviarse. Revisa los resultados en esta conversación."},
  "未能确认发送已存内容；请先检查会话和待办状态：": {en:"Could not confirm saved-message delivery. Check the conversation and queue before retrying: ",es:"No se pudo confirmar la entrega de los mensajes guardados. Revisa la conversación y la cola antes de reintentar: "},
  "连接或会话已改变，未确认发送已存内容。": {en:"The connection or conversation changed. Sending saved messages was not confirmed.",es:"La conexión o conversación cambió. No se confirmó el envío de los mensajes guardados."},
  "已连接，正在确认任务状态；只有桥持有此会话且当前任务正常结束才会发送。": {en:"Connected. Saved messages can send only while Bridge owns this conversation and the current task ends normally.",es:"Conectado. Los mensajes guardados solo pueden enviarse si Bridge controla la conversación y la tarea actual termina normalmente."},
  "已保存在电脑，尚未送达。电脑端完成任务不等于自动发送；需由桥连接此会话。": {en:"Saved on your computer, not delivered. Finishing the desktop task does not send it; Bridge must connect to this conversation.",es:"Guardado en el ordenador, no entregado. Terminar la tarea no lo envía; Bridge debe conectarse a esta conversación."},
  "正在创建独立会话…": {en:"Creating a separate conversation…",es:"Creando una conversación independiente…"},
  "服务端没返回新的会话 id": {en:"The service did not return a new conversation ID",es:"El servicio no devolvió un ID de conversación nuevo"},
  "独立会话已创建，请在会话列表中打开。": {en:"Separate conversation created. Open it from the conversation list.",es:"Conversación independiente creada. Ábrela desde la lista."},
  "独立会话": {en:"Separate conversation",es:"Conversación independiente"},
  "已创建独立会话。电脑上的原会话继续运行；请检查输入后再发送。": {en:"Separate conversation created. The desktop conversation keeps running; review your draft before sending.",es:"Conversación independiente creada. La del ordenador sigue activa; revisa el borrador antes de enviarlo."},
  "原会话已保存的待办仍留在原会话，尚未执行。": {en:"Saved messages remain in the original conversation and have not run.",es:"Los mensajes guardados permanecen en la conversación original y no se han ejecutado."},
  "创建期间新增的文字或附件仍留在原会话。": {en:"Text or attachments added while creating the copy remain in the original conversation.",es:"El texto o los archivos añadidos mientras se creaba la copia permanecen en la conversación original."},
  "创建独立会话失败；原会话和输入未改变：": {en:"Could not create a separate conversation. The original conversation and draft are unchanged: ",es:"No se pudo crear una conversación independiente. La original y el borrador no han cambiado: "},
  "这条会话目前只能查看，刚才的消息没有发送。可以复制已保存的上下文，在手机开独立会话继续；电脑上的原会话照常运行。正在执行的步骤不会完整复制，两边改同一项目文件也可能冲突。输入和附件仍在。": {en:"This conversation is view-only here; your message was not sent. You can copy saved context into a separate phone conversation while the desktop conversation keeps running. An in-progress step may be incomplete in the copy, and simultaneous edits to the same project files can conflict. Your draft and attachments remain.",es:"Esta conversación es de solo lectura aquí; tu mensaje no se envió. Puedes copiar el contexto guardado a otra conversación en el teléfono mientras la del ordenador sigue activa. Un paso en curso puede quedar incompleto y los cambios simultáneos en los mismos archivos pueden entrar en conflicto. El borrador y los adjuntos se conservan."},
  "复制上下文，在手机独立续聊": {en:"Copy context and continue separately on phone",es:"Copiar contexto y seguir por separado en el teléfono"},
  "同项目新会话（不复制对话）": {en:"New conversation in same project (no history copied)",es:"Nueva conversación en el mismo proyecto (sin copiar historial)"},
  "继续查看": {en:"Keep viewing",es:"Seguir leyendo"},
  "接管原会话…（会关闭整个电脑 Codex）": {en:"Take over original… (closes all desktop Codex)",es:"Tomar control de la original… (cierra Codex de escritorio)"},
  "保存待办": {en:"Save",es:"Guardar"},
  "仅保存到电脑，尚未执行": {en:"Save on your computer only; not executed",es:"Guardar solo en el ordenador; no se ejecuta"},
  "此会话只读；可以保存待办，或复制上下文到手机独立续聊…": {en:"View-only here. Save a message, or copy context to continue separately on your phone…",es:"Solo lectura aquí. Guarda un mensaje o copia el contexto para continuar por separado en el teléfono…"},
  "尚未连接到此会话，只保存了待办，没有发送。": {en:"Not connected to this conversation. The message was saved, not sent.",es:"Sin conexión con esta conversación. El mensaje se guardó, no se envió."},
  "同一条会话同时只能有一个地方发送。查看不会占锁；若电脑正在使用原会话，手机可以创建独立副本继续。已保存的待办尚未执行。": {en:"Only one place can send to a conversation at a time. Viewing does not take the lock. If desktop Codex is using the original, create a separate copy to continue on the phone. Saved messages have not run.",es:"Solo un lugar puede enviar a una conversación a la vez. Leer no toma el bloqueo. Si Codex de escritorio usa la original, crea una copia independiente para seguir en el teléfono. Los mensajes guardados no se han ejecutado."},
  "电脑原会话继续运行。副本只包含已保存的上下文；正在执行的步骤可能不完整。同一项目目录的并行文件修改可能冲突。": {en:"The original desktop conversation keeps running. The copy contains saved context; an in-progress step may be incomplete. Simultaneous edits in the same project folder can conflict.",es:"La conversación original del ordenador sigue activa. La copia contiene el contexto guardado; un paso en curso puede quedar incompleto. Las ediciones simultáneas en la misma carpeta pueden entrar en conflicto."},
  "紧急接管原会话（关闭整个电脑 Codex）": {en:"Emergency takeover of original (closes all desktop Codex)",es:"Toma de control de emergencia (cierra Codex de escritorio)"},
  "关闭电脑 Codex 并接管原会话": {en:"Close desktop Codex and take over original",es:"Cerrar Codex de escritorio y tomar control"},
  "电脑端任务的授权、选择和提问仍需在电脑端处理；当前连接只能同步其记录。手机接管后发起的新任务，可以在这里处理请求。": {"en": "Desktop task approvals, choices and questions must be handled on the computer; this connection only syncs their records. Requests from new tasks started after phone takeover can be answered here.", "es": "Las autorizaciones, opciones y preguntas de tareas del ordenador deben resolverse allí; esta conexión solo sincroniza sus registros. Las solicitudes de tareas nuevas iniciadas tras tomar el control desde el teléfono pueden responderse aquí."},
  "选择一个选项": {"en": "Choose an option", "es": "Elige una opción"},
  "其他回答": {"en": "Other answer", "es": "Otra respuesta"},
  "请回答所有问题后提交": {"en": "Answer every question before submitting", "es": "Responde todas las preguntas antes de enviar"},
  "网络访问": {"en": "Network access", "es": "Acceso a la red"},
  "请求网络访问": {"en": "Network access requested", "es": "Solicitud de acceso a la red"},
  "请求的额外权限：": {"en": "Additional permissions requested:", "es": "Permisos adicionales solicitados:"},
  "批准并保存命令规则": {"en": "Approve and save the command rule", "es": "Autorizar y guardar la regla de comandos"},
  "仅批准本次": {en:"Approve once",es:"Autorizar esta vez"},
  "查看可保存的规则": {en:"View the proposed saved rule",es:"Ver la regla que se propone guardar"},
  "查看原始规则": {en:"View the original rule",es:"Ver la regla original"},
  "保存规则会影响后续请求。只想允许这一次，请选择“仅批准本次”。": {en:"Saving a rule affects future requests. To allow this request only, choose Approve once.",es:"Guardar una regla afecta a las solicitudes futuras. Para permitir solo esta solicitud, elige Autorizar esta vez."},
  "保存网络允许规则": {"en": "Save a network allow rule", "es": "Guardar una regla de acceso a la red"},
  "保存网络拒绝规则": {"en": "Save a network deny rule", "es": "Guardar una regla de denegación de red"},
  "已提交规则决定": {"en": "Rule decision sent", "es": "Decisión de regla enviada"},
  "会话：": {"en": "Conversation:", "es": "Conversación:"},
  "工具请求确认": {"en": "Tool confirmation requested", "es": "Confirmación solicitada por una herramienta"},
  "打开授权链接": {"en": "Open the authorization link", "es": "Abrir el enlace de autorización"},
  "完成后确认": {"en": "Confirm after completing", "es": "Confirmar tras completar"},
  "手机暂不支持此表单，请在原客户端处理，或明确选择拒绝或取消。": {"en": "This form is not supported on the phone. Handle it in the original client, or explicitly decline or cancel.", "es": "Este formulario no se admite en el teléfono. Resuélvelo en el cliente original o rechaza o cancela explícitamente."},
  "请检查必填内容和输入格式": {"en": "Check required fields and input formats", "es": "Revisa los campos obligatorios y los formatos"},
  "已提交，等待任务继续。": {"en": "Submitted; waiting for the task to continue.", "es": "Enviado; esperando a que continúe la tarea."},
  "授权链接无效，请在原客户端处理。": {"en": "The authorization link is invalid. Handle it in the original client.", "es": "El enlace de autorización no es válido. Resuélvelo en el cliente original."},
  "释放电脑端的锁：电脑 Codex 占用时，会关闭整个电脑端 Codex，并终止它正在执行的任务。成功释放后，手机可以发送新指令；被终止的任务不会因此自动恢复。": {
    en: "Release the computer-side lock: if desktop Codex holds it, the entire desktop app closes and its running tasks terminate. After successful release, the phone can send new instructions; terminated tasks do not resume automatically.",
    es: "Liberar el bloqueo del ordenador: si Codex lo tiene, se cierra toda la aplicación y se detienen sus tareas en curso. Tras liberarlo, el teléfono puede enviar nuevas instrucciones; las tareas detenidas no se reanudan solas."
  },
  "释放手机端的锁：只交还手机对当前会话的占用，不会关闭电脑上的 Codex，也不会主动发送停止任务命令。手机任务仍在运行时，请先等它结束。": {
    en: "Release the phone-side lock: only the phone’s hold on this conversation is released. Desktop Codex stays open and no stop-task command is sent. Wait for a running phone task to finish first.",
    es: "Liberar el bloqueo del teléfono: solo cede la retención del teléfono sobre esta conversación. Codex del ordenador sigue abierto y no se envía una orden de detener tareas. Espera primero a que termine la tarea del teléfono."
  },
  "Codex 手机端使用说明": { en: "Using Codex from your phone", es: "Usar Codex desde el teléfono" },
  "锁与授权说明 · 电脑占用时手机仅可查看": { en: "Lock & approvals · View only while desktop holds the conversation", es: "Bloqueo y permisos · Solo lectura mientras el ordenador ocupa la conversación" },
  "待发送 {n} 条 · 保存在电脑端": { en: "{n} to send · saved on your computer", es: "{n} por enviar · guardado en tu computadora" },
  "连接并启用队列（不关闭电脑 Codex）": { en: "Connect and enable the queue (keeps desktop Codex open)", es: "Conectar y activar la cola (sin cerrar Codex en la computadora)" },
  "已暂停：": { en: "Paused: ", es: "En pausa: " },
  "正在发送：": { en: "Sending: ", es: "Enviando: " },
  "已保存，等待确认执行端；尚未发送。": { en: "Saved. Waiting for the executor to be confirmed; not sent yet.", es: "Guardado. Esperando la confirmación del ejecutor; aún no se envió." },
  "取消": { en: "Cancel", es: "Cancelar" },
  "正在检查交还，请稍候再操作。": { en: "Checking handback. Please wait before another action.", es: "Comprobando la devolución del control. Espera antes de realizar otra acción." },
  "连接或会话已改变，未断开手机连接；请重新检查后再交还。": { en: "The connection or conversation changed. The phone connection was kept; check again before handing back control.", es: "La conexión o conversación cambió. Se mantuvo la conexión del teléfono; comprueba de nuevo antes de devolver el control." },
  "仍有手机任务或连接请求在进行，未断开连接；请等完成后再交还。": { en: "A phone task or connection request is still in progress. The connection was kept; wait for it to finish before handing back control.", es: "Una tarea del teléfono o solicitud de conexión sigue en curso. Se mantuvo la conexión; espera a que termine antes de devolver el control." },
  "还有授权、选择或提问待处理，未断开连接；请处理后再交还。": { en: "An approval, choice or question still needs an answer. The connection was kept; answer it before handing back control.", es: "Hay una autorización, opción o pregunta pendiente. Se mantuvo la conexión; resuélvela antes de devolver el control." },
  "仍有待发送内容，未断开连接；请先处理或取消待办后再交还。": { en: "There are messages waiting to be sent. The connection was kept; send or cancel them before handing back control.", es: "Hay mensajes pendientes de envío. Se mantuvo la conexión; envíalos o cancélalos antes de devolver el control." },
  "无法确认所有手机会话的状态，未断开连接；请稍后重试。": { en: "Could not confirm every phone conversation's status. The connection was kept; try again later.", es: "No se pudo confirmar el estado de todas las conversaciones del teléfono. Se mantuvo la conexión; inténtalo más tarde." },
  "其他手机会话仍在运行、等待处理或状态未确认，未断开连接；请等完成后再交还。": { en: "A phone conversation is running, waiting for an answer or has an unconfirmed status. The connection was kept; wait for it to finish before handing back control.", es: "Una conversación del teléfono está en curso, espera una respuesta o tiene un estado sin confirmar. Se mantuvo la conexión; espera a que termine antes de devolver el control." },
  "已请求断开手机控制连接，随后只读重连；电脑能否接手仍待实际确认。": { en: "Requested closure of the phone control connection; it will reconnect for viewing only. Whether the computer can take over still needs to be checked.", es: "Se solicitó cerrar la conexión de control del teléfono; volverá a conectarse solo para lectura. Aún hay que comprobar si el ordenador puede tomar el control." },
  "交还未完成；已保留手机连接：": { en: "Handback was not completed; the phone connection was kept: ", es: "No se completó la devolución del control; se mantuvo la conexión del teléfono: " },
  "先确认所有手机会话均已结束、没有待处理请求和待办，再取消当前订阅并断开这条手机连接，随后只读重连。不关闭电脑 Codex，也不发送停止任务命令；电脑能否接手需要实际确认。": { en: "First check that all phone conversations have finished, with no unanswered requests or queued messages. Then cancel the current subscription and close this phone connection before reconnecting for viewing only. Desktop Codex stays open and no task-stop command is sent; whether the computer can take over needs an actual check.", es: "Primero comprueba que todas las conversaciones del teléfono hayan terminado, sin solicitudes ni mensajes pendientes. Después cancela la suscripción actual y cierra esta conexión antes de reconectarte solo para lectura. Codex en el ordenador permanece abierto y no se envía ninguna orden de detener tareas; hay que comprobar si el ordenador puede tomar el control." },
  "已连接，正在确认任务状态；队列只会在任务正常结束后发送。": { en: "Connected. Checking task status; the queue only sends after the task finishes normally.", es: "Conectado. Comprobando el estado de la tarea; la cola solo envía cuando la tarea termina con normalidad." },
  "暂未确认连接，队列仍保存：": { en: "Connection not confirmed yet; the queue is still saved: ", es: "Conexión aún sin confirmar; la cola sigue guardada: " },
  "队列请求失败": { en: "Queue request failed", es: "Falló la solicitud de la cola" },
  "保存中…": {en:"Saving…",es:"Guardando…"},
  "恢复手机连接": {en:"Restore phone connection",es:"Restaurar la conexión del teléfono"},
  "实时更新暂停 · 仅查看": {en:"Live updates paused · View only",es:"Actualizaciones en pausa · Solo lectura"},
  "已交还手机连接 · 实时更新暂停": {en:"Phone connection handed back · Live updates paused",es:"Conexión del teléfono devuelta · Actualizaciones en pausa"},
  "这里只显示已经加载的记录。保存待办仍可用，尚未发送；恢复连接后仍需明确发送。": {en:"Only previously loaded records are shown. You can still save messages without sending them; restoring the connection does not send them automatically.",es:"Solo se muestran los registros ya cargados. Puedes guardar mensajes sin enviarlos; restaurar la conexión no los envía automáticamente."},
  "实时更新已暂停；已加载的历史仍可查看。恢复手机连接后，仍需明确连接会话或发送已存待办。": {en:"Live updates are paused; loaded history remains visible. After restoring the phone connection, explicitly connect the conversation or send saved messages.",es:"Las actualizaciones están en pausa; el historial cargado sigue visible. Tras restaurar la conexión, conecta explícitamente la conversación o envía los mensajes guardados."},
  "Codex 可能还要约一分钟才释放空闲会话；稍后在电脑重试。这里只确认手机连接已断开。": {en:"Codex may take about another minute to release an idle conversation. Try again on your computer shortly. Only the phone disconnection is confirmed here.",es:"Codex puede tardar aproximadamente otro minuto en liberar una conversación inactiva. Vuelve a intentarlo en el ordenador dentro de poco. Aquí solo se confirma que el teléfono se ha desconectado."},
  "已请求断开手机控制连接，实时更新已暂停；电脑能否接手仍待实际确认。Codex 可能还要约一分钟才释放空闲会话，请稍后在电脑重试。需要时请明确恢复手机连接。": {en:"Requested closure of the phone control connection; live updates are paused. Whether the computer can take over still needs an actual check. Codex may take about another minute to release an idle conversation; try again on your computer shortly. Restore the phone connection explicitly when needed.",es:"Se solicitó cerrar la conexión de control del teléfono; las actualizaciones están en pausa. Aún hay que comprobar si el ordenador puede tomar el control. Codex puede tardar aproximadamente otro minuto en liberar una conversación inactiva; vuelve a intentarlo en el ordenador dentro de poco. Restaura la conexión explícitamente cuando sea necesario."},
  "先确认所有手机会话均已结束、没有待处理请求和待办，再取消当前订阅并断开这条手机连接。页面保留已加载的历史，实时更新暂停，只有你点击恢复后才重连。不关闭电脑 Codex，也不发送停止任务命令；电脑能否接手需要实际确认。": {en:"First check that all phone conversations have finished, with no unanswered requests or queued messages. Then cancel the current subscription and close this phone connection. Loaded history stays visible, live updates pause, and the phone reconnects only when you choose Restore. Desktop Codex stays open and no task-stop command is sent; whether the computer can take over needs an actual check.",es:"Primero comprueba que todas las conversaciones del teléfono hayan terminado, sin solicitudes ni mensajes pendientes. Después cancela la suscripción actual y cierra esta conexión. El historial cargado sigue visible, las actualizaciones se pausan y el teléfono solo se reconecta cuando eliges Restaurar. Codex en el ordenador permanece abierto y no se envía ninguna orden de detener tareas; hay que comprobar si el ordenador puede tomar el control."},
  "正在保存到电脑；尚未发送…": {en:"Saving to your computer; not sent yet…",es:"Guardando en el ordenador; aún no se ha enviado…"},
  "已保存，尚未发送。": {en:"Saved, not sent yet.",es:"Guardado; aún no se ha enviado."},
  "保存请求超时；结果未确认，输入仍保留，可重试。": {en:"The save request timed out. Its result is unconfirmed; your input is kept and you can retry.",es:"La solicitud de guardado agotó el tiempo. Su resultado no está confirmado; se conserva el texto y puedes reintentar."},
  "队列不可用": { en: "Queue unavailable", es: "Cola no disponible" },
  "正在确认当前任务，稍后再加入队列": { en: "Checking the current task — try adding to the queue again in a moment", es: "Comprobando la tarea actual; vuelve a añadir a la cola en un momento" },
  "已保存到电脑队列，尚未送达 Codex；确认连接且任务完成后才发送": { en: "Saved to the computer queue. Not delivered to Codex yet; it is sent once the connection is confirmed and the task finishes.", es: "Guardado en la cola de la computadora. Aún no se entregó a Codex; se enviará cuando se confirme la conexión y termine la tarea." },
  "未确认加入队列，文字和附件已保留：": { en: "Could not confirm the queue entry; your text and attachments are kept: ", es: "No se pudo confirmar la entrada en la cola; tu texto y adjuntos se conservan: " },
  "排队": { en: "Queue", es: "En cola" },
  "保存到电脑队列，不打断任务": { en: "Save to the computer queue without interrupting the task", es: "Guardar en la cola de la computadora sin interrumpir la tarea" },
  "状态未确认：发送时会先确认一次当前任务": { en: "Status unconfirmed: sending will confirm the current task first", es: "Estado sin confirmar: al enviar se comprobará antes la tarea actual" },
  "正在确认当前任务…": { en: "Confirming the current task…", es: "Comprobando la tarea actual…" },
  "没能确认当前任务，已按排队保存": { en: "Could not confirm the current task — saved to the queue instead", es: "No se pudo confirmar la tarea actual; se guardó en la cola" },
  "加入队列": { en: "Add to queue", es: "Añadir a la cola" },
  "先保存要求，等待接通执行端…": { en: "Save your request and wait for the executor…", es: "Guarda tu solicitud y espera al ejecutor…" },
  "输入下一项要求，完成后依次执行…": { en: "Type the next request; it runs after this one finishes…", es: "Escribe la siguiente solicitud; se ejecutará al terminar esta…" },
  "所选图片": { en: "Selected image", es: "Imagen seleccionada" },
  "已上传 · ": { en: "Uploaded · ", es: "Subido · " },

  "请填写电脑上的绝对路径": { en: "Enter an absolute path on your computer", es: "Introduce una ruta absoluta del ordenador" },
  "开新会话失败：": { en: "Could not start a new conversation: ", es: "No se pudo iniciar una conversación nueva: " },
  "正在读取最近一轮任务的状态。": { en: "Reading the status of the latest turn.", es: "Leyendo el estado del último turno." },
  "会话": { en: "Conversation", es: "Conversación" },
  "这是一个新会话。<br>在下面输入框里说点什么。": { en: "This is a new conversation.<br>Say something in the box below.", es: "Esta es una conversación nueva.<br>Escribe algo en el cuadro de abajo." },
  "读不到会话内容：": { en: "Cannot load this conversation: ", es: "No se puede cargar esta conversación: " },
  "已经是最早的了": { en: "You have reached the beginning", es: "Ya llegaste al inicio" },
  "往上滑加载更早的": { en: "Scroll up for earlier messages", es: "Desliza hacia arriba para ver mensajes anteriores" },
  "正在加载更早的…": { en: "Loading earlier messages…", es: "Cargando mensajes anteriores…" },
  "加载更早的失败：": { en: "Could not load earlier messages: ", es: "No se pudieron cargar los mensajes anteriores: " },
  "消息未发送：会话由另一个执行服务占用": { en: "Message not sent: another executor holds this conversation", es: "Mensaje no enviado: otro ejecutor tiene esta conversación" },
  "这条会话由另一个执行服务占用，手机只能查看，不能发送指令。<br><br>你能做的：<br>· 若由电脑 Codex 占用，可点下面「释放电脑端的锁」：会关闭电脑上的 Codex、终止它正在执行的任务。成功释放后，手机可以发送新指令<br>· 或者另开一条会话（不会接着当前任务的进度）<br><br>你输入的内容和附件都还在。": { en: "Another execution service holds this conversation. The phone can view it, but cannot send instructions.<br><br>What you can do:<br>· If desktop Codex holds it, tap “Release the lock on the computer” below. This closes desktop Codex and terminates its running tasks. After successful release, the phone can send new instructions<br>· Or start a new conversation (it will not continue the current task)<br><br>Your text and attachments are still here.", es: "Otro servicio de ejecución tiene esta conversación. El teléfono puede verla, pero no enviar instrucciones.<br><br>Qué puedes hacer:<br>· Si la tiene Codex del ordenador, pulsa «Liberar el bloqueo del ordenador». Se cierra Codex y se detienen sus tareas en curso. Tras liberarlo, el teléfono puede enviar nuevas instrucciones<br>· O abre otra conversación (no continuará la tarea actual)<br><br>Tu texto y adjuntos siguen aquí." },
  "释放手机端的锁": { en: "Release the lock on the phone", es: "Liberar el bloqueo del teléfono" },
  "释放手机端的锁？\n\n· 只松开手机这边占的会话\n· 不会关闭电脑上的 Codex，也不会主动发送停止任务命令\n· 若手机任务仍在运行，建议等它结束后再操作\n· 手机下次发消息会自动重新接上\n\n确定吗？": {
    en: "Release the lock on the phone?\n\n· Only the phone's hold on this session is released\n· Desktop Codex is not closed and no stop-task command is sent\n· If a phone task is still running, consider waiting until it finishes\n· The phone reconnects automatically next time you send\n\nContinue?",
    es: "¿Liberar el bloqueo del teléfono?\n\n· Solo se libera la retención del teléfono sobre esta sesión\n· No se cierra Codex de escritorio ni se envía ninguna orden de detener la tarea\n· Si una tarea del teléfono sigue en curso, conviene esperar a que termine\n· El teléfono se reconecta solo la próxima vez que envíes\n\n¿Continuar?"
  },
  "正在释放手机端的锁…": { en: "Releasing the lock on the phone…", es: "Liberando el bloqueo del teléfono…" },
  "手机端的锁已经松开（电脑上的 Codex 没被动过）。": {
    en: "The phone's lock is released (Codex on your computer was not touched).",
    es: "El bloqueo del teléfono está liberado (no se tocó Codex en tu ordenador)."
  },
  "释放手机端的锁：没成功": { en: "Release the phone-side lock: it did not work", es: "Liberar el bloqueo del teléfono: no funcionó" },
  "释放电脑端的锁": { en: "Release the lock on the computer", es: "Liberar el bloqueo del ordenador" },
  "电脑上的 Codex 开着这条会话时，手机发不出消息。点它让电脑端交出来（占着的是手机这端时，就是还回去）。": {
    en: "When this conversation is open in desktop Codex, the phone cannot send messages. Tap to hand it over from the computer (if the phone holds it, the lock is simply released).",
    es: "Si esta conversación está abierta en Codex del ordenador, el teléfono no puede enviar mensajes. Toca para cederla desde el ordenador (si la tiene el teléfono, solo se libera el bloqueo)."
  },
  "会关掉电脑上的 Codex，正在执行的电脑端任务会被终止；已保存的会话记录会保留。": {
    en: "Desktop Codex will close and its running tasks will be terminated; saved conversation history is kept.",
    es: "Codex en el ordenador se cerrará y sus tareas en curso se detendrán; se conserva el historial guardado de la conversación."
  },
  "什么是「锁」：同一条会话同时只能有一个写入者。电脑上的 Codex 占着当前会话的锁时，手机只能查看，不能发送指令。保存到排队列表的内容还没有执行。下面可以分别释放电脑端或手机端的锁。": {
    en: "Only one writer can hold a conversation at a time. While desktop Codex holds this conversation’s lock, the phone can view it but cannot send instructions. Messages saved to the queue have not run. You can release the computer-side or phone-side lock below.",
    es: "Solo un escritor puede tener una conversación a la vez. Mientras Codex del ordenador tiene su bloqueo, el teléfono puede verla pero no enviar instrucciones. Los mensajes guardados en cola aún no se han ejecutado. Abajo puedes liberar el bloqueo del ordenador o del teléfono."
  },
  "只松开手机这边占的会话：不会关闭电脑上的 Codex，也不会主动发送停止任务命令。手机关掉或断开一会儿之后会自动松开，所以通常不用点它。": {
    en: "Releases only the phone's hold on this conversation: desktop Codex is not closed, and no stop-task command is sent. It is also released automatically a while after the phone closes or disconnects, so you normally never need this button.",
    es: "Libera solo la retención del teléfono sobre esta conversación: no se cierra Codex de escritorio ni se envía ninguna orden de detener la tarea. También se libera automáticamente un rato después de cerrar o desconectar el teléfono, así que normalmente no hace falta pulsarlo."
  },
  "⚠️ 会关掉电脑上的 Codex，正在执行的电脑端任务会被终止": {
    en: "⚠️ This closes Codex on your computer; its running tasks will be terminated",
    es: "⚠️ Esto cierra Codex en tu ordenador; sus tareas en curso se detendrán"
  },
  "它让电脑端交出写权限，代价是关掉电脑上的 Codex（已保存的会话记录会保留，但电脑端正在执行的任务会终止）。只有「电脑上确实开着这条会话、而你现在必须用手机接着下指令」时才点它。只是想松开手机这边，用上面那颗。": {
    en: "It makes the computer side give up the write permission; the cost is closing Codex on your computer (saved conversation history is kept, but its running tasks terminate). Use it only when the computer really has this conversation open and you must keep instructing from the phone right now. To release only the phone side, use the button above.",
    es: "Hace que el lado del ordenador ceda el permiso de escritura; el coste es cerrar Codex en tu ordenador (se conserva el historial guardado de la conversación, pero sus tareas en curso se detienen). Úsalo solo si el ordenador tiene realmente abierta esta conversación y necesitas seguir dando instrucciones desde el teléfono ahora mismo. Para liberar solo el lado del teléfono, usa el botón de arriba."
  },
  "释放电脑端的锁？\n\n· 如果这条会话由电脑端占用，将关闭电脑上的 Codex，正在执行的电脑端任务会被终止\n· 已保存的会话记录会保留\n· 锁释放成功后，手机可以发送新指令\n\n确定吗？": { en: "Release the lock on the computer?\n\n· If desktop Codex holds this session, it will close; its running tasks will be terminated\n· Saved conversation history is kept\n· After the lock is released successfully, you can send new instructions from the phone\n\nGo ahead?", es: "¿Liberar el bloqueo del ordenador?\n\n· Si Codex del ordenador tiene esta sesión, se cerrará; sus tareas en curso se detendrán\n· Se conserva el historial guardado de la conversación\n· Después de liberar el bloqueo, podrás enviar nuevas instrucciones desde el teléfono\n\n¿Continuar?" },
  "正在释放电脑端的锁…": { en: "Releasing the lock on the computer…", es: "Liberando el bloqueo del ordenador…" },
  "手机这边之前占着这条会话，锁已经松开。正在重试…": { en: "The phone was holding this conversation; the lock is now free. Retrying…", es: "El teléfono tenía esta conversación; el bloqueo ya está libre. Reintentando…" },
  "这条会话的锁本来就是空的。正在重试…": { en: "This conversation was not locked at all. Retrying…", es: "Esta conversación no estaba bloqueada. Reintentando…" },
  "电脑端占用已解除。正在重新连接，连接成功后可以从手机发送新指令…": { en: "The computer-side lock is released. Reconnecting; you can send new instructions from the phone once connected…", es: "Se ha liberado el bloqueo del ordenador. Reconectando; podrás enviar nuevas instrucciones desde el teléfono al conectar…" },
  "锁还是没松开：会话被占着，但电脑上的 Codex 没开着。请稍等再试一次。": { en: "The lock is still held: the conversation is taken, but desktop Codex is not running. Wait a moment and try again.", es: "El bloqueo sigue activo: la conversación está tomada, pero Codex no está abierto en el ordenador. Espera un momento e inténtalo de nuevo." },
  "电脑上的 Codex 已经关掉，但这条会话的锁还是没松开。请稍等再试，或重启电脑端的 Codex。": { en: "Desktop Codex was closed, but this conversation is still locked. Try again in a moment, or restart Codex on the computer.", es: "Codex se cerró en el ordenador, pero esta conversación sigue bloqueada. Inténtalo de nuevo en un momento o reinicia Codex en el ordenador." },
  "没能关掉电脑上的 Codex —— 锁没释放。": { en: "Could not close desktop Codex — the lock was not released.", es: "No se pudo cerrar Codex en el ordenador; el bloqueo no se liberó." },
  "会话编号不对，请回到列表重新打开这条会话。": { en: "That conversation id is not valid — go back to the list and open the conversation again.", es: "El identificador de la conversación no es válido; vuelve a la lista y ábrela de nuevo." },
  "释放失败：": { en: "Release failed: ", es: "Falló la liberación: " },
  "释放没做成（没有确认）。": { en: "Nothing was released (no confirmation).", es: "No se liberó nada (sin confirmación)." },
  "释放电脑端的锁：没成功": { en: "Release the lock: it did not work", es: "Liberar el bloqueo: no funcionó" },
  "再试一次": { en: "Try again", es: "Reintentar" },
  "知道了": { en: "Got it", es: "Entendido" },
  "释放电脑端的锁：电脑上的 Codex 占着这条会话、手机上发不出消息时用它": {
    en: "Release the lock on the computer: use it when desktop Codex holds this conversation and the phone cannot send",
    es: "Liberar el bloqueo del ordenador: úsalo cuando Codex en el ordenador tiene esta conversación y el teléfono no puede enviar"
  },
  "正在释放电脑端的锁…": { en: "Releasing the lock on the computer…", es: "Liberando el bloqueo del ordenador…" },
  "现在能拿到这条会话了 —— 占着它的不是电脑那边（多半是手机自己之前占着）。已经还回去，正在重试…": {
    en: "This conversation is reachable now — the computer was not the one holding it (most likely the phone was, from earlier). It has been given back; retrying…",
    es: "Ahora sí se puede acceder a esta conversación: no la tenía el ordenador (lo más probable es que la tuviera el propio teléfono). Ya se ha devuelto; reintentando…"
  },
  "没问出锁在谁手里，所以**没有动电脑上的任何东西**。": {
    en: "Could not tell who holds the lock, so **nothing on the computer was touched**.",
    es: "No se pudo averiguar quién tiene el bloqueo, así que **no se tocó nada en el ordenador**."
  },
  "会话被另一个 Codex 占着，但电脑上的 Codex 没开着 —— 不是它占的，我没有动任何东西。请稍等再试一次。": {
    en: "Another Codex holds this conversation, but desktop Codex is not running — so it is not the one holding it, and nothing was touched. Wait a moment and try again.",
    es: "Otro Codex tiene esta conversación, pero Codex no está abierto en el ordenador: no es él quien la tiene y no se tocó nada. Espera un momento e inténtalo de nuevo."
  },
  "电脑上的 Codex 已经关掉，但这条会话还是拿不到。请稍等再试，或在电脑上重开一次 Codex。": {
    en: "Desktop Codex was closed, but this conversation is still not reachable. Try again in a moment, or reopen Codex on the computer.",
    es: "Codex se cerró en el ordenador, pero esta conversación sigue sin ser accesible. Inténtalo de nuevo en un momento o vuelve a abrir Codex en el ordenador."
  },
  "没能关掉电脑上的 Codex —— 锁没释放，什么都没变。": {
    en: "Could not close desktop Codex — the lock was not released and nothing changed.",
    es: "No se pudo cerrar Codex en el ordenador: el bloqueo no se liberó y nada cambió."
  },
  // ── 「会话写入锁」面板（使用者说找不到按钮之后加的固定入口）──────────────────
  "会话写入锁": { en: "Conversation write lock", es: "Bloqueo de escritura de la conversación" },
  "Codex 的同一个会话同时只能有一个地方写：电脑上的 Codex 开着它，手机上就发不出消息；反过来也一样。这个按钮让电脑端把这条会话交出来（如果占着的是手机这边，就是还回去）。": {
    en: "Codex allows only one writer per conversation: if desktop Codex has it open, the phone cannot send, and vice versa. This button makes the computer hand the conversation over (or, if the phone is the one holding it, gives it back).",
    es: "Codex solo permite un escritor por conversación: si Codex en el ordenador la tiene abierta, el teléfono no puede enviar, y al revés. Este botón hace que el ordenador ceda la conversación (o, si la tiene el teléfono, la devuelve)."
  },
  "这条会话": { en: "This conversation", es: "Esta conversación" },
  "（没有标题）": { en: "(untitled)", es: "(sin título)" },
  "手机现在占着它 —— 这期间电脑上可能打不开这条会话。": {
    en: "The phone is holding it right now — desktop Codex may be unable to open this conversation in the meantime.",
    es: "Ahora mismo la tiene el teléfono; mientras tanto, puede que Codex en el ordenador no pueda abrirla."
  },
  "手机没有占用这条会话。若发送时报「会话由另一个执行服务占用」，请检查是否由电脑 Codex 或其他执行服务占用。": {
    en: "The phone is not holding this conversation. If sending reports “another executor holds this conversation”, check whether desktop Codex or another execution service holds it.",
    es: "El teléfono no tiene esta conversación. Si al enviar aparece «otro ejecutor tiene esta conversación», comprueba si la tiene Codex del ordenador u otro servicio de ejecución."
  },
  "代价写在确认框里：必要时会关掉电脑上的 Codex，那边正在跑的任务可能会被终止；会话内容本身已经存盘，不会丢。": {
    en: "The cost is spelled out in the confirmation: desktop Codex may be closed, and a task running there may be terminated — the conversation itself is saved and will not be lost.",
    es: "El coste se explica en la confirmación: puede que se cierre Codex en el ordenador y que una tarea en curso se cancele; la conversación queda guardada y no se pierde."
  },
  "先打开一条会话，再回到这里 —— 锁是按会话算的，得先知道是哪一条。": {
    en: "Open a conversation first, then come back here — the lock is per conversation, so we need to know which one.",
    es: "Abre antes una conversación y vuelve aquí: el bloqueo es por conversación, hay que saber cuál."
  },
  "释放电脑端的锁": { en: "Release the lock on the computer", es: "Liberar el bloqueo del ordenador" },
  "（这条会话）": { en: "(this conversation)", es: "(esta conversación)" },
  "先打开一条会话": { en: "Open a conversation first", es: "Abre antes una conversación" },
  "手机现在正占着这条会话（标题栏那个 🔒）—— 电脑上可能打不开它。": {
    en: "The phone is holding this conversation right now (that 🔒 in the title bar) — desktop Codex may be unable to open it.",
    es: "El teléfono tiene ahora mismo esta conversación (el 🔒 de la barra de título); puede que el ordenador no pueda abrirla."
  },
  "同一个会话同时只能有一个地方写。发消息时报「会话由另一个执行服务占用」时，用这里释放。": {
    en: "Only one place can write to a conversation at a time. When sending reports “another executor holds this conversation”, release it here.",
    es: "Solo un sitio puede escribir en una conversación a la vez. Cuando al enviar aparezca «otro ejecutor tiene esta conversación», libérala aquí."
  },
  "手机正占着这条会话 —— 点这里可以还回去或让电脑端交出来": {
    en: "The phone is holding this conversation — tap to give it back or make the computer hand it over",
    es: "El teléfono tiene esta conversación; toca para devolverla o hacer que el ordenador la ceda"
  },

  "全部折叠": { en: "Fold all", es: "Plegar todo" },
  "全部展开": { en: "Expand all", es: "Desplegar todo" },

  "等待你": { en: "Waiting for you", es: "Te espera" },
  "在同一个项目里开新的": { en: "New conversation in the same project", es: "Nueva conversación en el mismo proyecto" },
  "正在重试…": { en: "Retrying…", es: "Reintentando…" },

  "发送补充意见": { en: "Send follow-up", es: "Enviar seguimiento" },
  "正在确认任务状态，请稍候": { en: "Checking the task status, please wait", es: "Comprobando el estado de la tarea, espera" },
  "补充要求，不会停止当前任务…": { en: "Add a follow-up without stopping the current task…", es: "Añade una indicación sin detener la tarea actual…" },

  "先确认任务状态，再发送消息": { en: "Confirm the task status before sending", es: "Confirma el estado de la tarea antes de enviar" },
  "会话还在加载，稍等一下": { en: "The conversation is still loading — one moment", es: "La conversación aún se está cargando; un momento" },
  "正在加载这个会话… <span id=\"resume-sec\">0</span> 秒": { en: "Loading this conversation… <span id=\"resume-sec\">0</span>s", es: "Cargando esta conversación… <span id=\"resume-sec\">0</span> s" },
  "会话越大越久（有的要几分钟）。加载完会自动把你要发的内容发出去，不用重打。": { en: "The bigger the conversation, the longer it takes (some take minutes). Once loaded, your message is sent automatically — no need to retype it.", es: "Cuanto más grande la conversación, más tarda (algunas tardan minutos). Al terminar, tu mensaje se envía automáticamente; no hace falta reescribirlo." },
  "会话仍在执行，正在确认可补充的当前轮次；输入已保留。": { en: "The conversation is still running; checking the current turn you can add to. Your input is kept.", es: "La conversación sigue en ejecución; comprobando el turno actual al que puedes añadir. Tu texto se conserva." },
  "已连接运行中的会话，请确认状态后选择排队或立即补充": { en: "Connected to a running conversation. Check the status, then queue your message or send it now.", es: "Conectado a una conversación en ejecución. Revisa el estado y luego pon el mensaje en cola o envíalo ya." },
  "加载好了（{n} 秒），正在发送…": { en: "Loaded in {n}s — sending…", es: "Cargado en {n} s; enviando…" },
  "这个会话太大，加载超时了。历史还能正常翻看，但发消息暂时不行 —— 换一条小一点的会话，或者在电脑上把它处理完。": { en: "This conversation is too big and timed out while loading. You can still browse the history, but you cannot send messages for now — switch to a smaller conversation, or finish this one on your computer.", es: "Esta conversación es demasiado grande y agotó el tiempo de carga. Puedes seguir leyendo el historial, pero por ahora no puedes enviar mensajes; cambia a una conversación más pequeña o termínala en la computadora." },
  "这个会话没能加载起来：": { en: "This conversation could not be loaded: ", es: "No se pudo cargar esta conversación: " },
  "这个会话在服务端被卸载了。再发一次会自动重新加载。": { en: "This conversation was unloaded on the server. Sending again reloads it automatically.", es: "El servidor descargó esta conversación. Si envías de nuevo, se recargará automáticamente." },
  "发送失败：": { en: "Send failed: ", es: "Falló el envío: " },
  "正在确认当前任务，请稍后发送；输入已保留": { en: "Checking the current task — send in a moment. Your input is kept.", es: "Comprobando la tarea actual; envía en un momento. Tu texto se conserva." },

/**
 * 给队列 / 上传 / 会话列表用的 fetch：**请求体和响应都加密**。
 *
 * 响应方向不用在这里处理 —— e2ee.js 的 installFetchDecrypt 已经接管了 fetch，
 * 凡是带 x-dsh-e2ee 的响应都会自动解开并把 content-type 还原（含跨时间段重试）。
 *
 * 没有 body 的时候也必须带上那个头：GET 按规范不能带请求体，但**网关要靠这个头
 * 才肯把响应加密**，不带就退回明文了（经中继时更会被闸门直接拒掉）。

// 交付文件按钮的点击：事件委托，正文每次重画都不用重挂
document.addEventListener('click', function (ev) {
  var el = ev.target;
  while (el && el !== document.body) {
    if (el.getAttribute && el.getAttribute('data-filecite')) {
      ev.preventDefault();
      downloadDeliverable(el.getAttribute('data-filecite'));
      return;
    }
    el = el.parentNode;
  }
});

function privateFetch(url, init) {
  var secret = window.__dshE2eeSecret;
  var E = window.DshE2EE;
  if (!secret) {
    if (!plainLocalOrigin()) return Promise.reject(new Error(t('隧道地址缺少加密密钥，请用完整的手机地址重新打开。')));
    return fetch(url, init || {});
  }
  if (!E || !E.encryptedFetch) return Promise.reject(new Error(t('加密模块未就绪，请刷新后重试。')));
  if (init && init.body != null) return E.encryptedFetch(secret, url, init);
  var h = Object.assign({}, (init && init.headers) || {});
  h['x-dsh-e2ee'] = '1';
  return fetch(url, Object.assign({}, init || {}, { headers: h }));
}

function plainLocalOrigin() {
  var host = String((window.location && window.location.hostname) || '').toLowerCase();
  if (/^(localhost|127(?:\.\d{1,3}){3}|10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|169\.254(?:\.\d{1,3}){2}|\[?::1\]?|[a-z0-9.-]+\.local)$/.test(host)) return true;
  var lan172 = /^172\.(\d{1,2})\./.exec(host);
  return !!(lan172 && Number(lan172[1]) >= 16 && Number(lan172[1]) <= 31);
}

    .then(function(r){return r.json().then(function(j){if(!r.ok || j.ok!==true)throw new Error(j.error||t('队列请求失败'));return j;});})
    .catch(function(e){if(e.name==='AbortError')throw new Error(t('保存请求超时；结果未确认，输入仍保留，可重试。'));throw e;})
    .finally(function(){clearTimeout(timeout);});
