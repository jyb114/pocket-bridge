}

function baseName(p) {
  return String(p || '').split(/[\\/]/).pop() || 'file';
}

function citationButtonHtml(path, purpose, title) {
  var name = title || baseName(path);
  var label = purpose === 'output' ? t('下载交付文件') : t('打开文件');
  return '<button type="button" class="filecite" data-filecite="' + esc(path) + '"' +
    ' title="' + esc(path) + '">' + esc(name) +
    '<span class="fc-go">' + esc(label) + '</span></button>';
}

function downloadDeliverable(path) {
  var name = baseName(path);
  toast(t('正在取文件…'));
  return fileRequest(path)
    .then(function (r) {
      if (!r.ok) {
        throw new Error(r.status === 403 ? t('这台设备还没通过验证，稍后再试') : t('取不到这个文件'));
      }
      return r.blob();
    })
    .then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      // 立刻 revoke 会让某些浏览器下载到一半失败，留一分钟
      setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    })
    .catch(function (e) { toast(e.message || t('取不到这个文件')); });
}

function fmt(text) {
  // ★ 先把交付文件标记摘出来换成占位符（放在 esc 之前，免得路径里的引号被转义搞乱）
  var cites = [];
  var src0 = String(text == null ? '' : text);
  parseCitations(src0).sort(function (a, b) { return b.at - a.at; }).forEach(function (h) {
    var ph = '\u0000C' + cites.length + '\u0000';
    cites.push(citationButtonHtml(h.path, h.purpose));
    src0 = src0.slice(0, h.at) + ph + src0.slice(h.at + h.len);
  });

  // ★ 交付路径也可能写成 markdown 链接：[标题](D:/x/y.md)
  //   手机上那串括号点不动，而打开文件的能力我们已经有。
  //   只认**本地路径**（盘符 / 反斜杠 / 常见相对路径），http(s) 链接不动它 ——
  //   那是网页链接，交给浏览器。
  // ★ 先把代码摘出来：围栏块和行内 `…` 里出现的 [x](D:/a/b.md) 是**代码**，
  //   不是链接。原来代码保护排在后面，于是测试当场抓到「行内代码变成了按钮」。
  var codeSpans = [];
  src0 = src0.replace(/```[\s\S]*?```|`[^`\n]*`/g, function (m) {
    codeSpans.push(m);
    return '\u0000I' + (codeSpans.length - 1) + '\u0000';
  });

  var links = [];
  var isLocalPath = function (target) {
    // 注意 `[a-z0-9+.-]+` 里的 **+**：写成 * 的话 `D:` 会被当成协议，
    // 于是 D:/… 这种盘符路径反而认不出来（测试当场抓到）。
    if (/^[a-z][a-z0-9+.-]+:/i.test(target)) return false;  // http/https/mailto…
    if (/^[A-Za-z]:[\\/]/.test(target)) return true;          // D:\… / D:/…
    if (/^[\\/]{2}/.test(target)) return false;               // //host/… 协议相对，交给浏览器
    // 相对路径：至少带一个扩展名（REPORT.md、docs/a.png）
    return /\.[A-Za-z0-9]{1,8}$/.test(target);
  };
  // Scan the destination rather than stopping at the first ')' or space:
  // Windows filenames commonly contain both, and Markdown also permits <...>.
  var linkParts = [];
  var linkCursor = 0;
  var linkOpen = /\[([^\]\n]{1,80})\]\(/g;
  var match;
  while ((match = linkOpen.exec(src0)) !== null) {
    var from = linkOpen.lastIndex;
    var end = -1;
    var target = '';
    if (src0.charAt(from) === '<') {
      var closeAngle = src0.indexOf('>', from + 1);
      if (closeAngle > from + 1 && closeAngle - from <= 301 &&
          src0.charAt(closeAngle + 1) === ')' && !/[\r\n]/.test(src0.slice(from, closeAngle))) {
        target = src0.slice(from + 1, closeAngle);
        end = closeAngle + 2;
      }
    } else {
      var depth = 0;
      for (var at = from; at < src0.length && at - from <= 300; at++) {
        var ch = src0.charAt(at);
        if (ch === '\r' || ch === '\n') break;
        if (ch === '(') depth++;
        if (ch === ')') {
          if (!depth) { target = src0.slice(from, at); end = at + 1; break; }
          depth--;
        }
      }
    }
    if (end < 0) continue;
    linkOpen.lastIndex = end;
    target = target.trim();
    if (!isLocalPath(target)) continue;
    var ph = '\u0000L' + links.length + '\u0000';
    links.push(citationButtonHtml(target, 'open', match[1]));
    linkParts.push(src0.slice(linkCursor, match.index), ph);
    linkCursor = end;
  }
  linkParts.push(src0.slice(linkCursor));
  src0 = linkParts.join('');

  codeSpans.forEach(function (m, i) { src0 = src0.replace('\u0000I' + i + '\u0000', m); });

  var out = esc(src0);

  // 链接占位符要在 esc 之后放回来（和交付标记同一套路）
  links.forEach(function (html, i) { out = out.replace('\u0000L' + i + '\u0000', html); });

  // 代码块先摘出来，免得里面的内容被后面的规则改坏
  var blocks = [];
  out = out.replace(/```(\w*)\n?([\s\S]*?)```/g, function (m, lang, code) {
    blocks.push('<pre><code>' + code.replace(/\n$/, '') + '</code></pre>');
    return '\u0000B' + (blocks.length - 1) + '\u0000';
  });

  out = out.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  out = out.replace(/^###### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^##### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^#### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>');
  out = out.replace(/^\s*[-*] (.*)$/gm, '\u0000L$1\u0000');
  out = out.replace(/^\s*(\d+)\. (.*)$/gm, '\u0000L$1. $2\u0000');
  out = out.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  out = out.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  out = out.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  out = out.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  out = out.replace(/^---+$/gm, '<hr>');

  // 连续的行内列表项合并成 <ul>
  out = out.replace(/(?:\u0000L[^\u0000]*\u0000)+/g, function (chunk) {
    var items = chunk.split('\u0000').filter(function (x) { return x.indexOf('L') === 0; })
      .map(function (x) { return '<li>' + x.slice(1) + '</li>'; }).join('');
    return '<ul>' + items + '</ul>';
  });

  out = out.replace(/\u0000B(\d+)\u0000/g, function (m, i) { return blocks[Number(i)]; });
  // 交付文件的按钮最后还原 —— 它里面是 HTML，不能参与前面的 markdown 规则
  out = out.replace(/\u0000C(\d+)\u0000/g, function (m, i) { return cites[Number(i)] || ''; });
  return out;
}

function timestampMs(v) {
  if (!v) return 0;
  var n = Number(v);
  var t = Number.isFinite(n) ? n : Date.parse(v);
  if (!Number.isFinite(t)) return 0;
  return t < 1e12 ? t * 1000 : t;
}
function relTime(v) {
  var t = timestampMs(v);
  if (!t) return '';
  var d = Math.floor((Date.now() - t) / 1000);
  if (d < 60) return tr('刚刚');
  if (d < 3600) return Math.floor(d / 60) + tr(' 分钟前');
  if (d < 86400) return Math.floor(d / 3600) + tr(' 小时前');
  if (d < 86400 * 30) return Math.floor(d / 86400) + tr(' 天前');
  return new Date(t).toLocaleDateString('zh-CN');
}

function setConn(cls, text) {
  $('conn').className = 'conn ' + cls;
  // text 传进来的一律是中文原文（下面每个调用处都没包 t()）：在这里翻，
  // 并且把原文记成 data-i18n —— 这样切语言时 apply() 会自动刷新它。
  $('conntext').textContent = t(text);
  $('conntext').setAttribute('data-i18n', text);
}

// ── 滚动：跟着最新内容走 ─────────────────────────────────────────────────────
//
// 这里原来是个很容易出错的做法：每次内容变多就问一句「离底部是不是不到 260px」，
// 是就滚。长文本一来就露馅 —— 单次增量一大（比如一整段回复、或者 item/completed
// 触发的整块重建），距离瞬间超过阈值，之后就再也不跟了。使用者的感受就是
// 「一直停在前面那段，看不到最新的」。
//
// 正确做法是记住「使用者是不是在跟着看」：只有他自己往上翻过，才停止跟随；
// 只要他滚回底部，就自动恢复跟随。中间不管内容涨多少都跟住。
var stick = true;

function nearBottom() {
  var m = $('main');
  return m.scrollHeight - m.scrollTop - m.clientHeight < 90;
}

/** 滚到底。force=true 时无视「使用者正在翻历史」 */
function toBottom(force) {
  // 任何一次明确的滚动请求都优先于「往上翻页时的对位」——
  // 不取消的话，刚点完「↓ 最新」就会被那串对位逻辑拽回原来的位置。
  if (state.anchorStop) state.anchorStop();
  if (!force && !stick) { updateJump(); return; }
  var m = $('main');
  m.scrollTop = m.scrollHeight;
  // 布局可能还没算完（图片、字体、展开的 details），下一帧再对一次
  requestAnimationFrame(function () {
    m.scrollTop = m.scrollHeight;
    updateJump();
  });
}

/** 内容变了之后调用：跟随状态下保证看到最新 */
function scrollDown(force) {
  if (force) { stick = true; }
  toBottom(force);
  // 有些内容（等宽字体的代码块、展开的输出）会在随后的几帧里继续撑高，
  // 所以补一次延迟对齐 —— 不然「滚到底了但没到底」。
  clearTimeout(scrollDown._t);
  scrollDown._t = setTimeout(function () {
    if (stick || force) {
      var m = $('main');
      m.scrollTop = m.scrollHeight;
      updateJump();
    }
  }, 220);
}

/** 不在底部时给一个「回到最新」的按钮 —— 不硬拽人，但让人一眼知道有新内容 */
function updateJump() {
  var b = $('jump');
  if (!b) return;
  b.style.display = state.view !== 'thread' || !state.order.length || stick ? 'none' : 'flex';
}

function resetConversationScroll() {
  if(state.anchorStop)state.anchorStop();
  clearTimeout(scrollDown._t);
  stick=true;
  $('main').scrollTop=0;
  updateJump();
}

function initScrollWatch() {
  var m = $('main');
  var b = document.createElement('button');
  b.id = 'jump';
  b.textContent = t('↓ 最新');
  b.style.cssText = [
    'position:fixed', 'right:14px', 'bottom:calc(104px + var(--safe-b))',
    'z-index:12', 'display:none', 'align-items:center', 'gap:5px',
    'padding:8px 14px', 'border-radius:999px', 'font-size:12.5px',
    'background:var(--accent2)', 'color:#fff', 'font-weight:600',
    'box-shadow:0 4px 16px #0008', 'border:0'
  ].join(';');
  b.onclick = function () { stick = true; toBottom(true); };
  document.body.appendChild(b);

  m.addEventListener('scroll', function () {
    var was = stick;
    stick = nearBottom();
    if (was !== stick) updateJump();

    // 滑到接近顶部就自动加载更早的内容 —— 分会话不用点「加载更多」，
    // 一直往上滑就行。这正是大会话该有的手感。
    if (m.scrollTop < 220) loadOlder();
  }, { passive: true });

  // 使用者自己动了就停止「正在对位」的那串定时器，
  // 否则翻完历史一往下滑就会被拽回去。
  ['touchstart', 'wheel', 'pointerdown', 'keydown'].forEach(function (ev) {
    m.addEventListener(ev, function () {
      if (state.anchorStop) state.anchorStop();
    }, { passive: true });
  });
}

// ── WebSocket ────────────────────────────────────────────────────────────────
function connect() {
  if(state.handoffPaused)return;
  if (!window.__dshE2eeSecret && !plainLocalOrigin()) {
    setConn('bad', '连不上');
    toast(t('隧道地址缺少加密密钥，请用完整的手机地址重新打开。'));
    return;
  }
  var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  var ws;
  try { ws = new WebSocket(proto + '//' + location.host + '/codex/ws'); }
  catch (e) { setConn('bad', '连不上'); return; }
  state.ws = ws;

  ws.onopen = function () {
    if(state.ws !== ws)return;
    setConn('wait', t('握手中'));
    state.retry = 0;
    call('initialize', { clientInfo: { name: 'pocket-bridge-gw', version: '1.1.0' }, capabilities: { experimentalApi: true } })
      .then(function () {
        ws.send(JSON.stringify({jsonrpc:'2.0',method:'initialized',params:{}}));
        state.ready = true;
        setConn('ok', '桥已连接');
        loadModels();
        loadCollaborationModes();
        loadAccount();
        if (state.view === 'list') loadThreads();
        else { renderFooter(); startObserving(); }
      })
      .catch(function (e) { setConn('bad', '握手失败'); toast(t('初始化失败：') + e.message); });
  };

  ws.onmessage = function (ev) {
    if(state.ws !== ws)return;
    var m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }

    // 先判有没有 method —— 顺序很关键。
    //
    // 回执只有 id + result/error，**没有 method**；请求和通知都有 method。
    // 原来先判 `state.pending[m.id]`，而服务端发来的请求 id 和我们自己发的请求 id
    // 是两套独立的编号空间，一旦撞号，审批请求就会被当成「我自己那个请求的回执」
    // 消化掉 —— 现象正是「审批请求根本看不到」，而且不报任何错、不留任何痕迹。
    if (m.method) {
      if (m.id !== undefined) onServerRequest(m);   // 服务端反过来请求我们（审批、提问）
      else onNotify(m.method, m.params || {});      // 通知
      return;
    }

    // 我们自己发出去的请求的回执
    if (m.id !== undefined && state.pending[m.id]) {
      var p = state.pending[m.id];
      delete state.pending[m.id];
      if (m.error) p.reject(new Error(m.error.message || JSON.stringify(m.error)));
      else p.resolve(m.result);
    }
  };

  ws.onclose = function () {
    if (state.ws !== ws) return;
    state.ready = false;
    state.handingBack = null;
    resumeSubscription = null;
    state.resumed = false;      // 连接断了，写权限也没了，下次发之前要重新加载
    setConn('bad', t('已断开'));
    stopObserving();
    Object.keys(state.approvals).forEach(function(id) {
      var rec=state.approvals[id]; if(rec && rec.el)rec.el.remove();
    });
    state.approvals = {};
    Object.keys(state.pending).forEach(function(id) { state.pending[id].reject(new Error(t('连接中断'))); delete state.pending[id]; });
    renderFooter();
    if(state.handoffPaused)return;
    var wait = Math.min(1000 * Math.pow(1.6, state.retry++), 15000);
    setTimeout(connect, wait);
  };
  ws.onerror = function () { if(state.ws === ws){setConn('bad', t('连接出错'));renderTaskStatus();} };
}

function restorePhoneConnection() {
  if(!state.handoffPaused)return;
  state.handoffPaused=false;
  state.handingBack=null;
  // This only restores the observer socket. Explicitly handed-back threads
  // keep their markers; do not resume a writer, send a draft or enable a queue.
  renderFooter();
  connect();
}

/**
 * 发一个 JSON-RPC 请求。
 *
 * 第三个参数是超时。**它必须真的用上** —— 原来签名里没有它，
 * 于是 resume 时写的 300000 被默默忽略、一律按 30 秒算：
 * 大会话加载要几分钟，必然超时，表现就是「发不出消息」。
 * 这种「参数写了但没接」的错最阴：调用处看着完全正确。
 */
function call(method, params, timeoutMs) {
  return new Promise(function (resolve, reject) {
    if(state.handingBack && /^(thread\/(start|fork|resume)|turn\/(start|steer))$/.test(method)) { reject(new Error(t('正在检查交还，请稍候再操作。'))); return; }
    if (!state.ws || state.ws.readyState !== 1) { reject(new Error(t('连接没就绪'))); return; }
    var id = state.nextId++;
    state.pending[id] = { resolve: resolve, reject: reject, method: method };
    state.ws.send(JSON.stringify({ jsonrpc: '2.0', id: id, method: method, params: params || {} }));
    setTimeout(function () {
      if (state.pending[id]) { delete state.pending[id]; reject(new Error(t('{method} 超时', {method:method}))); }
    }, timeoutMs || 30000);
  });
}

/** 应答服务端发来的请求 */
function reply(id, result, error) {
  if (!state.ws || state.ws.readyState !== 1) { toast(t('连接已断开，请等重连后再处理')); return false; }
  var msg = { jsonrpc: '2.0', id: id };
  if (error) msg.error = { code: -32603, message: String(error) };
  else msg.result = result;
  try { state.ws.send(JSON.stringify(msg)); return true; }
  catch (e) { toast(t('连接已断开，请等重连后再处理')); return false; }
}

// ── 服务端请求：审批 ─────────────────────────────────────────────────────────
function onServerRequest(m) {
  var p = m.params || {};
  if (state.thread && (p.threadId || p.conversationId) === state.thread.id) {
    activityVersion++;
    if (/requestUserInput|elicitation/.test(m.method)) setTask('waitingInput',t('请回答下面的问题。'));
    else if (/Approval/.test(m.method)) setTask('waitingApproval',t('请处理下面的审批请求。'));
  }

  if (m.method === 'item/commandExecution/requestApproval' ||
      m.method === 'item/fileChange/requestApproval') {
    showApproval({
      id: m.id, method: m.method,
      kind: m.method.indexOf('fileChange') >= 0 ? t('文件改动') : t('执行命令'),
      // v2 的两个接口要的是 accept / acceptForSession / decline / cancel
      style: 'v2',
      title: p.networkApprovalContext ? t('请求网络访问') : m.method.indexOf('fileChange') >= 0 ? t('要改文件') : t('要执行命令'),
      availableDecisions: p.availableDecisions, network: p.networkApprovalContext,
      additionalPermissions: p.additionalPermissions,
      command: p.command || '',
      cwd: p.cwd || (p.grantRoot ? t('写入目录：') + p.grantRoot : ''),
      reason: p.reason || (p.grantRoot ? t('请求写入权限：') + p.grantRoot : ''),
      threadId: p.threadId, turnId: p.turnId
    });
    return;
  }

  // 老接口
  if (m.method === 'execCommandApproval' || m.method === 'applyPatchApproval') {
    var isPatch = m.method === 'applyPatchApproval';
    var cmd = isPatch ? Object.keys(p.fileChanges || {}).join('\n') : (p.command || []).join(' ');
    showApproval({
      id: m.id, method: m.method, style: 'legacy',
      kind: isPatch ? t('文件改动') : t('执行命令'),
      title: isPatch ? t('要改文件') : t('要执行命令'),
      command: cmd, cwd: p.cwd || '',
      reason: p.reason || (p.grantRoot ? t('请求写入权限：') + p.grantRoot : ''),
      threadId: p.conversationId
    });
    return;
  }

  if (m.method === 'item/tool/requestUserInput') {
    showQuestions(m.id, p);
    return;
  }

  if (m.method === 'item/permissions/requestApproval') {
    showApproval({
      id: m.id, method: m.method, style: 'perm',
      kind: t('权限'), title: t('请求额外权限'),
      command: JSON.stringify(p.permissions || {}, null, 2),
      permissions: p.permissions || {},
      cwd: p.cwd || '', reason: p.reason || '',
      threadId: p.threadId, turnId: p.turnId
    });
    return;
  }

  if (m.method === 'mcpServer/elicitation/request') { showElicitation(m.id,p); return; }

  // 不认识的：如实告诉使用者，并且回一个错误，别让对面干等
  console.log('[codex] 没处理的服务端请求:', m.method, p);
  reply(m.id, null, t('手机端暂不支持这个请求：') + m.method);
  toast(t('Codex 发来一个手机端还不支持的请求：') + m.method);
}

function showApproval(o) {
  if (state.approvals[o.id]) return;

  var el = document.createElement('div');
  el.className = 'appr';
  state.approvals[o.id] = {el:el,threadId:o.threadId || (state.thread && state.thread.id)};
  el.innerHTML =
    '<div class="h">Codex ' + esc(o.title) + '</div>' +
    (o.threadId ? '<div class="w">' + esc(t('会话：') + ' ' + o.threadId) + '</div>' : '') +
    (o.network ? '<div class="c">' + esc(o.network.protocol + '://' + o.network.host) + '</div>' : '') +
    (o.additionalPermissions ? '<div class="c">' + esc(t('请求的额外权限：') + '\n' + JSON.stringify(o.additionalPermissions,null,2)) + '</div>' : '') +
    (o.command ? '<div class="c">' + esc(o.command) + '</div>' : '') +
    (o.cwd ? '<div class="w">' + esc(o.cwd) + '</div>' : '') +
    (o.reason ? '<div class="w">' + esc(o.reason) + '</div>' : '') +
    '<div class="btns"></div>';

  var btns = el.querySelector('.btns');

// ── 通知 ─────────────────────────────────────────────────────────────────────
function onNotify(method, p) {
  if(p.threadId && detachedHandbacks[p.threadId] &&
     (method==='turn/completed'||method==='turn/started'))scheduleDetachedHandback(p.threadId);
  if(method === 'serverRequest/resolved') {
    var resolved = state.approvals[p.requestId];
    if(resolved && resolved.el)resolved.el.remove();
    delete state.approvals[p.requestId];
  }
  if (!state.thread || state.view !== 'thread' || (p.threadId && p.threadId !== state.thread.id)) return;
  activityVersion++;

  switch (method) {
    case 'serverRequest/resolved':
      var request = state.approvals[p.requestId];
      if(request && request.el)request.el.remove();
      delete state.approvals[p.requestId];
      refreshObservedThread();
      break;
    case 'thread/status/changed':
      if (statusKind(p.status) === 'active' || statusKind(p.status) === 'systemError') applyObservedStatus({status:p.status},null);
      else refreshObservedThread();
      break;
    case 'turn/started':
      state.awaitingFirstTurn = false;
      task.activity = '';
      state.running = true; state.turnId = (p.turn && p.turn.id) || null;
      setTask('running',t('任务已开始，正在接收进度。'));
      renderFooter(); break;

    case 'turn/completed':
      state.running = false; state.turnId = null;
      var ended = p.turn && p.turn.status;
      setTask(ended === 'failed' ? 'failed' : ended === 'interrupted' ? 'interrupted' : ended === 'completed' ? 'completed' : 'unknown',
        ended === 'completed' ? t('最近一轮任务已完成。') : t('请查看最近的任务结果。'));
      Object.keys(state.items).forEach(function (k) {
        if (state.items[k].el) {
          var c = state.items[k].el.querySelector('.cursor');
          if (c) c.classList.remove('cursor');
        }
      });
      renderFooter();
      // Allow a brief follow-up, then give desktop the writer back.
      scheduleRelease();
      break;

    case 'item/started':
      if (p.item) { upsertItem(p.item); noteActivity(p.item,p.turnId); setTask(p.item.type === 'reasoning' ? 'thinking' : 'running',t('正在接收最新进度。')); } break;

    case 'item/completed':
      if (p.item) { upsertItem(p.item, true); noteActivity(p.item,p.turnId); renderTaskStatus(); } break;

    case 'item/agentMessage/delta':
      appendDelta(p.itemId, p.delta, 'text'); break;

    case 'item/reasoning/summaryTextDelta':
      appendDelta(p.itemId, p.delta, 'think', p.summaryIndex); break;

    case 'item/reasoning/summaryPartAdded':
      break;

    case 'item/commandExecution/outputDelta':
    case 'item/fileChange/outputDelta':
      appendDelta(p.itemId, p.delta, 'out'); break;

    case 'turn/plan/updated':
      renderPlan(p.plan || [], p.turnId); break;

    case 'thread/name/updated':
      if (state.thread && p.name) { state.thread.name = p.name; $('title').textContent = p.name; }
      break;

    case 'error':
      addError(p.message || p.error || JSON.stringify(p)); break;

    default:
      break;
  }
}

/** 把增量接到对应的 item 上 —— 每个 delta 都带 itemId，所以能精确落到那一条 */
/**
 * 正文渲染的长度上限。
 *
 * 命令输出动辄几 MB（构建日志、目录遍历），整段塞进 DOM 会让页面直接卡死 ——
 * 手机上尤其明显。超长的只留头尾，中间标明省略了多少 ——
 * 想看全文可以去电脑上翻，手机上要的是「知道它跑了什么、结果大概是什么」。
 */
var MAX_OUT = 24000;
var MAX_TEXT = 48000;
var MAX_THINK = 16000;

function clip(text, max) {
  var s = String(text == null ? '' : text);
  if (s.length <= max) return { text: s, clipped: 0 };
  var head = Math.floor(max * 0.7), tail = max - head;
  return {
    text: s.slice(0, head) + '\n\n' + t('…… 省略 {n} 个字符 ……', {n: s.length - max}) + '\n\n' + s.slice(-tail),
    clipped: s.length - max
  };
}

/**
 * 把流式增量攒到下一帧再渲染。
 *
 * 原来每来一个 token 就把整条消息重新跑一遍 markdown 解析，消息越长越慢 ——
 * 一篇长回复写到最后，每个字都要重解析几万字，这就是「卡到没法对话」的来源。
 * 改成每帧最多渲染一次：视觉上完全看不出差别，开销降一两个数量级。
 */
function schedulePaint(rec) {
  if (rec._paint) return;
  var raf = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
  rec._paint = raf(function () {
    rec._paint = null;
    var bb = rec.el && rec.el.querySelector('.bub');
    if (!bb) return;
    var c = clip(rec.acc, MAX_TEXT);
    bb.innerHTML = fmt(c.text) + (c.clipped ? '<div class="clipped">' + t('已省略 {n} 字', {n:c.clipped}) + '</div>' : '');
    bb.classList.add('cursor');
    scrollDown();
  });
}

function appendDelta(itemId, delta, kind, summaryIndex) {
  if (!itemId || !delta) return;
  var rec = state.items[itemId];
  if (!rec) {
    // 还没见过这个 item（列表是分页拉的），先建一个占位，等 item/completed 补全
    rec = state.items[itemId] = { item: { id: itemId, type: kind === 'think' ? 'reasoning' : 'agentMessage' },
      acc: '', created: false };
    state.order.push(itemId);
    rec.el = buildItem(rec.item, rec);
    $('body').appendChild(rec.el);
  }

  if (kind === 'think') {
    if (!rec.summaryParts) rec.summaryParts = {};
    var part = summaryIndex == null ? 0 : summaryIndex;
    rec.summaryParts[part] = (rec.summaryParts[part] || '') + delta;
    rec.thinkText = Object.keys(rec.summaryParts).sort(function(a,b){return Number(a)-Number(b);}).map(function(k){return rec.summaryParts[k];}).join('\n\n');
    if (!rec.el || !rec.el.isConnected) {
      rec.el = buildReasoning(rec.item, rec);
      $('body').appendChild(rec.el);
    }
    rec.el.style.display = '';
    delete rec.el.dataset.empty;
    rec.el.open = true;
    task.activity = t('思考摘要：') + rec.thinkText.replace(/\*\*/g,'').slice(-180);
    setTask('thinking',t('正在接收思考摘要。'));
    if (rec._tpaint) return;
    var raf1 = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    rec._tpaint = raf1(function () {
      rec._tpaint = null;
      var tb = rec.el && rec.el.querySelector('.body');
      if (tb) tb.textContent = clip(rec.thinkText, MAX_THINK).text;
      scrollDown();
    });
  } else if (kind === 'out') {
    rec.outText = (rec.outText || '') + delta;
    if (rec._opaint) return;
    var raf2 = window.requestAnimationFrame || function (f) { return setTimeout(f, 16); };
    rec._opaint = raf2(function () {
      rec._opaint = null;
      var ob = rec.el && rec.el.querySelector('.out');
      if (!ob) return;
      var c = clip(rec.outText, MAX_OUT);
      ob.textContent = c.text + (c.clipped ? '\n\n' + t('…… 已省略 {n} 个字符 ……', {n:c.clipped}) : '');
      // 输出流着的时候别自动展开 —— 几 MB 的内容展开会直接把页面拖住。
      // 想看就点一下标题栏。
    });
  } else {
    rec.acc = (rec.acc || '') + delta;
    schedulePaint(rec);
  }
}

// ── item 渲染 ────────────────────────────────────────────────────────────────
/**
 * 一个 item 一个 DOM 节点，按 id 索引。
 * 这样 item/started、delta、item/completed 都会落到同一个节点上 ——
 * 之前是「一个流式节点」，一个回合里出现两条消息就会串在一起。
 */
function upsertItem(item, isComplete) {
  if (!item || !item.id) return;
  Array.prototype.forEach.call($('body').querySelectorAll('.empty,.skel'),function(n){n.remove();});
  var rec = state.items[item.id];
  if (!rec) {
    // ★ 服务端把「我刚发的那条」回推上来了 —— 它多半和本地先画的那条是同一句话。
    //
    //   回显曾导致一条发送内容出现两次。
    //   原因就是这个：addLocalUser() 先画了一条占位（local-<时间戳>），
    //   服务端随后回推真正的 item（另一个 id），而**没有任何代码把两者对上** ——
    //   于是同一句话画两遍。原来这里还写着「它马上会被服务端的回推顶掉」，
    //   但「顶掉」那件事从来没有被实现过（注释骗了我们自己一轮）。
    //
    //   现在：把先画的那条**改名**成服务端的 id、节点留在原位（不闪、不跳），
    //   内容用服务端那份重建（附件、图片都在里面）。
    if (item.type === 'userMessage') {
      var ph = takePendingLocal(userTextOf(item),item.clientId);
      if (ph) {
        var old = state.items[ph.id];
        delete state.items[ph.id];
        rec = state.items[item.id] = { item: item, acc: '', created: false };
        var at = state.order.indexOf(ph.id);
        if (at >= 0) state.order[at] = item.id; else state.order.push(item.id);
        var node = buildItem(item, rec);
        if (old && old.el && old.el.isConnected) old.el.replaceWith(node);
        else $('body').appendChild(node);
        rec.el = node;
        tidySoon();
        scrollDown();
        return;
      }
    }
    rec = state.items[item.id] = { item: item, acc: '', created: false };
    state.order.push(item.id);
    rec.el = buildItem(item, rec);
    $('body').appendChild(rec.el);
    tidySoon();
    scrollDown();
    return;
  }

  rec.item = item;
  if (isComplete && item.type === 'reasoning' && Array.isArray(item.summary) && item.summary.length) {
    rec.thinkText = ''; rec.summaryParts = null;
  }
  if (isComplete && item.type === 'agentMessage' && typeof item.text === 'string') rec.acc = item.text;
  // 流式过程中这个 item 的正文已经一条条拼出来了，完成时再整块重建一次是浪费 ——
  // 只有在我们手上没有内容（比如断线重连后补推）时才需要重建。
  var haveText = rec.acc && rec.acc.length >= String(item.text || '').length;
  if (!isComplete && haveText && item.type === 'agentMessage') {
    tidySoon();
    return;
  }

  var fresh = buildItem(item, rec);
  if (rec.el && rec.el.open) fresh.open = true;
  if (rec.el && rec.el.isConnected) rec.el.replaceWith(fresh);
  else $('body').appendChild(fresh);
  rec.el = fresh;
  tidySoon();
  scrollDown();
}

/**
 * 合并思考块是有必要的（一条会话里可能几十个），但它要遍历整个列表 ——
 * 流式过程中每个 item 完成都跑一遍，列表越长越慢。
 * 攒一下再跑：视觉上没差别，开销从「每次」变成「每 300ms 最多一次」。
 */
var tidyTimer = null;
function tidySoon() {
  clearTimeout(tidyTimer);
  tidyTimer = setTimeout(tidyItems, 300);
}

function buildItem(item, rec) {
  switch (item.type) {
    case 'userMessage': return buildUser(item);
    case 'agentMessage': return buildAgent(item, rec);
    case 'reasoning': return buildReasoning(item, rec);
    case 'commandExecution': return buildCommand(item, rec);
    case 'fileChange': return buildFileChange(item);
    case 'plan': return buildPlanItem(item);
    case 'mcpToolCall': case 'dynamicToolCall': case 'functionCallOutput':
      return buildToolCall(item);
    case 'webSearch': return buildWebSearch(item);
    case 'subAgentActivity': return buildSubAgent(item);
    case 'collabAgentToolCall': return buildCollab(item);
    case 'imageView': return buildImage(item.path);
    case 'imageGeneration':
      return buildImage(item.savedPath || (item.result && item.result.path));
    case 'contextCompaction':
      return buildNote(t('上下文已压缩'));
    case 'enteredReviewMode': case 'exitedReviewMode':
      return buildNote(t('评审模式：') + JSON.stringify(item.review || {}).slice(0, 80));
    case 'hookPrompt':
      return buildNote(t('hook：') + (item.fragments || []).map(function (f) { return f.text || ''; }).join(' ').slice(0, 120));
    default:
      return buildNote(asText(item.type) + (item.text != null ? t('：') + asText(item.text) : ''));
  }
}

function el(cls, html) {
  var d = document.createElement('div');
  d.className = cls;
  if (html != null) d.innerHTML = html;
  return d;
}

function bridgeUploadedFiles(item) {
  var raw=userTextOf(item),marker='用户上传的文件（已保存在电脑上，请按需读取）：\n';
  var at=raw.lastIndexOf(marker);
  if(at<0 || (at>0 && raw.slice(at-2,at)!=='\n\n'))return null;
  var lines=raw.slice(at+marker.length).trim().split('\n');
  if(!lines.length || lines.length>5)return null;
  var files=[];
  try { lines.forEach(function(line){
    var file=JSON.parse(line),keys=Object.keys(file||{}).sort().join(',');
    if(keys!=='name,path'||typeof file.name!=='string'||typeof file.path!=='string'||!file.name||/[\u0000-\u001f\\/]/.test(file.name)||
       !/^(?:[A-Za-z]:[\\/]|\/|\\\\)/.test(file.path)||!/[\\/]+uploads[\\/]+codex[\\/]+[a-f0-9-]{16,}[\\/]+[^\\/]+$/i.test(file.path)||baseName(file.path)!==file.name)throw Error('shape');
    files.push(file);
  }); } catch(e) {return null;}
  // Recognize our own submissions, never turn arbitrary pasted JSON into files.
  var ours=/^pocket-bridge-upload-/.test(item.clientId||'') || files.every(function(file){return state.uploadedFiles && state.uploadedFiles[file.path]===file.name;});
  // Older bridge messages had no client ID. The strict marker and upload-path
  // shape are recognizable, but keep their original note available to inspect.
  return {text:raw.slice(0,at).trimEnd(),files:files,legacy:!ours,original:raw.slice(at)};
}
function uploadedFileButtonHtml(file) {
  return '<button type="button" class="filecite" data-filecite="'+esc(file.path)+'">'+esc(file.name)+'<span class="fc-go">'+esc(t('打开文件'))+'</span></button>';
}
function buildUser(item) {
  var txt = (item.content || []).map(function (c) { return asText(c.text); }).join('');
  var uploads=bridgeUploadedFiles(item);if(uploads)txt=uploads.text;
  var node=el('msg user', '<div class="who">' + t('你') + '</div><div class="bub">' + fmt(txt) + '</div>');
  if(uploads){var chips=document.createElement('div');chips.className='uploaded-files';chips.innerHTML=uploads.files.map(uploadedFileButtonHtml).join('');node.appendChild(chips);}
  if(uploads && uploads.legacy){var original=document.createElement('details');original.className='tool';original.innerHTML='<summary>'+esc(t('查看原始附件说明'))+'</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(uploads.original)+'</pre>';node.appendChild(original);}
  (item.content||[]).forEach(function(c){
    if(c.type==='localImage' && c.path)node.appendChild(buildImageView(c.path));
    else if(c.type==='image' && /^data:image\/(png|jpeg|gif|webp);base64,/.test(c.url||'')){
      var img=document.createElement('img');img.src=c.url;img.alt=t('上传的图片');img.style.cssText='max-width:100%;max-height:240px;border-radius:10px';node.appendChild(img);
    }
  });
  return node;
}

/**
 * 把「本该是字符串、实际可能是对象/数组」的字段读成人话。
 *
 * 为什么需要：对象字段被直接转成字符串时会显示「[object Object]」。
 * 服务端某个字段是对象或 {text:…} 数组，而渲染时直接字符串拼接。
 * 认不出来时显示 JSON（有上限）—— 让人看得出这是什么、能反馈，
 * 也比一串 [object Object] 强。
 */
function asText(v) {
  if (v == null) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (Array.isArray(v)) return v.map(asText).filter(Boolean).join('\n');
  if (typeof v === 'object') {
    var keys = ['text', 'content', 'value', 'message', 'output', 'delta', 'summary'];
    for (var i = 0; i < keys.length; i++) {
      if (v[keys[i]] != null) { var t2 = asText(v[keys[i]]); if (t2) return t2; }
    }
    try { return JSON.stringify(v).slice(0, 2000); } catch (e) { return String(v); }
  }
  return String(v);
}

function buildAgent(item, rec) {
  var txt = asText(item.text) || rec.acc || '';
  var c = clip(txt, MAX_TEXT);
  return el('msg agent', '<div class="who">Codex</div><div class="bub">' + fmt(c.text) +
    (c.clipped ? '<div class="clipped">' + t('已省略 {n} 字', {n:c.clipped}) + '</div>' : '') + '</div>');
}

/**
 * reasoning 的正文取法。
 *
 * 这里踩过一个坑：`summary` 和 `content` 是**字符串数组**（`["**Planning…**"]`），
 * 不是对象数组。原来按 `s.text` 读，结果全是 undefined —— 界面上一排排
 * 「思考过程」点开都是空的，看着像没数据，其实是读错了字段。
 * 两种形态都兜住，免得服务端哪版改了又白屏。
 */
function reasoningText(item, rec) {
  if (rec && rec.thinkText) return rec.thinkText;
  var pick = function (arr) {
    if (!Array.isArray(arr)) return '';
    return arr.map(function (x) {
      if (typeof x === 'string') return x;
      if (x && typeof x === 'object') return x.text || x.summary || '';
      return '';
    }).filter(Boolean).join('\n\n');
  };
  return pick(item.summary);
}

function buildReasoning(item, rec) {
  var body = reasoningText(item, rec);
  var d = document.createElement('details');
  d.className = 'think';
  // 空的不占位置。实际数据里 reasoning 条目可能比消息还多，而多数没有正文
  // （历史里的思考摘要本来就不一定留）。每个都渲染一个空折叠块的话，
  // 一屏全是「思考过程」，正经内容反而找不着。
  if (!String(body || '').trim()) { d.style.display = 'none'; d.dataset.empty = '1'; }
  d.open = !!body && state.running;
  d.innerHTML = '<summary>' + t('思考摘要') + '</summary><div class="body">' + esc(body || '') + '</div>';
  return d;
}

/**
 * 整理一下渲染出来的条目：
 *   1. 把空的思考块**从 DOM 里去掉**（不是隐藏）—— 隐藏的节点仍然夹在中间，
 *      会把本该合并的思考块隔开，还会让相邻判断失效
 *   2. 把挨着的思考块合成一个
 *
 * 实测一条会话里 reasoning 条目能到 46 个（比消息还多），而多数没有正文。
 * 电脑版上这些收在一条时间线里，手机屏幕更小，更得收拾干净。
 * 只合并**相邻**的 —— 中间隔了别的操作就说明是两段独立的思考。
 */
function tidyItems() {
  // Keep one connected node per item ID: deltas may arrive after an empty start.
  // Merging/removing indexed nodes sends later deltas into detached DOM nodes.
  Object.keys(state.items).forEach(function(id) {
    var rec = state.items[id];
    if (rec.item.type !== 'reasoning' || !rec.el) return;
    var empty = !reasoningText(rec.item,rec).trim();
    rec.el.style.display = empty ? 'none' : '';
    if (empty) rec.el.dataset.empty = '1'; else delete rec.el.dataset.empty;
  });
}

function buildCommand(item, rec) {
  var raw = item.aggregatedOutput || rec.outText || '';
  var c = clip(raw, MAX_OUT);
  var out = c.text + (c.clipped ? '\n\n' + t('…… 已省略 {n} 个字符 ……', {n:c.clipped}) : '');
  var cmd = Array.isArray(item.command) ? item.command.join(' ') : (item.command || '');
  // 命令往往是一长串绝对路径 + 参数（实测开头就是 pwsh.exe 的完整路径），
  // 手机上直接铺开会把关键部分挤出屏幕，所以显示时掐掉目录前缀
  var shown = cmd.replace(/^"[^"]*[\\/]([^\\/"]+)"\s*/, '$1 ').trim();
  var exit = item.exitCode;
  var badge = '';
  if (exit !== undefined && exit !== null) {
    badge = '<span class="badge ' + (exit === 0 ? 'ok' : 'bad') + '">' +
      (exit === 0 ? t('成功') : t('退出 {code}', {code: exit})) + '</span>';
  } else if (item.status) {
    badge = '<span class="badge ' + (/complete|success/i.test(item.status) ? 'ok' : '') + '">' +
      esc(item.status) + '</span>';
  }
  var dur = item.durationMs ? '<span class="badge">' + Math.round(item.durationMs / 100) / 10 + 's</span>' : '';

  var d = document.createElement('details');
  d.className = 'tool trace';
  d.innerHTML =
    '<summary><span class="kind">' + t('命令') + '</span>' +
    '<span class="head">' + esc(shown) + '</span>' + dur + badge + '</summary>' +
    '<pre class="out">' + esc(out) + '</pre>';
  return d;
}

function buildFileChange(item) {
  var changes = item.changes || item.fileChanges || {};
  var list = Array.isArray(changes) ? changes : Object.keys(changes).map(function (k) {
    var v = changes[k];
    return { path: k, kind: (v && (v.type || v.kind)) || 'update' };
  });

  // 改动的文件也能点开看 —— 光看「改了 21 个文件」还是不知道做得对不对
  var box = document.createElement('div');
  var sum = '<div class="toolhd"><span class="kind">' + t('文件') + '</span>' +
    '<span class="head">' + t('{n} 个文件有改动', {n:list.length}) + '</span>' +
    (item.status ? '<span class="badge' + (item.status === 'completed' ? ' ok' : '') + '">' +
      esc(item.status) + '</span>' : '') + '</div>';
  box.innerHTML = sum;

  // 有图片产出就先把图摆出来（一眼就能判断方向）
  var imgs = list.filter(function (c) { return IMG_RE.test(c.path || c.file || ''); });
  imgs.slice(0, 6).forEach(function (c) {
    box.appendChild(buildImageView(c.path || c.file));
  });

  var rest = list.filter(function (c) { return imgs.indexOf(c) < 0; });
  if (rest.length) {
    var det = document.createElement('details');
    det.className = 'tool';
    det.style.marginTop = '8px';
    det.innerHTML = '<summary><span class="kind">' + t('其他') + '</span>' +
      '<span class="head">' + t('{n} 个文件', {n:rest.length}) + '</span></summary>';
    var wrap = document.createElement('div');
    wrap.style.padding = '0 10px 10px';
    rest.slice(0, 40).forEach(function (c) {
      var kind = String(c.kind || c.type || 'update').toLowerCase();
      var mark = /add|create/.test(kind) ? '+' : (/del|remove/.test(kind) ? '−' : '±');
      wrap.appendChild(buildFileCard(c.path || c.file || '', mark));
    });
    det.appendChild(wrap);
    box.appendChild(det);
  }
  if (!list.length) box.innerHTML += '<div class="note" style="padding:8px 13px">' + t('（没有明细）') + '</div>';
  return box;
}

function buildPlanItem(item) {
  return el('', '<div class="plan"><div class="h">' + t('计划') + '</div><div>' +
    fmt(asText(item.text)) + '</div></div>');
}

function buildToolCall(item) {
  var name = item.name || item.tool || item.namespace || t('工具');
  var detail = '';
  try {
    detail = item.arguments ? JSON.stringify(item.arguments).slice(0, 100) : '';
  } catch (e) { }
  var out = item.output || (item.result ? JSON.stringify(item.result).slice(0, 400) : '') ||
    (item.error ? t('错误：') + item.error : '');
  var d = document.createElement('details');
  d.className = 'tool trace';
  d.innerHTML = '<summary><span class="kind">' + t('工具') + '</span>' +
    '<span class="head">' + esc(name + (detail ? '  ' + detail : '')) + '</span>' +
    (item.status ? '<span class="badge">' + esc(item.status) + '</span>' : '') + '</summary>' +
    '<pre class="out">' + esc(out) + '</pre>';
  return d;
}

/**
 * 文件在手机上的样子。
 *
 * 为什么要有这个：Codex 说「生成了 3 张图 / 改了这个文件」，而使用者只能看到
 * 一行路径文字 —— 看不到产出就没法判断方向对不对。
 *
 * 图片直接显示（这是最需要「看一眼」的）；pdf、word、文本走链接，
 * 交给浏览器自己处理：iOS/Android 的浏览器都能直接预览 pdf 和文本，
 * 我们没必要自己做一个查看器。
 */
function fileUrl(p, w) {
  if (!p) return '';
  // 不再带 root：允许读哪些目录由**服务端**自己决定。
  // 原来这里把会话的 cwd 传过去当「允许范围」，而服务端直接采信 ——
  // 等于让请求方自己划边界。实测带一个别的 root 就能读到 access-key.txt。
  // 服务端现在从它自己的会话缓存里取工作目录，这条参数已经没有任何作用。
  return '/codex/file?path=' + encodeURIComponent(p) + (w ? '&w=' + w : '');
}

function fileRequest(path, width) {
  // The relay may see URL paths and query strings. Keep computer paths inside
  // the encrypted POST body; the legacy GET is restricted to private LAN mode.
  if (window.__dshE2eeSecret) {
    var body = { path: path };
    if (width) body.w = width;
    return privateFetch('/codex/file', {
      method: 'POST', cache: 'no-store',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(response) {
      // A successful response must carry proof that the browser authenticated
      // and decrypted it. An unmarked 200 could be plaintext from a proxy.
      if (response.ok && (!response.headers || response.headers.get('x-dsh-e2ee-decrypted') !== '1')) {
        var failure = new Error(t('文件响应未通过加密校验，请刷新桥页面后重试。'));
        failure.code = 'file-e2ee-verification';
        throw failure;
      }
      return response;
    });
  }
  if (!plainLocalOrigin()) return Promise.reject(new Error(t('隧道地址缺少加密密钥，请用完整的手机地址重新打开。')));
  return privateFetch(fileUrl(path, width), { cache: 'no-store' });
}

// Only raster formats are previews. Active document formats are downloaded as
// inert files by the gateway, even when a tool labels them as an image.
var IMG_RE = /\.(png|jpe?g|gif|webp|bmp|ico)$/i;
var DOC_RE = /\.(pdf|docx?|xlsx?|pptx?|md|txt|json|csv|log|ya?ml|xml)$/i;

function fileIcon(p) {
  if (IMG_RE.test(p)) return '🖼';
  if (/\.pdf$/i.test(p)) return '📕';
  if (/\.(docx?|rtf)$/i.test(p)) return '📄';
  if (/\.(xlsx?|csv)$/i.test(p)) return '📊';
  if (/\.(pptx?)$/i.test(p)) return '📽';
  if (/\.(zip|7z|rar)$/i.test(p)) return '🗜';
  if (/\.(mp4|mov|webm)$/i.test(p)) return '🎬';
  return '📄';
}

/** 图片：直接显示出来，点一下看原图 */
/**
 * 取一个受保护的资源：加密开着就解密后再用。
 *
 * 图片不能靠 fetch 拦截解决 —— `<img src="...">` 是浏览器自己发的请求，
 * 拦不到。所以要显式取回来、解密、再塞成一个 blob 地址。
 * 失败就退回明文地址（电脑上没配密钥时本来就该走明文）。
 */
// Keep preview blob URLs alive while their images are visible (long-press/save
// still works), then release them when the images leave the document.
var imageBlobRecords = [];
var imageBlobObserver = null;
function releaseImageBlob(record) {
  var i = imageBlobRecords.indexOf(record);
  if (i < 0) return;
  imageBlobRecords.splice(i, 1);
  URL.revokeObjectURL(record.url);
  if (!imageBlobRecords.length && imageBlobObserver) {
    imageBlobObserver.disconnect();
    imageBlobObserver = null;
  }
}
function watchImageBlob(img, url) {
  var record = { img: img, url: url };
  imageBlobRecords.push(record);
  if (!imageBlobObserver && typeof MutationObserver !== 'undefined') {
    imageBlobObserver = new MutationObserver(function () {
      imageBlobRecords.slice().forEach(function (entry) {
        if (!entry.img.isConnected) releaseImageBlob(entry);
      });
    });
    imageBlobObserver.observe(document.body, { childList: true, subtree: true });
  }
  // Very old browsers without MutationObserver cannot track removal.
  if (!imageBlobObserver) setTimeout(function () { releaseImageBlob(record); }, 60000);
  return function () { releaseImageBlob(record); };
}

function buildImageView(p, caption) {
  if (p && !IMG_RE.test(p)) return buildFileCard(p, caption);
  var d = document.createElement('div');
  d.className = 'imgbox';
  if (!p) { d.innerHTML = '<div class="tool"><div style="padding:9px 13px">🖼 ' + t('（没有路径）') + '</div></div>'; return d; }

  d.innerHTML = '<div class="imgwrap"></div>' +
    '<div class="imgcap">' + fileIcon(p) + ' ' + esc(shortPath(p)) + '</div>';
  var wrap = d.querySelector('.imgwrap');

  // ★ 钥匙必须**每次现取**，不能在渲染这条消息时取一次就存住。
  //   实测踩过：这个值在页面很早期是空的（`e2ee.js` 把 `#k=` 解析出来
  //   要等一个 tick），而 `privateFetch` 有没有钥匙决定了走**加密**还是**明文** ——
  //   取早了就永远走明文，而网关对内容通道是「拒绝明文、不降级」的，
  //   于是图片一直是"没取回来"。使用者看到的就是「Codex 又打不开图片和文件了」。
  function e2eeSecret() {
    try { return window.__dshE2eeSecret || null; } catch (e) { return null; }
  }

  /** 取图。有钥匙就走加密那条（privateFetch 会带 x-dsh-e2ee，并且被拦了会补证重发）。 */
  function start() {
    var secret = e2eeSecret();
    if (!secret && !plainLocalOrigin()) {
        showNote(t('这台设备的地址里没有加密密钥，所以取不到图 —— 请用带 #k= 的完整地址重新打开。'), false);
        return;
    }
    showNote(t('正在取图：'), false);
    fileRequest(p, 900)
      .then(function (r) {
        if (!r.ok) {
          // 把状态码带出去：403 是"没带上钥匙/凭据"，404 是"文件真不在了"，
          // 两种的处理办法完全不同，含糊一句"没取回来"等于什么都没说。
          var e = new Error('HTTP ' + r.status);
          e.status = r.status;
          throw e;
        }
        return r.blob();
      })
      .then(function (b) {
        if (!d.isConnected) return;
        var url = URL.createObjectURL(b);
        wrap.innerHTML = '<a href="#" class="imgopen"><img alt="' + esc(caption || t('图片')) + '"></a>';
        var img = wrap.querySelector('img');
        var link = wrap.querySelector('a');
        var release = watchImageBlob(img, url);
        img.onerror = function () { release(); showNote(t('打不开这张图：'), true); };
        img.src = url;
        link.addEventListener('click', function (ev) { ev.preventDefault(); openFull(); });
      })
      .catch(function (e) {
        if (e && e.code === 'file-e2ee-verification') {
          showNote(e.message, true);
          return;
        }
        // ★ 这里**不要**自己偷偷重试。
        //
        //   原来我加过一次"失败后 1.2 秒自动再试一遍"，结果是：
        //   失败提示闪一下就被下一轮的"正在取图…"盖掉了 —— 使用者看到的
        //   永远是"正在取图"或者一闪而过，**根本读不到发生了什么**。
        //   （实测抓出来的：回归测试断言的就是最终那一屏文字。）
        //   要重试就让人点「重试」，那个按钮一直在。
        if (e && e.status === 403 && !e2eeSecret()) {
          // 地址不完整 —— 把原因直接说出来，别让人以为是文件坏了
          showNote(t('这台设备的地址里没有加密密钥，所以取不到图 —— 请用带 #k= 的完整地址重新打开。'), true);
          return;
        }
        // 把状态码也摆出来：403 和 404 的处理办法完全不同
        showNote(t('这张图没取回来：') + (e && e.status ? '(' + e.status + ') ' : ''), true);
      });
  }

  function showNote(msg, withRetry) {
    wrap.innerHTML = '<div class="tool"><div style="padding:9px 13px;font-size:12.5px;' +
      'color:var(--dim)">🖼 ' + esc(msg) + esc(shortPath(p)) +
      (withRetry ? ' · <a href="#" class="imgretry">' + esc(t('重试')) + '</a>' : '') +
      '</div></div>';
    var a = wrap.querySelector('.imgretry');
    if (a) a.addEventListener('click', function (ev) { ev.preventDefault(); start(); });
  }

  /** 点开看原图：也走加密，取回来开一个 blob */
  function openFull() {
    fileRequest(p)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
      .then(function (b) {
        var url = URL.createObjectURL(b);
        try { window.open(url, '_blank', 'noopener'); }
        finally { setTimeout(function () { URL.revokeObjectURL(url); }, 60000); }
      })
      .catch(function () { toast(t('原图没取回来，稍后再试')); });
  }

  start();
  return d;
}

/** 只要文件名那一段 —— 手机上全路径太长 */
function shortPath(p) {
  var s = String(p || '');
  var parts = s.split(/[\\/]/);
  return parts.length > 1 ? parts.slice(-2).join('/') : s;
}

/** 通用文件卡片：图标 + 名字 + 打开 */
function buildFileCard(p, note) {
  var d = document.createElement('button');
  d.className = 'filecard';
  d.type = 'button';
  d.setAttribute('data-filecite', p);
  d.title = p;
  d.innerHTML = '<span class="fi">' + fileIcon(p) + '</span>' +
    '<span class="fn">' + esc(shortPath(p)) + '</span>' +
    (note ? '<span class="fnote">' + esc(note) + '</span>' : '') +
    '<span class="fgo">' + t('打开') + ' ›</span>';
  return d;
}

function buildWebSearch(item) {
  var q = typeof item.query === 'string' ? item.query : JSON.stringify(item.query || '');
  var n = (item.results || []).length;
  var d = document.createElement('details');
  d.className = 'tool trace';
  var rows = (item.results || []).slice(0, 12).map(function (r) {
    var title = r.title || r.name || r.url || '';
    var url = r.url || '';
    return '<li>' + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' +
      esc(title) + '</a>' : esc(title)) + '</li>';
  }).join('');
  d.innerHTML = '<summary><span class="kind">' + t('搜索') + '</span>' +
    '<span class="head">' + esc(q) + '</span>' +
    (n ? '<span class="badge">' + t('{n} 条', {n:n}) + '</span>' : '') + '</summary>' +
    '<ul class="files">' + (rows || '<li>' + t('（没有结果明细）') + '</li>') + '</ul>';
  return d;
}

/** 子代理：Codex 会派好几个自己并行干活，电脑版上能看到它们各自的进展 */
function buildSubAgent(item) {
  var kind = item.kind || 'activity';
  var path = item.agentPath || item.agentThreadId || '';
  var label = /start/.test(kind) ? t('子代理启动')
    : /finish|complete|done/.test(kind) ? t('子代理完成')
    : /error|fail/.test(kind) ? t('子代理出错') : t('子代理');
  return el('', '<div class="tool"><div style="padding:9px 13px;font-size:12.5px;' +
    'color:#9a9aa4;display:flex;gap:9px"><span>🤖</span><span>' + esc(label) +
    (path ? '　<span style="color:#6a6a74;font-family:ui-monospace,monospace">' +
      esc(String(path).slice(-28)) + '</span>' : '') + '</span></div></div>');
}

/** 多个代理之间的协作调用 */
function buildCollab(item) {
  var tool = item.tool || 'collab';
  var prompt = item.prompt ? String(item.prompt).slice(0, 160) : '';

  // agentsStates 可能是数组也可能是对象（按代理 id 索引），两种都兜住 ——
  // 直接 .map 会在其中一种上抛异常，而且是在渲染中间抛，整条会话都出不来。
  var raw = item.agentsStates;
  var states = Array.isArray(raw) ? raw
    : (raw && typeof raw === 'object')
      ? Object.keys(raw).map(function (k) {
        var v = raw[k];
        return (v && typeof v === 'object') ? Object.assign({ id: k }, v) : { id: k, status: v };
      })
      : [];

  var rows = states.map(function (s) {
    return '<li><span class="st">·</span><span>' +
      esc(s.name || s.agentPath || s.threadId || s.id || '') +
      (s.status ? '　' + esc(String(s.status)) : '') + '</span></li>';
  }).join('');

  var d = document.createElement('details');
  d.className = 'tool trace';
  d.innerHTML = '<summary><span class="kind">' + t('协作') + '</span>' +
    '<span class="head">' + esc(tool + (prompt ? '　' + prompt : '')) + '</span>' +
    (item.status ? '<span class="badge">' + esc(item.status) + '</span>' : '') + '</summary>' +
    (rows ? '<ul class="files">' + rows + '</ul>' : '');
  return d;
}

function buildImage(path) {
  if (!path) return buildNote(t('图片'));
  // 图片直接显示出来 —— 这是最需要「看一眼」的产出
  return buildImageView(path);
}

function buildNote(text) {
  return el('', '<div class="tool"><div style="padding:9px 13px;font-size:12.5px;' +
    'color:#8e8e99">' + esc(text) + '</div></div>');
}

/**
 * 换了语言之后，把已经渲染出来的消息按新语言重画一遍。
 *
 * 为什么需要：消息列表是 JS 拼出来的（「你」「思考摘要」「命令」「成功」这些
 * 标签都在 JS 里），i18n.apply() 只认 data-i18n 属性，管不到它们。
 * item 数据本身没变，只是重新 buildItem 一次 —— 和 upsertItem 里
 * 「replaceWith 一个新节点」是同一个套路，所以连接关系不会丢。
 */
function rebuildItems() {
  if (state.view !== 'thread') return;
  var box = $('body');
  state.order.forEach(function (id) {
    var rec = state.items[id];
    // created=true 是 addLocalUser 先画出来的那条：正文在 rec.acc 里而不是
    // item.content 里，重画会把它画空，所以跳过。
    // ★ 注意：它**不是**「马上会被回推顶掉」—— 顶掉这件事是 upsertItem 里
    //   显式做的（用 takePendingLocal 配对，再把占位的 id 改名成服务端那条）。
    //   这句注释原来写的就是「马上会被服务端的回推顶掉」，而当时**没有那段代码** ——
    //   于是同一句话被画两遍。
    //   注释骗了自己一整轮，所以这里把「谁负责顶掉」写清楚。
    if (!rec || !rec.el || rec.created || !rec.item) return;
    var fresh = buildItem(rec.item, rec);
    if (rec.el.open) fresh.open = true;
    if (rec.el.isConnected) rec.el.replaceWith(fresh);
    else box.appendChild(fresh);
    rec.el = fresh;
  });
  var hint = document.getElementById('older-hint');
  if (hint) prependOlderHint();
  var jump = document.getElementById('jump');
  if (jump) jump.textContent = t('↓ 最新');
}

function addError(msg) {
  $('body').appendChild(el('msg err', '<div class="bub">' + esc(msg) + '</div>'));
  scrollDown();
}

function renderPlan(steps, turnId) {
  var old = document.getElementById('live-plan');
  if (old) old.remove();
  if (!steps.length) return;
  var rows = steps.map(function (s) {
    var st = String(s.status || '').toLowerCase();
    var mark = st === 'completed' ? '✓' : (st === 'inProgress' || st === 'in_progress' || st === 'started' ? '▸' : '○');
    var cls = st === 'completed' ? 'done' : (mark === '▸' ? 'doing' : '');
    return '<div class="s ' + cls + '"><span class="m">' + mark + '</span><span>' +
      esc(s.step || s.text || s.title || '') + '</span></div>';
  }).join('');
  var d = el('', '<div class="plan"><div class="h">' + t('进行中的计划') + '</div>' + rows + '</div>');
  d.id = 'live-plan';
  $('body').appendChild(d);
  scrollDown();
}

// ── 会话列表 ─────────────────────────────────────────────────────────────────
var THREAD_LIST_PAGE_SIZE = 60;
var threadListEpoch = 0;
var threadSearchEpoch = 0;
var threadSearchTimer = null;

function appendUniqueThreads(existing, rows) {
  var seen = Object.create(null);
  existing.forEach(function (th) { if (th && th.id) seen[th.id] = true; });
  var joined = existing.slice();
  (rows || []).forEach(function (th) {
    if (!th || !th.id || seen[th.id]) return;
    seen[th.id] = true;
    joined.push(th);
  });
  return joined;
}

function loadThreads() {
  var epoch = ++threadListEpoch;
  ++threadSearchEpoch;
  if (threadSearchTimer) { clearTimeout(threadSearchTimer); threadSearchTimer = null; }
  stopObserving();
  rememberTextDraft();
  // 离开会话时把写锁还回去 —— 不还的话，电脑上的 Codex 就再也打不开它了
  releaseThread();
  state.view = 'list';
  state.thread = null;
  updateLockHint();
  taskStatusExpanded = false;
  renderPendingApprovals();
  renderTaskStatus();
  state.items = {}; state.order = [];
  // 换会话时把「等回推的占位」也清掉：它们属于上一条会话，留着会认错人
  state.pendingLocal = [];
  $('title').textContent = 'Codex';
  $('back').style.display = 'none';
  $('footer').style.display = 'none';
  state.threads = [];
  state.listCursor = null; state.listReady = false; state.listPending = true;
  state.listError = ''; state.listMorePending = false;
  state.searchThreads = []; state.searchCursor = null;
  state.searchPending = false; state.searchReady = false;
  state.searchError = ''; state.searchMorePending = false;

  // 先把列表贴出来，再等服务端的新数据。
  //
  // 三层，按快慢排：
  //   1. 网关的预热缓存（/codex/threads）—— 电脑上一直在后台问，十几毫秒
  //   2. 浏览器 localStorage —— 上次访问留下的
  //   3. 直接问 app-server —— 8~10 秒（它得读每条会话的元数据，有几条是 GB 级的）
  //
  // 原来只有第 2 层，所以**冷启动（换浏览器、清了缓存）要等满 10 秒**。
  // 第 1 层是这一版加的：把「列会话」挪到电脑上做，手机上就不用等。
  var cached = readThreadCache();
  if (cached && cached.length) {
    state.threads = cached;
    state.projects = collectProjects(cached);
    renderThreads();
  } else {
    $('body').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  }

  // 第 1 层：问网关要预热好的列表（拿不到就安静地走下面那条）
  privateFetch('/codex/threads', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j || !j.ok || !j.list || !j.list.length) return;
      // The gateway cache only seeds the first screen. A late response must
      // never replace a paged list or a newer direct app-server response.
      if (epoch !== threadListEpoch || state.view !== 'list' || state.listReady) return;
      state.threads = j.list;
      state.projects = collectProjects(j.list);
      writeThreadCache(j.list);
      renderThreads();
    })
    .catch(function () { });

  call('thread/list', { limit: THREAD_LIST_PAGE_SIZE }).then(function (r) {
    if (epoch !== threadListEpoch || state.view !== 'list') return;
    state.listPending = false;
    state.listReady = true;
    state.listCursor = (r && r.nextCursor) || null;
    state.threads = (r && r.data) || [];
    state.projects = collectProjects(state.threads);
    writeThreadCache(state.threads);
    renderThreads();
  }).catch(function (e) {
    if (epoch !== threadListEpoch || state.view !== 'list') return;
    state.listPending = false;
    state.listError = e.message;
    // Keep the search box and retry control available even without a cache:
    // title search can still find an older conversation after list refresh fails.
    renderThreads();
    toast(t(state.threads.length ? '列表没能刷新：' : '读不到会话列表：') + e.message);
  });
  if (state.filter.trim()) scheduleThreadSearch();
}

var THREAD_CACHE_KEY = 'dsh-codex-threads-v1';

/** 上次拿到的会话列表 —— 用来先垫一下，别让屏幕空着 */
function readThreadCache() {
  try {
    var j = JSON.parse(localStorage.getItem(THREAD_CACHE_KEY) || 'null');
    // 超过一天就别用了：会话可能早被删了，贴出来反而误导
    if (!j || !j.at || Date.now() - j.at > 86400000) return null;
    return j.list || null;
  } catch (e) { return null; }
}

function writeThreadCache(list) {
  try {
    localStorage.setItem(THREAD_CACHE_KEY,
      JSON.stringify({ at: Date.now(), list: (list || []).slice(0, THREAD_LIST_PAGE_SIZE) }));
  } catch (e) { /* 存不下不影响功能 */ }
}

// Codex searches titles across the complete thread store. Preview text is not
// part of that API, so we also match previews in the pages already loaded.
function scheduleThreadSearch() {
  var epoch = ++threadSearchEpoch;
  if (threadSearchTimer) { clearTimeout(threadSearchTimer); threadSearchTimer = null; }
  var term = state.filter.trim();
  state.searchThreads = []; state.searchCursor = null;
  state.searchPending = !!term; state.searchReady = false;
  state.searchError = ''; state.searchMorePending = false;
  if (!term) return;
  threadSearchTimer = setTimeout(function () {
    threadSearchTimer = null;
    call('thread/list', { limit: THREAD_LIST_PAGE_SIZE, searchTerm: term }).then(function (r) {
      if (epoch !== threadSearchEpoch || state.view !== 'list') return;
      state.searchThreads = (r && r.data) || [];
      state.searchCursor = (r && r.nextCursor) || null;
      state.searchPending = false; state.searchReady = true;
      renderThreadListOnly();
    }).catch(function (e) {
      if (epoch !== threadSearchEpoch || state.view !== 'list') return;
      state.searchPending = false; state.searchError = e.message;
      renderThreadListOnly();
    });
  }, 320);
}

function loadOlderThreads() {
  if (state.view !== 'list') return;
  var term = state.filter.trim();
  var searching = !!term;
  var cursor = searching ? state.searchCursor : state.listCursor;
  if (!cursor || (searching ? state.searchMorePending : state.listMorePending)) return;
  var epoch = searching ? threadSearchEpoch : threadListEpoch;
  if (searching) state.searchMorePending = true;
  else state.listMorePending = true;
  renderThreadListOnly();
  var params = { limit: THREAD_LIST_PAGE_SIZE, cursor: cursor };
  if (searching) params.searchTerm = term;
  call('thread/list', params).then(function (r) {
    if (state.view !== 'list' || epoch !== (searching ? threadSearchEpoch : threadListEpoch)) return;
    var rows = (r && r.data) || [];
    var next = (r && r.nextCursor) || null;
    // A broken/repeated cursor must not trap the user in an endless load loop.
    if (!rows.length || next === cursor) next = null;
    if (searching) {
      state.searchThreads = appendUniqueThreads(state.searchThreads, rows);
      state.searchCursor = next;
      state.searchMorePending = false;
    } else {
      state.threads = appendUniqueThreads(state.threads, rows);
      state.listCursor = next;
      state.listMorePending = false;
      state.projects = collectProjects(state.threads);
    }
    renderThreadListOnly();
  }).catch(function (e) {
    if (state.view !== 'list' || epoch !== (searching ? threadSearchEpoch : threadListEpoch)) return;
    if (searching) state.searchMorePending = false;
    else state.listMorePending = false;
    renderThreadListOnly();
    toast(t('加载更早的会话失败：') + e.message);
  });
}

function renderThreads() {
  var box = $('body');
  var q = state.filter.trim().toLowerCase();
  var oldInput = document.getElementById('q');
  var keepFocus = oldInput && document.activeElement === oldInput;
  var caret = keepFocus ? oldInput.selectionStart : null;
  box.innerHTML = '';

  // 搜索框
  var s = document.createElement('div');
  s.className = 'search';
  s.innerHTML = '<span style="color:#6a6a74">🔍</span>' +
    '<input id="q" placeholder="' + t('搜会话') + '" value="' + esc(state.filter) + '">';
  box.appendChild(s);
  var qi = s.querySelector('#q');
  qi.oninput = function () {
    state.filter = qi.value;
    scheduleThreadSearch();
    renderThreadListOnly();
  };

  var nw = document.createElement('button');
  nw.className = 'btn p';
  nw.textContent = t('＋ 开一个新会话');
  // 必须包一层。直接写 `nw.onclick = newThread` 的话，点击事件会被当成
  // 第一个参数传进去 —— newThread(cwd) 收到一个 MouseEvent，于是把它塞进
  // params.cwd 发给服务端，报「invalid type: map, expected a string」。
  // 这个错到现在才被发现，是因为这个按钮平时没人点（都是从会话里开新的）。
  nw.onclick = function () { newThread(); };
  box.appendChild(nw);

  var listBox = document.createElement('div');
  listBox.id = 'thlist';
  box.appendChild(listBox);
  fillThreadList(listBox, q);
  if (keepFocus) {
    qi.focus({ preventScroll: true });
    if (caret !== null) qi.setSelectionRange(caret, caret);
  }
  if (window.DshI18n) window.DshI18n.apply(box);
}

function renderThreadListOnly() {
  var listBox = document.getElementById('thlist');
  if (!listBox) return;
  fillThreadList(listBox, state.filter.trim().toLowerCase());
}

function fillThreadList(box, q) {
  box.innerHTML = '';
  var local = state.threads.filter(function (t) {
    if (!q) return true;
    return ((t.name || '') + ' ' + (t.preview || '')).toLowerCase().indexOf(q) >= 0;
  });
  var list = q ? appendUniqueThreads(local, state.searchThreads) : local;

  if (!list.length) {
    box.innerHTML = '<div class="empty">' + (q && state.searchPending ? t('正在搜索所有会话标题…') :
      q ? t('没有匹配的会话') : t('还没有会话')) + '</div>';
  } else {

  // ── 按**项目**分组，可以折叠 ────────────────────────────────────────────────
  //
  // 项目分组与 DSH 保持一致。原来这里按服务端给的 section（时间是「今天 / 更早」那一类）分组，
  // 而且是死标题、不能收 —— 会话一多就得一直往下滚。
  //
  // 分组键用 cwd（工作目录），组名取目录名，右边小字给完整路径的一部分。
  // 组的顺序按「组里最近动过的那条」排 —— 常用项目自然浮到上面。
  var groups = {};
  var order = [];
  list.forEach(function (th) {
    var key = th.cwd || '';
    if (!groups[key]) { groups[key] = { key: key, items: [], latest: 0 }; order.push(key); }
    groups[key].items.push(th);
    var at = th.updatedAt || th.recencyAt || 0;
    var when = timestampMs(at);
    if (Number.isFinite(when) && when > groups[key].latest) groups[key].latest = when;
  });
  // 没有项目的那些放最后（比如还没定目录的会话）
  var sorted = order.slice().sort(function (a, b) {
    if (a === '') return 1;
    if (b === '') return -1;
    return groups[b].latest - groups[a].latest;
  });

  var folded = readFolded();

  // 搜索时**一律展开**：搜出来的东西藏在合着的组里，等于没搜到
  if (q) folded = {};

  // 全部折叠 / 全部展开 —— 会话多的时候一眼收干净
  var anyOpen = sorted.some(function (k) { return !folded[k]; });
  var all = document.createElement('button');
  all.className = 'pgfold';
  all.textContent = anyOpen ? t('全部折叠') : t('全部展开');
  all.onclick = function () {
    var next = readFolded();
    sorted.forEach(function (k) { if (anyOpen) next[k] = 1; else delete next[k]; });
    writeFolded(next);
    renderThreadListOnly();
  };
  box.appendChild(all);

  sorted.forEach(function (k) {
    var g = groups[k];
    var isFolded = !!folded[k];
    var head = document.createElement('button');
    head.className = 'pghead' + (isFolded ? ' closed' : '');

    var name = k ? baseName(k) : t('（没有项目）');
    var running = g.items.some(function (th) {
      var st = th.status && (th.status.type || th.status);
      return st === 'running' || st === 'active' || st === 'inProgress';
    });
    var waiting = g.items.some(function (th) {
      var flags = (th.status && th.status.activeFlags) || [];
      return flags.indexOf('waitingOnApproval') >= 0 || flags.indexOf('waitingOnUserInput') >= 0;
    });

    head.innerHTML = '<span class="arw">▼</span>' +
      '<span class="nm">' + esc(name) + '</span>' +
      '<span class="cnt">' + g.items.length + '</span>' +
      (running ? '<span class="live">' + esc(t('进行中')) + '</span>'
        : waiting ? '<span class="chip appr">' + esc(t('等待你')) + '</span>' : '') +
      (k ? '<span class="pth" title="' + esc(k) + '">' + esc(k) + '</span>' : '');
    head.onclick = function () {
      var next = readFolded();
      if (next[k]) delete next[k]; else next[k] = 1;
      writeFolded(next);
      renderThreadListOnly();
    };
    box.appendChild(head);

    if (isFolded) return;
    var wrap = document.createElement('div');
    wrap.className = 'pgwrap';
    g.items.forEach(function (th) { wrap.appendChild(threadRow(th)); });
    box.appendChild(wrap);
  });
  }

  // The first 60 are deliberately fast; make the boundary and the search
  // scope explicit instead of presenting a partial list as complete.
  var scope = document.createElement('div');
  scope.id = 'thread-list-scope';
  scope.style.cssText = 'font-size:12px;line-height:1.45;color:var(--dim);padding:14px 4px 7px;text-align:center';
  if (q) {
    scope.textContent = state.searchPending ? t('正在搜索所有会话标题…') :
      state.searchError ? t('搜索标题失败；当前仅搜索已加载的 {n} 条', { n: state.threads.length }) :
      state.searchReady ? t('已搜索所有会话标题；预览仅搜索已加载的 {n} 条', { n: state.threads.length }) :
      t('搜索所有会话标题；已加载会话的预览也会匹配');
  } else {
    scope.textContent = state.listPending ? t('正在检查更早的会话…') :
      state.listError ? t('暂时无法检查更早的会话') :
      state.listCursor ? t('已加载 {n} 条会话；还有更早的会话', { n: state.threads.length }) :
      t('已加载全部 {n} 条会话', { n: state.threads.length });
  }
  box.appendChild(scope);

  var cursor = q ? state.searchCursor : state.listCursor;
  var busy = q ? state.searchMorePending : state.listMorePending;
  if (cursor) {
    var more = document.createElement('button');
    more.id = 'thread-list-more';
    more.className = 'btn';
    more.textContent = busy ? t('正在加载…') : t(q ? '加载更多标题匹配' : '加载更早的会话');
    more.disabled = !!busy;
    more.onclick = loadOlderThreads;
    box.appendChild(more);
  } else if (q && state.searchError) {
    var retry = document.createElement('button');
    retry.className = 'btn'; retry.textContent = t('重试搜索');
    retry.onclick = function () { scheduleThreadSearch(); renderThreadListOnly(); };
    box.appendChild(retry);
  } else if (!q && state.listError) {
    var retryList = document.createElement('button');
    retryList.className = 'btn'; retryList.textContent = t('重试');
    retryList.onclick = loadThreads;
    box.appendChild(retryList);
  }
  if (window.DshI18n) window.DshI18n.apply(box);
}

// ── 项目折叠状态 ──────────────────────────────────────────────────────────────
//
// 存的是「哪些项目是合着的」（而不是哪些是开着的）：新项目默认展开 ——
// 刚开的会话总得看得见，不该被一个以前折过的同名项目连累。
function readFolded() {
  try {
    var raw = localStorage.getItem('codex-proj-folded-v1');
    var o = raw ? JSON.parse(raw) : {};
    return (o && typeof o === 'object') ? o : {};
  } catch (e) { return {}; }
}
function writeFolded(o) {
  try { localStorage.setItem('codex-proj-folded-v1', JSON.stringify(o || {})); } catch (e) { }
}


/**
 * 这个会话有没有「还没看过的新动静」？
 *
 * 判据只用服务端给的 updatedAt 和我们本地记的「上次打开时间」比 ——
 * 不猜内容、不数条数。所以它表达的是「这条比你看的时候新」，
 * 不是「有几条未读」：真实条数服务端并没有给，编一个数字出来就是伪造。
 */
function seenKey(tid) { return 'dsh-seen-' + tid; }
function markSeen(t) {
  if (!t || !t.id) return;
  try { localStorage.setItem(seenKey(t.id), String(Date.now())); } catch (e) { }
}
function isUnread(t) {
  var at = t && (t.updatedAt || t.recencyAt);
  if (!at || !t.id) return false;
  var seen = 0;
  try { seen = Number(localStorage.getItem(seenKey(t.id))) || 0; } catch (e) { return false; }
  var when = timestampMs(at);
  return Number.isFinite(when) && when > seen;
}

function threadRow(t) {
  var b = document.createElement('button');
  b.className = 'item';
  var title = displayThreadTitle(t,tr('（没有标题）'));
  var st = t.status && (t.status.type || t.status);
  var running = st === 'running' || st === 'active' || st === 'inProgress';
  var flags = (t.status && t.status.activeFlags) || [];
  var bits = [];
  if (running) bits.push('<span class="chip run">' + tr('进行中') + '</span>');
  // 待审批 / 等待你回复：**只看服务端给的 activeFlags**。
  // 没有这个字段就什么都不显示 —— 宁可少提示，也不凭空说「在等你」。
  if (flags.indexOf('waitingOnApproval') >= 0) bits.push('<span class="chip appr">' + tr('等待审批') + '</span>');
  else if (flags.indexOf('waitingOnUserInput') >= 0) bits.push('<span class="chip wait">' + tr('等待你回复') + '</span>');
  if (t.model) bits.push('<span class="chip">' + esc(t.model) + '</span>');
  if (t.reasoningEffort) bits.push('<span class="chip">' + esc(t.reasoningEffort) + '</span>');
  bits.push('<span>' + esc(relTime(t.updatedAt || t.recencyAt)) + '</span>');

  b.innerHTML = '<div class="t">' + (isUnread(t) ? '<span class="dot" aria-hidden="true"></span>' : '') +
    esc(title) + '</div>' +
    '<div class="m">' + bits.join('') + '</div>';
  b.onclick = function () { openThread(t); };
  return b;
}

function absoluteProjectPath(p) {
  return /^[A-Za-z]:[\\/]/.test(p) || /^\\\\[^\\]+\\[^\\]+(?:\\|$)/.test(p) || /^\//.test(p);
}
function openNewThreadPicker() {
  var inner = $('sheetInner'); inner.innerHTML = '';
  var title = document.createElement('h2'); title.textContent = t('＋ 开一个新会话'); inner.appendChild(title);
  var note = document.createElement('p'); note.className = 'info';
  note.textContent = t('先选择电脑上的项目文件夹，再创建会话。不会使用未知的默认目录。');
  inner.appendChild(note);
  var choices = state.projects.slice(0, 16);
  if (choices.length) {
    var heading = document.createElement('div'); heading.className = 'stitle'; heading.textContent = t('最近的项目'); inner.appendChild(heading);
    choices.forEach(function(project) {
      var row = document.createElement('button'); row.className = 'sopt';
      row.innerHTML = '<span class="t">' + esc(baseName(project.path)) + '</span><span class="s">' + esc(project.path) + '</span><span class="arw">›</span>';
      row.onclick = function() { closeSheet(); newThread(project.path); };
      inner.appendChild(row);
    });
  }
  var manual = document.createElement('div'); manual.className = 'stitle';
  manual.textContent = t('或输入电脑上的绝对路径'); inner.appendChild(manual);
  var path = document.createElement('input'); path.type = 'text'; path.autocomplete = 'off';
  path.placeholder = t('项目路径，例如 D:\\work\\project');
  promptInputStyle(path); path.style.marginBottom = '10px'; inner.appendChild(path);
  var create = document.createElement('button'); create.className = 'btn p';
  create.textContent = t('使用此文件夹新建');
  create.onclick = function() {
    var cwd = path.value.trim();
    if (!absoluteProjectPath(cwd)) { toast(t('请填写电脑上的绝对路径')); path.focus(); return; }
    closeSheet(); newThread(cwd);
  };
  inner.appendChild(create);
  var cancel = document.createElement('button'); cancel.className = 'sclose'; cancel.textContent = t('取消');
  cancel.onclick = closeSheet; inner.appendChild(cancel);
  $('sheet').classList.add('on');
}
function newThread(cwd) {
  if(state.handingBack){toast(t('正在检查交还，请稍候再操作。'));return;}
  if (typeof cwd !== 'string' || !absoluteProjectPath(cwd.trim())) { openNewThreadPicker(); return; }
  cwd = cwd.trim();
  setConn('wait', t('创建中'));
  var params = {};
  // The user explicitly chose this folder; never fall through to a hidden default.
  params.cwd = cwd;

  call('thread/start', params).then(function (r) {
    setConn('ok', '桥已连接');
    var th = (r && (r.thread || r)) || {};
    if (!th.id) throw new Error(t('服务端没返回会话 id'));
    // 新建的会话本来就是加载好的，不用再 resume
    openThread({
      id: th.id, name: th.name || '', preview: th.preview || t('新会话'), cwd: (r && r.cwd) || cwd,
      model: (r && r.model) || null, reasoningEffort: (r && r.reasoningEffort) || null
    }, {firstTurnPending:true});
    state.resumed = true;
    scheduleRelease();
  }).catch(function (e) {
    setConn('ok', '桥已连接');
    addError(t('开新会话失败：') + e.message);
  });
}

/** Continue in a separate conversation without taking the source writer lock.
 * The source may still be open on desktop. Never send the saved draft on the
 * user's behalf: the child is opened with the draft visible for review. */
function forkCurrentThread(source) {
  source=source || state.thread;
  if(!source || !source.id || !state.ready || state.forking || state.handingBack)return Promise.resolve(false);
  if(!state.thread || state.thread.id!==source.id)return Promise.resolve(false);
  var pending=draftAttachments(source.id).slice();
  if(pending.some(function(a){return a.status!=='ready';})){
    toast(t('请等待附件上传完成，或移除上传失败的附件'));return Promise.resolve(false);
  }
  var draft=$('input').value,sourceQueued=queueEntries.length;
  state.forking=source.id;renderFooter();setConn('wait',t('正在创建独立会话…'));
  return call('thread/fork',{threadId:source.id,excludeTurns:true,ephemeral:false},600000)
    .then(function(r){
      var child=(r && (r.thread||r))||{};
      if(!child.id || child.id===source.id)throw Error(t('服务端没返回新的会话 id'));
      setConn('ok','桥已连接');
      if(!state.thread || state.thread.id!==source.id || state.view!=='thread'){
        // The newly forked child is loaded by our app-server. If the user left
        // before it finished, do not let an unseen copy hold a writer lock.
        call('thread/unsubscribe',{threadId:child.id},10000).catch(function(){});
        toast(t('独立会话已创建，请在会话列表中打开。'));return true;
      }
      // The fork RPC may take minutes. Copy the draft as it was when the user
      // tapped the button, but preserve edits and uploads made in the meantime
      // on the source instead of silently erasing them when we switch views.
      var currentDraft=$('input').value;
      var currentAttachments=draftAttachments(source.id);
      var moved=pending.filter(function(a){return currentAttachments.indexOf(a)>=0 && a.status==='ready' && !a.removed;});
      var remaining=currentAttachments.filter(function(a){return moved.indexOf(a)<0;});
      var sourceChanged=currentDraft!==draft || remaining.length>0;
      if(currentDraft===draft)$('input').value='';
      textDrafts[source.id]=currentDraft===draft?'':currentDraft;
      textDrafts[child.id]=draft;
      attachmentDrafts[source.id]=remaining;
      moved.forEach(function(a){a.threadId=child.id;});
      attachmentDrafts[child.id]=moved;
      openThread({id:child.id,name:child.name||source.name||t('独立会话'),
        cwd:child.cwd||source.cwd,model:child.model||source.model,
        reasoningEffort:child.reasoningEffort||source.reasoningEffort});
      state.resumed=true;scheduleRelease();renderFooter();
      toast(t('已创建独立会话。电脑上的原会话继续运行；请检查输入后再发送。'));
      if(sourceChanged)toast(t('创建期间新增的文字或附件仍留在原会话。'));
      if(sourceQueued)toast(t('原会话已保存的待办仍留在原会话，尚未执行。'));
      return true;
    })
    .catch(function(e){setConn('ok','桥已连接');toast(t('创建独立会话失败；原会话和输入未改变：')+e.message);return false;})
    .finally(function(){state.forking=false;renderFooter();});
}

// ── 单个会话 ─────────────────────────────────────────────────────────────────
/**
 * 打开一个会话 —— 只取最新一屏，往上滑再继续取。
 *
 * 这一版有两个关键改动，都是被大会话逼出来的：
 *
 * 1. **不再一进来就 resume**。resume 会把整个 rollout 加载进内存 ——
 *    实测一条 3.3GB 的会话要 3 分钟以上还没完。而**读历史根本不需要它**：
 *    `thread/items/list` 在同一个会话上只花 0.0 秒。
 *    所以 resume 推迟到真要发消息时才做。
 *
 * 2. **只取最新一页**（`sortDirection:'desc'` 拿到的就是最新的），
 *    往上滑再用 `nextCursor` 取更早的。会话有 3GB 还是 3MB，打开都是一瞬间。
 */
var PAGE_SIZE = 30;

function openThread(t, options) {
  stopObserving();
  if(detachedHandbacks[t.id]){
    clearTimeout(detachedHandbacks[t.id]);delete detachedHandbacks[t.id];
  }
  clearTimeout(state.releaseTimer);state.releaseTimer=null;
  rememberTextDraft();
  if (state.thread && state.thread.id !== t.id) releaseThread();
  state.view = 'thread';
  state.thread = t;
  state.pick = threadPicks[t.id] || (threadPicks[t.id] = { model: null, effort: null });
  // The supported effort list is derived from the current model. Never carry
  // the previous conversation's cached list into this one's settings menu.
  state.currentEfforts = null;
  taskStatusExpanded = false;
  restoreTextDraft(t);
  markSeen(t);       // 记下「这条我看过了」，列表里的未读点靠它消掉
  queueEntries=[];renderQueue();refreshQueue();
  state.items = {}; state.order = [];
  resetConversationScroll();
  // 换会话时把「等回推的占位」也清掉：它们属于上一条会话，留着会认错人
  state.pendingLocal = [];
  state.running = false;
  state.turnId = null;
  state.awaitingFirstTurn = !!(options && options.firstTurnPending);
  state.resuming = false;
  task = {kind:state.awaitingFirstTurn?'idle':'checking',detail:state.awaitingFirstTurn?tr('可以发送消息开始任务。'):tr('正在读取最近一轮任务的状态。'),activity:'',syncedAt:0};
  state.resumed = state.awaitingFirstTurn;
  state.olderCursor = null;
  state.loadingOlder = false;
  state.noMore = false;
  renderPendingApprovals();

  $('title').textContent = displayThreadTitle(t,tr('会话'));
  $('back').style.display = '';
  $('footer').style.display = '';
  $('body').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  renderFooter();
  var epoch = observerEpoch;

  call('thread/items/list', {
    threadId: t.id, limit: PAGE_SIZE, sortDirection: 'desc'
  }).then(function (r) {
    if (epoch !== observerEpoch || state.view !== 'thread') return;
    $('body').innerHTML = '';
    var rows = (r && r.data) || [];
    state.olderCursor = (r && r.nextCursor) || null;
    state.noMore = !state.olderCursor;

    if (!rows.length) {
      $('body').innerHTML = '<div class="empty"><div class="big">👋</div>' + tr('这是一个新会话。<br>在下面输入框里说点什么。') + '</div>';
    }
    // 服务端给的是「从新到旧」，界面要从上到下越来越新，所以倒过来渲染
    rows.slice().reverse().forEach(function (row) { appendItem(row.item || row); });
    if (window.DshI18n) window.DshI18n.apply($('body'));

    if (state.olderCursor) prependOlderHint();
    renderFooter();
    tidyItems();
    scrollDown(true);
    startObserving();

  }).catch(function (e) {
    if (epoch !== observerEpoch || state.view !== 'thread') return;
    startObserving();
    // 刚建出来的会话还没有落盘的记录，服务端会回「not supported yet」之类的话。
    // 那不是错误 —— 它就是「还没有历史」，按空会话显示就好。
    // 把它当错误弹出来，使用者会以为开新会话失败了。
    if (/not supported|no rollout|not found|not loaded/i.test(e.message)) {
      $('body').innerHTML = '<div class="empty"><div class="big">👋</div>' + tr('这是一个新会话。<br>在下面输入框里说点什么。') + '</div>';
      renderFooter();
      return;
    }
    $('body').innerHTML = '';
    addError(tr('读不到会话内容：') + e.message);
  });
}

/**
 * 在后台把这个会话加载起来，好让「发送」不用等。
 *
 * 关键在 `excludeTurns: true` —— 它让服务端**只建立会话、不读历史**。
 *
 * 一开始我以为「发消息必须先 resume，而 resume 就是读整个存档」，
 * 于是大会话（实测 3.4GB 的）要等几分钟，界面上一直显示「正在加载对话」。
 * 检查 schema 后发现 ThreadResumeParams 里本来就有这个开关：
 *
 *   excludeTurns: "return only thread metadata and live-resume state
 *                  without populating `thread.turns`"
 *
 * 实测同一条 3.4GB 的会话：完整加载 200 秒都没完，
 * 带 excludeTurns 只要 **1.1 秒**，而且紧接着就能 turn/start。
 * 历史本来就走 thread/items/list 分页拉，根本不需要 resume 去读。
 */
function warmUpThread() { /* 不再预加载：翻看会话不该占电脑的写锁。 只在真正要发消息时才 resume。 */ }

/** A short follow-up grace period, scoped to this exact conversation. */
function scheduleRelease() {
  clearTimeout(state.releaseTimer);
  state.releaseTimer = null;
  if(!state.resumed || !state.thread || state.handingBack || state.queueActivating || state.renameEditingId===state.thread.id)return;
  // An empty thread has no persisted rollout yet. Unsubscribing after 30 seconds
  // destroys it, so a person still writing their first message cannot resume it.
  // Leaving the page still releases it; after the first turn, normal handback resumes.
  if(state.awaitingFirstTurn)return;
  var tid=state.thread.id;
  state.releaseTimer = setTimeout(function () {
    state.releaseTimer=null;
    if(!state.thread || state.thread.id!==tid)return;
    if (state.running || state.resuming || state.handingBack || state.queueActivating) { scheduleRelease(); return; }
    releaseThread();
    renderFooter();
  }, 30 * 1000);
}

/** 把一个 item 渲染并接到末尾 */
function appendItem(it) {
  if (!it || !it.id || state.items[it.id]) return null;
  var rec = state.items[it.id] = { item: it, acc: it.text || '', created: false, snapshot:JSON.stringify(it) };
  state.order.push(it.id);
  rec.el = buildItem(it, rec);
  $('body').appendChild(rec.el);
  return rec.el;
}

/** 把一批（从新到旧）插到最前面，保持时间顺序 */
function prependItems(rows) {
  var frag = document.createDocumentFragment();
  rows.slice().reverse().forEach(function (row) {
    var it = row.item || row;
    if (!it || !it.id || state.items[it.id]) return;
    var rec = state.items[it.id] = { item: it, acc: it.text || '', created: false };
    // 插到最前面，但顺序要保持：倒着遍历时用 insertBefore 逐个往前放
    rec.el = buildItem(it, rec);
    frag.insertBefore(rec.el, frag.firstChild);
  });
  var body = $('body');
  body.insertBefore(frag, body.firstChild);
}

/** 顶部那个「正在加载更早的」提示 */
function prependOlderHint() {
  var old = document.getElementById('older-hint');
  if (old) old.remove();
  var d = document.createElement('div');
  d.id = 'older-hint';
  d.style.cssText = 'text-align:center;color:var(--dim);font-size:12.5px;' +
    'padding:14px 0 10px';
  d.textContent = state.noMore ? t('已经是最早的了') : t('往上滑加载更早的');
  $('body').insertBefore(d, $('body').firstChild);
}

/**
 * 往上翻一页。
 *
 * 要点是**保持视野不动**：内容插在前面会把整页往下顶。
 *
 * 一开始我用「内容长高了多少、就把滚动位置补多少」来算，实测补多了两倍
 * （增高 2513px 却补了 5433px）—— 因为插进来的内容随后还会被合并、被折叠，
 * 高度在一次更新里会变好几次，拿某一时刻的高度差去补必然对不上。
 *
 * 改成**锚定一个元素**：记下「此刻视野最上面那一条」相对视口的位置，
 * 更新完再把它对回同一个位置。这样中间高度怎么变都不影响。
 */
function loadOlder() {
  if (state.loadingOlder || state.noMore || !state.olderCursor || state.view !== 'thread') return;
  state.loadingOlder = true;

  var hint = document.getElementById('older-hint');
  if (hint) hint.textContent = t('正在加载更早的…');

  var main = $('main');
  var anchor = firstVisibleBlock();
  var anchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
  // 兜底用：万一锚点还是没了（比如被合并掉），至少按高度差补一下，
  // 总比完全不补、让页面猛地跳走要好
  var prevHeight = main.scrollHeight;
  var prevTop = main.scrollTop;

  call('thread/items/list', {
    threadId: state.thread.id, limit: PAGE_SIZE,
    sortDirection: 'desc', cursor: state.olderCursor
  }).then(function (r) {
    var rows = (r && r.data) || [];
    state.olderCursor = (r && r.nextCursor) || null;
    state.noMore = !state.olderCursor;

    if (rows.length) {
      prependItems(rows);
      tidyItems();
      prependOlderHint();

      var fixed = false;
      var stopAll = function () {
        // anchorTimers 现在是 requestAnimationFrame 的 id（一个数字），
        // 不再是定时器数组 —— 两种都兜住，免得改法变一次就抛一次
        var t = state.anchorTimers;
        if (Array.isArray(t)) t.forEach(clearTimeout);
        else if (t) (window.cancelAnimationFrame || clearTimeout)(t);
        state.anchorTimers = null;
        state.anchorStop = null;
      };
      var fix = function () {
        if (anchor && anchor.isConnected) {
          var diff = anchor.getBoundingClientRect().top - anchorTop;
          if (Math.abs(diff) > 1) main.scrollTop += diff;
